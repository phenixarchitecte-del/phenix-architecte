<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet DTU">
<title>Carnet DTU — Référence Chantier</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2335;--border:#2a3050;--accent:#e8a838;--accent2:#4fc4cf;--text:#e8ecf4;--text-muted:#7a86a8;--radius:12px;--sidebar-w:230px;--header-h:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.6;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:var(--header-h);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:50}
.logo{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:"Syne",sans-serif;font-weight:800;font-size:16px;color:#0f1117;flex-shrink:0}
.header-title h1{font-family:"Syne",sans-serif;font-weight:700;font-size:17px}
.header-title p{font-size:11px;color:var(--text-muted)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-wrap{position:relative}
.search-wrap input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px 8px 34px;border-radius:8px;font-family:"DM Sans",sans-serif;font-size:13px;width:200px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;width:14px}
.install-btn{background:var(--accent);color:#0f1117;border:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;white-space:nowrap;display:none;align-items:center;gap:5px}
.install-btn.show{display:flex}
.app-body{flex:1;display:flex;overflow:hidden}
nav.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);padding:6px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;font-size:13px;font-weight:500;user-select:none}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent);color:#0f1117}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.nav-count{margin-left:auto;font-size:10px;background:var(--surface2);padding:1px 6px;border-radius:10px;color:var(--text-muted)}
.nav-item.active .nav-count{background:rgba(0,0,0,.2);color:#0f1117}
main{flex:1;overflow-y:auto;padding:24px 22px;-webkit-overflow-scrolling:touch}
.sec-panel{display:none}
.section-hd{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.section-hd-icon{width:50px;height:50px;background:var(--surface2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--border);flex-shrink:0}
.section-hd h2{font-family:"Syne",sans-serif;font-weight:700;font-size:21px}
.section-hd p{color:var(--text-muted);font-size:12px;margin-top:1px}
.sub-title{font-family:"Syne",sans-serif;font-weight:700;font-size:13.5px;color:var(--accent);margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.sub-title::after{content:"";flex:1;height:1px;background:var(--border)}
.dtu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:8px}
.dtu-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.dtu-card:hover{border-color:rgba(79,196,207,.5);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.dtu-card-head{background:var(--surface2);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dtu-num{font-family:"Syne",sans-serif;font-weight:800;font-size:12px;color:var(--accent);letter-spacing:.8px}
.dtu-tag{font-size:10.5px;background:rgba(79,196,207,.1);color:var(--accent2);padding:2px 7px;border-radius:20px;border:1px solid rgba(79,196,207,.2);white-space:nowrap}
.dtu-card-body{padding:12px 14px}
.dtu-card h3{font-family:"Syne",sans-serif;font-weight:600;font-size:13.5px;margin-bottom:6px;line-height:1.4}
.dtu-desc{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5}
.vigilance{border-top:1px solid var(--border);padding-top:9px}
.vig-title{font-size:10.5px;font-weight:500;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.vigilance ul{list-style:none}
.vigilance li{font-size:11.5px;color:var(--text-muted);padding:2px 0 2px 13px;position:relative;line-height:1.4}
.vigilance li::before{content:"\25B8";position:absolute;left:0;color:var(--accent2);font-size:9px;top:4px}
.schema-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 11px;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.22);color:var(--accent);border-radius:6px;font-size:11.5px;font-weight:500;cursor:pointer;transition:background .15s;font-family:"DM Sans",sans-serif}
.schema-btn:hover{background:rgba(232,168,56,.2)}
.source-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;margin-left:6px;padding:5px 11px;background:rgba(79,196,207,.08);border:1px solid rgba(79,196,207,.22);color:var(--accent2);border-radius:6px;font-size:11.5px;font-weight:500;cursor:pointer;transition:background .15s;font-family:"DM Sans",sans-serif;text-decoration:none}
.source-btn:hover{background:rgba(79,196,207,.18)}
.free-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;margin-left:6px;padding:5px 11px;background:rgba(80,200,100,.08);border:1px solid rgba(80,200,100,.28);color:#6dcc88;border-radius:6px;font-size:11.5px;font-weight:500;cursor:pointer;transition:background .15s;font-family:"DM Sans",sans-serif;text-decoration:none}
.free-btn:hover{background:rgba(80,200,100,.18)}
.card-actions{display:flex;flex-wrap:wrap;gap:0;align-items:center}
.mobile-tabs{display:none;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;flex-shrink:0;scrollbar-width:none}
.mobile-tabs::-webkit-scrollbar{display:none}
.mobile-tab{flex-shrink:0;padding:12px 14px;font-size:12.5px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;font-family:"DM Sans",sans-serif;font-weight:500;user-select:none}
.mobile-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:92vh;overflow-y:auto;padding:24px}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.modal-close{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal h2{font-family:"Syne",sans-serif;font-size:17px;font-weight:700;line-height:1.3}
.modal .dtu-num-modal{font-size:11px;margin-bottom:3px;display:block;color:var(--accent);font-family:"Syne",sans-serif;font-weight:800}
.schema-box{background:#fff;border-radius:10px;padding:20px;margin:14px 0;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.schema-box svg{max-width:100%;height:auto}
.modal-desc-text{font-size:12.5px;color:var(--text-muted);line-height:1.6}
.search-panel{display:none}
.search-panel h2{font-family:"Syne",sans-serif;font-size:18px;margin-bottom:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:768px){nav.sidebar{display:none}.mobile-tabs{display:flex}main{padding:16px 14px}.dtu-grid{grid-template-columns:1fr}.search-wrap input{width:130px}header{padding:0 12px;gap:8px}.header-title p{display:none}:root{--header-h:56px}}
@media(min-width:769px){.mobile-tabs{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">DTU</div>
  <div class="header-title">
    <h1>Carnet DTU</h1>
    <p>Référence Chantier — Architecte MOE</p>
  </div>
  <div class="header-actions">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher un DTU…" autocomplete="off">
    </div>
    <button class="install-btn" id="installBtn" onclick="installPWA()">Installer</button>
  </div>
</header>
<div class="mobile-tabs" id="mobileTabs"></div>
<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="mainContent">
    <div class="search-panel" id="searchPanel"></div>
  </main>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hd">
      <div><span class="dtu-num-modal" id="mNum"></span><h2 id="mTitle"></h2></div>
      <button class="modal-close" id="modalCloseBtn">&#10005;</button>
    </div>
    <div class="schema-box" id="mSchema"></div>
    <p class="modal-desc-text" id="mDesc"></p>
  </div>
</div>
<script>

const schemas = {

fondation:{title:'Coupe — Semelle filante béton armé',desc:'La semelle filante reprend les charges du mur. Largeur B calculée selon descente de charge et contrainte admissible du sol. Profondeur hors-gel obligatoire.',svg:`<svg viewBox="0 0 480 310" width="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif"><rect x="0" y="160" width="480" height="150" fill="#c8b89a"/><line x1="0" y1="172" x2="30" y2="142" stroke="#a09070" stroke-width="1"/><line x1="20" y1="172" x2="50" y2="142" stroke="#a09070" stroke-width="1"/><line x1="40" y1="172" x2="70" y2="142" stroke="#a09070" stroke-width="1"/><line x1="380" y1="172" x2="410" y2="142" stroke="#a09070" stroke-width="1"/><line x1="400" y1="172" x2="430" y2="142" stroke="#a09070" stroke-width="1"/><line x1="420" y1="172" x2="450" y2="142" stroke="#a09070" stroke-width="1"/><rect x="130" y="205" width="220" height="65" fill="#d0cfc0" stroke="#555" stroke-width="2"/><circle cx="155" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><circle cx="185" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><circle cx="215" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><circle cx="265" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><circle cx="295" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><circle cx="325" cy="254" r="5" fill="#888" stroke="#333" stroke-width="1.5"/><rect x="195" y="90" width="90" height="118" fill="#e8e0d0" stroke="#555" stroke-width="2"/><line x1="130" y1="290" x2="350" y2="290" stroke="#e8174d" stroke-width="1.5"/><line x1="130" y1="287" x2="130" y2="293" stroke="#e8174d"/><line x1="350" y1="287" x2="350" y2="293" stroke="#e8174d"/><text x="240" y="303" text-anchor="middle" fill="#e8174d" font-size="11" font-weight="bold">B (largeur calculée)</text><text x="60" y="155" fill="#2266cc" font-size="11">TN</text><text x="5" y="208" fill="#2266cc" font-size="10">Hors-gel</text><text x="5" y="219" fill="#2266cc" font-size="10">≥ 80cm</text><line x1="62" y1="160" x2="62" y2="205" stroke="#2266cc" stroke-width="1.5" stroke-dasharray="5,3"/><text x="150" y="244" fill="#e87c17" font-size="10">enr.5cm</text><text x="240" y="240" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">SEMELLE FILANTE BA</text></svg>`},

ext><rect x="0" y="280" width="12" height="10" fill="#e87c17"/><text x="16" y="290" fill="#ccc" font-size="11">Joint ext. F25E</text><rect x="130" y="280" width="12" height="10" fill="#4fc4cf"/><text x="146" y="290" fill="#ccc" font-size="11">Joint int. air</text><rect x="260" y="280" width="12" height="10" fill="#8b6914"/><text x="276" y="290" fill="#ccc" font-size="11">Bâti bois/alu</text><text x="50" y="300" text-anchor="middle" fill="#888" font-size="11" font-weight="bold">← EXT.</text><text x="430" y="300" text-anchor="middle" fill="#888" font-size="11" font-weight="bold">INT. →</text></svg>`},

menuiserieAlu:{title:'Coupe — Profilé aluminium RPT',desc:'La rupture de pont thermique (RPT) sépare les parties intérieure et extérieure du profilé alu par une barrette polyamide. La distance minimale est de 24 mm pour être conforme RE2020.',svg:`<svg viewBox="0 0 380 270" width="360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif"><rect x="60" y="55" width="60" height="160" fill="#b8c4d0" stroke="#445566" stroke-width="2"/><text x="90" y="100" text-anchor="middle" fill="#223" font-size="9">Profil ext.</text><rect x="120" y="75" width="24" height="120" fill="#e8c060" stroke="#aa8800" stroke-width="2"/><text x="132" y="140" text-anchor="middle" fill="#553300" font-size="8.5" transform="rotate(-90,132,140)">RPT polyamide</text><rect x="144" y="55" width="60" height="160" fill="#b8c4d0" stroke="#445566" stroke-width="2"/><text x="174" y="100" text-anchor="middle" fill="#223" font-size="9">Profil int.</text><rect x="204" y="75" width="30" height="120" fill="#c8d4e0" stroke="#445566" stroke-width="1.5"/><rect x="234" y="75" width="8" height="120" fill="#333" stroke="#111" stroke-width="1"/><rect x="242" y="75" width="60" height="120" fill="#cce8ff" stroke="#336699" stroke-width="2"/><text x="272" y="140" text-anchor="middle" fill="#336699" font-size="10" font-weight="bold">DV</text><text x="272" y="153" text-anchor="middle" fill="#336699" font-size="9">4/16/4</text><circle cx="220" cy="188" r="5" fill="#e8174d"/><text x="228" y="210" fill="#e8174d" font-size="10">drainage</text><line x1="120" y1="50" x2="144" y2="50" stroke="#aa8800" stroke-width="1.5"/><line x1="120" y1="47" x2="120" y2="53" stroke="#aa8800"/><line x1="144" y1="47" x2="144" y2="53" stroke="#aa8800"/><text x="132" y="42" text-anchor="middle" fill="#aa8800" font-size="11" font-weight="bold">≥24mm RPT</text><text x="30" y="140" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">EXT.</text><text x="350" y="140" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">I // ── PWA ──
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').classList.add('show');
});
function installPWA() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById('installBtn').classList.remove('show'); }); }
  else { alert('Menu navigateur > Ajouter a l\'ecran d\'accueil'); }
}

// ── STATE ──
var currentId = null;

// ── SHOW PANEL ──
function showPanel(id) {
  var panels = document.querySelectorAll('.sec-panel');
  for (var i = 0; i < panels.length; i++) { panels[i].style.display = 'none'; }
  document.getElementById('searchPanel').style.display = 'none';

  if (id === '__search__') {
    document.getElementById('searchPanel').style.display = 'block';
  } else {
    var el = document.getElementById('sec-' + id);
    if (el) { el.style.display = 'block'; }
    currentId = id;
    var navItems = document.querySelectorAll('.nav-item, .mobile-tab');
    for (var j = 0; j < navItems.length; j++) { navItems[j].classList.remove('active'); }
    var actives = document.querySelectorAll('[data-id="' + id + '"]');
    for (var k = 0; k < actives.length; k++) { actives[k].classList.add('active'); }
    document.getElementById('mainContent').scrollTop = 0;
    document.getElementById('searchInput').value = '';
  }
}

// ── BUILD NAV ──
function countDTU(cat) {
  var n = 0;
  for (var i = 0; i < cat.subsections.length; i++) { n += cat.subsections[i].items.length; }
  return n;
}

function buildNav() {
  var sb = document.getElementById('sidebar');
  var mt = document.getElementById('mobileTabs');
  var total = 0;
  for (var i = 0; i < categories.length; i++) { total += countDTU(categories[i]); }
  var lbl = document.createElement('div');
  lbl.className = 'nav-label';
  lbl.textContent = total + ' DTU — ' + categories.length + ' domaines';
  sb.appendChild(lbl);

  for (var i = 0; i < categories.length; i++) {
    (function(cat, idx) {
      var n = countDTU(cat);
      var div = document.createElement('div');
      div.className = 'nav-item' + (idx === 0 ? ' active' : '');
      div.setAttribute('data-id', cat.id);
      div.innerHTML = '<span class="nav-icon">' + cat.icon + '</span><span>' + cat.label + '</span><span class="nav-count">' + n + '</span>';
      div.addEventListener('click', function() { showPanel(cat.id); });
      sb.appendChild(div);

      var tab = document.createElement('div');
      tab.className = 'mobile-tab' + (idx === 0 ? ' active' : '');
      tab.setAttribute('data-id', cat.id);
      tab.textContent = cat.icon + ' ' + cat.label;
      tab.addEventListener('click', function() { showPanel(cat.id); });
      mt.appendChild(tab);
    })(categories[i], i);
  }
}

function dtuSearchURLs(num) {
  var clean = num.replace(/^(NF\s*)?(DTU\s*)?/i, '').trim();
  return {
    free: 'https://batipedia.com/recherche?q=' + encodeURIComponent(num),
    afnor: 'https://www.boutique.afnor.org/fr-fr/recherche?q=' + encodeURIComponent(num)
  };
}

  var hasSchema = item.schema && (schemas[item.schema] || schemasSVG[item.schema]);
  var schemaBtn = hasSchema
    ? '<button class="schema-btn" data-schema="' + item.schema + '" data-num="' + item.num.replace(/"/g,'&quot;') + '" data-label="' + item.label.replace(/"/g,'&quot;') + '">&#128208; Schema</button>'
    : '';
  var urls = dtuSearchURLs(item.num);
  var freeBtn = '<a class="free-btn" href="' + urls.free + '" target="_blank" rel="noopener" title="Fiche descriptive CSTB (accès gratuit)">&#128218; CSTB fiche</a>';
  var afnorBtn = '<a class="source-btn" href="' + urls.afnor + '" target="_blank" rel="noopener" title="Fiche officielle AFNOR (payant)">&#128279; AFNOR</a>';
  var vigItems = '';
  for (var v = 0; v < item.vigilance.length; v++) { vigItems += '<li>' + item.vigilance[v] + '</li>'; }
  return '<div class="dtu-card">'
    + '<div class="dtu-card-head"><span class="dtu-num">' + item.num + '</span><span class="dtu-tag">' + item.tag + '</span></div>'
    + '<div class="dtu-card-body"><h3>' + item.label + '</h3>'
    + '<p class="dtu-desc">' + item.desc + '</p>'
    + '<div class="vigilance"><div class="vig-title">Points de vigilance</div><ul>' + vigItems + '</ul></div>'
    + '<div class="card-actions">' + schemaBtn + freeBtn + afnorBtn + '</div>'
    + '</div></div>';
}

// ── BUILD SECTIONS ──
function buildSections() {
  var main = document.getElementById('mainContent');
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var sec = document.createElement('div');
    sec.className = 'sec-panel';
    sec.id = 'sec-' + cat.id;
    sec.style.display = (i === 0) ? 'block' : 'none';

    var html = '<div class="section-hd">'
      + '<div class="section-hd-icon">' + cat.icon + '</div>'
      + '<div><h2>' + cat.label + '</h2><p>' + cat.desc + '</p></div></div>';

    for (var s = 0; s < cat.subsections.length; s++) {
      var sub = cat.subsections[s];
      html += '<div class="sub-title">&#128208; ' + sub.title + '</div><div class="dtu-grid">';
      for (var it = 0; it < sub.items.length; it++) { html += cardHTML(sub.items[it]); }
      html += '</div>';
    }
    sec.innerHTML = html;
    main.appendChild(sec);
  }
  if (categories.length > 0) { currentId = categories[0].id; }
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  var sp = document.getElementById('searchPanel');
  if (!q) { showPanel(currentId || (categories.length ? categories[0].id : '')); return; }

  var found = [];
  for (var c = 0; c < categories.length; c++) {
    for (var s = 0; s < categories[c].subsections.length; s++) {
      var items = categories[c].subsections[s].items;
      for (var it = 0; it < items.length; it++) {
        var item = items[it];
        var text = item.num + ' ' + item.label + ' ' + item.tag + ' ' + item.desc + ' ' + item.vigilance.join(' ');
        if (text.toLowerCase().indexOf(q) !== -1) { found.push(item); }
      }
    }
  }

  var html = '<h2>Resultats : <span style="color:var(--accent)">' + found.length + ' DTU</span> pour "' + q + '"</h2>';
  if (!found.length) { html = '<h2>Aucun resultat pour "' + q + '"</h2>'; }
  else {
    html += '<div class="dtu-grid">';
    for (var fi = 0; fi < found.length; fi++) { html += cardHTML(found[fi]); }
    html += '</div>';
  }
  sp.innerHTML = html;
  showPanel('__search__');
});

// ── SCHEMA BUTTONS (event delegation) ──
document.getElementById('mainContent').addEventListener('click', function(e) {
  var btn = e.target.closest('.schema-btn');
  if (!btn) return;
  var key = btn.getAttribute('data-schema');
  var num = btn.getAttribute('data-num');
  var label = btn.getAttribute('data-label');
  openModal(key, num, label);
});

// ── MODAL ──
function openModal(key, num, label) {
  var s = schemas[key];
  var svgStr = schemasSVG ? schemasSVG[key] : null;
  if (!s && !svgStr) return;
  document.getElementById('mNum').textContent = num;
  document.getElementById('mTitle').textContent = s ? s.title : label;
  document.getElementById('mSchema').innerHTML = s ? s.svg : svgStr;
  document.getElementById('mDesc').textContent = s ? s.desc : '';
  document.getElementById('overlay').classList.add('open');
}
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) { this.classList.remove('open'); }
});
document.getElementById('modalCloseBtn').addEventListener('click', function() {
  document.getElementById('overlay').classList.remove('open');
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { document.getElementById('overlay').classList.remove('open'); }
});

// ── INIT ──
buildNav();
buildSections();
</script>
</body>
</html>
