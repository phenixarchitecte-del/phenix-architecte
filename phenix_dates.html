<!doctype html>
<html lang="fr">
<head>
<!--
 phenix_dates.html — [Dates artisans] page PUBLIQUE (sans compte) où une entreprise saisit ses dates d'intervention.
 Le lien est personnel : ?t=<jeton>. Le jeton est l'identifiant du document phenix_ch_dates/{jeton} (Firestore) ;
 l'entreprise n'y voit que son chantier, ses lots et ses dates — jamais de montants ni d'autres entreprises.
 Les dates saisies arrivent dans le Planning du module Chantier (appliquées automatiquement à l'ouverture du module).
 13/11/2026 — création.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2247">
<title>Phénix-Architecture · Vos dates d'intervention</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<style>
:root{--navy:#0E2247;--ink:#0B1630;--mute:#56637E;--line:#CBD3E2;--bg:#EDF0F6;--blue:#1F62B8;--blue-bg:#DCE8F8;--green:#1E7A4C;--green-bg:#E1F2E8;--red:#A33A1F;--red-bg:#FBE9E3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:16px 18px 14px;padding-top:max(16px,env(safe-area-inset-top))}
header .k{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
header .t{font:24px/1.15 'DM Serif Display',Georgia,serif;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mute{color:var(--mute)}
.lot h2{margin:0;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input[type=date],textarea{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%;min-height:48px}
textarea{min-height:64px;resize:vertical}
.chk{flex-direction:row;align-items:center;gap:10px;font-weight:500;min-height:44px}
.chk input{width:22px;height:22px}
.btn{min-height:52px;padding:12px 18px;border-radius:12px;border:0;background:var(--blue);color:#fff;font:700 17px 'DM Sans',system-ui,sans-serif;cursor:pointer;width:100%}
.btn:disabled{opacity:.55}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.ok{background:var(--green-bg);border:1.5px solid var(--green);color:#10492c}
.note.err{background:var(--red-bg);border:1.5px solid var(--red);color:#6e2410}
.dur{font-size:13px;color:var(--mute);min-height:18px}
.recap li{margin:4px 0}
</style>
</head>
<body>
<header><div class="k">Phénix-Architecture</div><div class="t" id="titre">Vos dates d'intervention</div></header>
<main id="main"><div class="card mute">Chargement…</div></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';
import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCjNKNvS6p3nqE6-_Gw9I397ZtXm2FG1ew", authDomain: "phenix-architecte-9151b.firebaseapp.com", projectId: "phenix-architecte-9151b",
  storageBucket: "phenix-architecte-9151b.firebasestorage.app", messagingSenderId: "811231684720", appId: "1:811231684720:web:413fa324ae43c07607acb5"
});
try { initializeAppCheck(app, { provider: new ReCaptchaV3Provider('6LeObWktAAAAAL9eyppDRtLp5yZTyBaF4ZNKXNIO'), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn('App Check', e); }
const db = getFirestore(app);

const $ = (id) => document.getElementById(id), main = $('main');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fr = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.split('-').reverse().join('/') : '');
const DATE = /^\d{4}-\d{2}-\d{2}$/;
const tok = (new URLSearchParams(location.search).get('t') || location.hash.replace(/^#/, '') || '').trim();

let D = null, ref = null;
function erreur(titre, texte) { main.innerHTML = `<div class="card"><b>${esc(titre)}</b><div class="mute">${esc(texte)}</div></div>`; }

async function charger() {
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(tok)) return erreur('Lien incomplet', "Ce lien semble coupé. Ouvrez-le à nouveau depuis le message reçu, ou demandez-nous de vous le renvoyer.");
  try {
    ref = doc(db, 'phenix_ch_dates', tok);
    const s = await getDoc(ref);
    if (!s.exists()) return erreur('Lien introuvable', "Ce lien n'est plus valide. Demandez-nous de vous en envoyer un nouveau.");
    D = s.data();
  } catch (e) { return erreur('Connexion impossible', "Vérifiez votre connexion puis rechargez la page."); }
  if (D.expireMs && Date.now() > D.expireMs) return erreur('Lien expiré', "Ce lien n'est plus actif. Demandez-nous de vous en envoyer un nouveau.");
  dessiner();
}

function dessiner(envoye) {
  $('titre').textContent = D.chantierNom ? 'Chantier ' + D.chantierNom : "Vos dates d'intervention";
  const rep = D.reponses || {}, dejaRepondu = D.statut === 'repondu' || D.statut === 'applique';
  const lots = (D.lots || []).map((l) => {
    const r = rep[l.id] || {};
    const debut = r.debut || l.debut || '', fin = r.fin || l.fin || '';
    return `<div class="card lot" data-id="${esc(l.id)}">
      <h2>${esc(l.nom)}</h2>
      <div class="row">
        <label>Début<input type="date" class="d1" value="${esc(debut)}"></label>
        <label>Fin<input type="date" class="d2" value="${esc(fin)}"></label>
      </div>
      <div class="dur"></div>
      <label class="chk"><input type="checkbox" class="indispo"${r.indispo ? ' checked' : ''}> Je ne peux pas intervenir sur ces dates : à rediscuter</label>
      <label>Remarque (facultatif)<textarea class="note" maxlength="300" placeholder="Ex. : disponible à partir du 10, 2 jours de séchage à prévoir">${esc(r.note || '')}</textarea></label>
    </div>`;
  }).join('');
  main.innerHTML =
    (envoye ? '<div class="note ok"><b>✓ Merci !</b> Vos dates ont bien été transmises à Phénix-Architecture. Vous pouvez encore les modifier ci-dessous, puis renvoyer.</div>' :
      dejaRepondu ? '<div class="note ok"><b>✓ Dates déjà reçues</b>' + (D.repondu_le ? ' le ' + esc(fr(String(D.repondu_le).slice(0, 10))) : '') + '. Vous pouvez les modifier et renvoyer.</div>' : '') +
    `<div class="card"><div><b>Bonjour${D.entreprise ? ' ' + esc(D.entreprise) : ''},</b></div>
      <div>Pour organiser le chantier, merci d'indiquer vos dates d'intervention pour ${(D.lots || []).length > 1 ? 'chacun de vos lots' : 'votre lot'}. Cela prend deux minutes, sans compte à créer.</div>
      ${D.message ? '<div class="note" style="background:var(--blue-bg);border:1.5px solid var(--blue)">' + esc(D.message) + '</div>' : ''}</div>` +
    lots +
    '<div id="err"></div><button class="btn" id="env">Envoyer mes dates</button>' +
    '<div class="mute" style="font-size:13px;text-align:center">Seules vos dates sont transmises. Aucun montant n\'est affiché sur cette page.</div>';
  main.querySelectorAll('.lot').forEach((c) => { c.querySelectorAll('input').forEach((i) => i.addEventListener('input', () => maj(c))); maj(c); });
  $('env').onclick = envoyer;
}

function jours(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5) + 1; }
function maj(c) {
  const a = c.querySelector('.d1').value, b = c.querySelector('.d2').value, ind = c.querySelector('.indispo').checked, dur = c.querySelector('.dur');
  c.querySelector('.d1').disabled = c.querySelector('.d2').disabled = ind;
  if (ind) dur.textContent = '⚠ À rediscuter avec Phénix-Architecture';
  else if (DATE.test(a) && DATE.test(b)) dur.textContent = b < a ? '⚠ La fin est avant le début' : '✓ ' + jours(a, b) + ' jour' + (jours(a, b) > 1 ? 's' : '') + ' calendaires';
  else dur.textContent = '';
}

async function envoyer() {
  const err = $('err'); err.innerHTML = '';
  const reponses = {}; let nb = 0, bad = '';
  main.querySelectorAll('.lot').forEach((c) => {
    const id = c.dataset.id, nom = c.querySelector('h2').textContent, a = c.querySelector('.d1').value, b = c.querySelector('.d2').value;
    const ind = c.querySelector('.indispo').checked, note = c.querySelector('.note').value.trim().slice(0, 300);
    if (ind) { reponses[id] = { indispo: true, note }; nb++; return; }
    if (!a && !b) { if (note) reponses[id] = { note }; return; }
    if (!DATE.test(a) || !DATE.test(b)) { bad = 'Indiquez le début ET la fin pour « ' + nom + ' ».'; return; }
    if (b < a) { bad = 'Pour « ' + nom + ' », la fin est avant le début.'; return; }
    reponses[id] = { debut: a, fin: b, note }; nb++;
  });
  if (bad) { err.innerHTML = '<div class="note err">' + esc(bad) + '</div>'; return; }
  if (!nb) { err.innerHTML = '<div class="note err">Indiquez au moins un lot (dates ou « à rediscuter »).</div>'; return; }
  const btn = $('env'); btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    await updateDoc(ref, { reponses, statut: 'repondu', repondu_le: new Date().toISOString() });
    D.reponses = reponses; D.statut = 'repondu'; D.repondu_le = new Date().toISOString();
    dessiner(true); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Envoyer mes dates';
    err.innerHTML = '<div class="note err">Envoi impossible pour le moment. Vérifiez votre connexion et réessayez ; si cela persiste, appelez-nous au 04 73 73 00 59.</div>';
  }
}
charger();
</script>
</body>
</html>
