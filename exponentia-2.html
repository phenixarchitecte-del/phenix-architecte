<title>Exponentia — Audit &amp; structuration</title>
<!--
  ===========================================================================
  EXPONENTIA — Outil d'audit et de structuration d'entreprise
  Architecture identique à la suite Phénix : fichier HTML unique,
  bloc Firebase ESM exposant les utilitaires via window._fb, logique appli en
  script classique, Firestore = source de vérité unique, gate de connexion.

  AVANT UTILISATION (console Firebase du projet exponentia-53c5c) :
    1. Authentication  → activer le fournisseur "E-mail/Mot de passe"
    2. Firestore Database → créer la base (mode production)
    3. Coller les règles Firestore ci-dessous (Firestore → Règles) :

      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          match /entreprises/{docId} {
            allow read, write: if request.auth != null
              && request.auth.uid == resource.data.ownerUid;
            allow create: if request.auth != null
              && request.auth.uid == request.resource.data.ownerUid;
          }
        }
      }

  À FAIRE PLUS TARD (comme sur la suite Phénix, module par module) :
    - Firebase App Check (reCAPTCHA v3) : enregistrer une clé de site pour ce
      projet puis décommenter le bloc App Check plus bas.
    - WebAuthn biométrique : à porter depuis Dossier/Chantier.
  ===========================================================================
-->
<style>
  :root{
    --ink:#14121c; --ink-2:#413b52; --muted:#7b748c; --line:#e7e3ef;
    --bg:#f6f4fb; --surface:#ffffff; --surface-2:#faf9fe;
    --accent:#5b3df5; --accent-weak:#efeafe; --accent-ink:#3a1fd1;
    --pos:#0f9b6c; --pos-weak:#e6f6ef; --neg:#d6455a; --neg-weak:#fdeef0;
    --warn:#c9820a; --warn-weak:#fdf3e0;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,18,28,.05),0 8px 28px rgba(20,18,28,.06);
    --shadow-sm:0 1px 2px rgba(20,18,28,.06);
    --nav-h:64px; --head-h:60px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45;
  }
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  a{color:var(--accent-ink)}
  .hidden{display:none!important}

  /* ---------- Login ---------- */
  #login{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:
      radial-gradient(120% 90% at 15% 0%,#efeafe 0%,transparent 55%),
      radial-gradient(120% 90% at 100% 100%,#e6f6ef 0%,transparent 50%),
      var(--bg);
  }
  .login-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;
  }
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#8b6bff);position:relative;overflow:hidden;
  }
  .brand-mark svg{position:absolute;inset:0}
  .brand-name{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:550}
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--surface-2);color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid transparent;border-radius:var(--radius-sm);padding:10px 14px;
    font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff;transition:.12s;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%;padding:12px}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{background:var(--surface-2);filter:none}
  .btn.soft{background:var(--accent-weak);color:var(--accent-ink)}
  .btn.soft:hover{filter:brightness(.98)}
  .btn.danger{background:var(--neg-weak);color:var(--neg);border-color:transparent}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn.icon{padding:7px;width:32px;height:32px}
  .login-switch{margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}
  .login-switch button{background:none;border:none;color:var(--accent-ink);font-weight:600;cursor:pointer;font-size:13px}
  .err{color:var(--neg);font-size:12.5px;margin-top:10px;min-height:16px}

  /* ---------- App shell ---------- */
  #app{display:flex;flex-direction:column;height:100dvh}
  header.top{
    height:var(--head-h);flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:20;
  }
  .top .brand-mark{width:30px;height:30px;border-radius:9px}
  .top-name{font-weight:700;font-size:16px;letter-spacing:-.02em}
  .ent-select{
    display:flex;align-items:center;gap:6px;margin-left:6px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;
  }
  .ent-select select{
    border:none;background:none;font-weight:600;font-size:13.5px;color:var(--ink);
    max-width:190px;padding:4px 2px;cursor:pointer;
  }
  .ent-select select:focus{outline:none}
  .top-spacer{flex:1}
  .top-user{font-size:12.5px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main.view{flex:1;overflow:auto;padding:20px 16px calc(var(--nav-h) + 22px)}
  .wrap{max-width:1060px;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-title{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .page-sub{color:var(--muted);font-size:13px;margin-top:2px}

  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface);border-top:1px solid var(--line);z-index:30;
    display:flex;overflow-x:auto;scrollbar-width:none;
  }
  nav.bottom::-webkit-scrollbar{display:none}
  .nav-btn{
    flex:1 0 auto;min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;border:none;background:none;color:var(--muted);cursor:pointer;padding:8px 6px;position:relative;
  }
  .nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
  .nav-btn span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
  .nav-btn.active{color:var(--accent)}
  .nav-btn.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
  .card.pad-lg{padding:18px 20px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-h h3{font-size:14px}
  .eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .kpi .eyebrow{margin-bottom:9px}
  .kpi .val{font-size:26px;font-weight:720;letter-spacing:-.03em;line-height:1}
  .kpi .val.sm{font-size:20px}
  .kpi .foot{font-size:12px;color:var(--muted);margin-top:7px}
  .kpi .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .kpi.pos .accent-bar{background:var(--pos)} .kpi.neg .accent-bar{background:var(--neg)}
  .tone-pos{color:var(--pos)} .tone-neg{color:var(--neg)} .tone-warn{color:var(--warn)}

  /* ---------- Tables ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{
    text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.03em;
    text-transform:uppercase;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  .tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;padding-top:12px}
  .row-act{display:flex;gap:6px;justify-content:flex-end}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .chip.pos{background:var(--pos-weak);color:var(--pos);border-color:transparent}
  .chip.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
  .chip.acc{background:var(--accent-weak);color:var(--accent-ink);border-color:transparent}
  .chip.neg{background:var(--neg-weak);color:var(--neg);border-color:transparent}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .form-grid .full{grid-column:1/-1}
  .inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  label.lbl{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

  .empty{text-align:center;padding:34px 18px;color:var(--muted)}
  .empty .big{font-size:15px;color:var(--ink-2);font-weight:600;margin-bottom:4px}

  /* mini bars */
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar-row .lab{flex:0 0 40%;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:9px;border-radius:100px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .bar-fill{height:100%;border-radius:100px;background:var(--accent)}
  .bar-fill.pos{background:var(--pos)} .bar-fill.neg{background:var(--neg)} .bar-fill.warn{background:var(--warn)}
  .bar-row .pct{flex:0 0 54px;text-align:right;font-size:12.5px;font-weight:650}

  /* org chart */
  .org{overflow:auto;padding:6px 2px}
  .org ul{list-style:none;margin:0;padding-top:16px;display:flex;justify-content:center;position:relative}
  .org li{list-style:none;position:relative;padding:16px 8px 0;text-align:center}
  .org li::before,.org li::after{content:"";position:absolute;top:0;height:16px;border-top:2px solid var(--line)}
  .org li::before{left:0;right:50%;border-left:2px solid var(--line)}
  .org li::after{right:0;left:50%}
  .org li:only-child::before,.org li:only-child::after{display:none}
  .org li:first-child::before,.org li:last-child::after{border:0}
  .org li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
  .org li:first-child::after{border-left:2px solid var(--line);border-radius:6px 0 0 0}
  .org ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:2px solid var(--line)}
  .org-node{
    display:inline-block;min-width:132px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;box-shadow:var(--shadow-sm);position:relative;
  }
  .org-node .n{font-weight:650;font-size:13px}
  .org-node .p{font-size:11.5px;color:var(--muted);margin-top:1px}
  .org-node.root{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

  /* planning */
  .plan-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .plan-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .plan-day{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:120px}
  .plan-day h4{font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:8px;text-align:center}
  .plan-task{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:7px 8px;margin-bottom:7px;font-size:12px;position:relative}
  .plan-task .t{font-weight:600}
  .plan-task .h{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .plan-task .x{position:absolute;top:4px;right:5px;cursor:pointer;color:var(--muted);border:none;background:none;font-size:14px;line-height:1;padding:0}
  .plan-add{width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;font-weight:600}
  .plan-add:hover{border-color:var(--accent);color:var(--accent-ink)}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(20,18,28,.42);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:90dvh;overflow:auto;padding:20px 20px 18px}
  .modal h3{font-size:16px;margin-bottom:4px}
  .modal .page-sub{margin-bottom:14px}

  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
  .seg button{border:none;background:none;padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 15px;border-radius:100px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media(max-width:760px){
    .cols-4{grid-template-columns:repeat(2,1fr)}
    .cols-3{grid-template-columns:1fr}
    .cols-2{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .plan-grid{grid-template-columns:1fr}
    .top-name{display:none}
    .ent-select select{max-width:130px}
  }
</style>
</head>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
           createUserWithEmailAndPassword, signOut }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc,
           query, where, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAUSMF4s46aCC7Riaaxim99U_fp4FhoG4I",
    authDomain: "exponentia-53c5c.firebaseapp.com",
    projectId: "exponentia-53c5c",
    storageBucket: "exponentia-53c5c.firebasestorage.app",
    messagingSenderId: "109779276274",
    appId: "1:109779276274:web:712b6ec20404ba53245b6b"
  };

  const app = initializeApp(firebaseConfig);

  /* --- App Check (à activer quand la clé reCAPTCHA v3 du projet existe) ---
  import { initializeAppCheck, ReCaptchaV3Provider }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('VOTRE_CLE_RECAPTCHA_V3'),
    isTokenAutoRefreshEnabled: true
  });
  ------------------------------------------------------------------------- */

  const auth = getAuth(app);
  const db = getFirestore(app);
  const COL = 'entreprises';

  const errMsg = (e) => {
    const m = (e && e.code) || '';
    if (m.includes('invalid-credential') || m.includes('wrong-password') || m.includes('user-not-found'))
      return "E-mail ou mot de passe incorrect.";
    if (m.includes('email-already-in-use')) return "Un compte existe déjà avec cet e-mail.";
    if (m.includes('weak-password')) return "Mot de passe trop court (6 caractères minimum).";
    if (m.includes('invalid-email')) return "Adresse e-mail invalide.";
    if (m.includes('operation-not-allowed')) return "Activez « E-mail/Mot de passe » dans Firebase Authentication.";
    if (m.includes('permission-denied')) return "Accès refusé — vérifiez les règles Firestore.";
    return (e && e.message) || "Erreur inattendue.";
  };

  window._fb = {
    onAuth: (cb) => onAuthStateChanged(auth, cb),
    signIn:  (e, p) => signInWithEmailAndPassword(auth, e, p),
    signUp:  (e, p) => createUserWithEmailAndPassword(auth, e, p),
    signOut: () => signOut(auth),
    errMsg,
    async listEntreprises(uid) {
      const q = query(collection(db, COL), where('ownerUid', '==', uid));
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async saveEntreprise(ent) {
      const ref = doc(db, COL, ent.id);
      const data = { ...ent }; delete data.id;
      data.updatedAt = serverTimestamp();
      await setDoc(ref, data, { merge: false });
    },
    async deleteEntreprise(id) { await deleteDoc(doc(db, COL, id)); },
    newId() { return doc(collection(db, COL)).id; }
  };

  window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  const $  = (s, r) => (r || document).querySelector(s);
  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const numOr = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : (d == null ? 0 : d); };
  const uid = () => (window._fb ? window._fb.newId() : 'x' + Math.random().toString(36).slice(2, 11));
  const eur = (n) => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(numOr(n));
  const eur2 = (n) => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:2 }).format(numOr(n));
  const pct = (n) => (Number.isFinite(n) ? (n >= 0 ? '' : '') + n.toFixed(1) + ' %' : '—');
  const yearOf = (d) => (d && /^\d{4}/.test(d)) ? d.slice(0, 4) : '';
  const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const AUDIT_THEMES = [
    ['offre', 'Offre & demande', 'Connaissance du marché, positionnement, compréhension des besoins clients'],
    ['prix', 'Prix', 'Justesse du chiffrage, calcul des marges, capacité à défendre ses tarifs'],
    ['demarchage', 'Démarchage', 'Prospection active, régularité, canaux utilisés, réseau'],
    ['vente', 'Vente', 'Conversion des devis, argumentation, suivi client, closing'],
  ];
  const blankAudit = () => ({ offre:{score:0,comment:''}, prix:{score:0,comment:''}, demarchage:{score:0,comment:''}, vente:{score:0,comment:''} });

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900);
  }

  /* ---------- state ---------- */
  const S = { user:null, ents:[], curId:null, tab:'synthese', year:String(new Date().getFullYear()), planEmp:null };
  const getEnt = () => S.ents.find(e => e.id === S.curId) || null;

  function blankEnt(nom) {
    return { id: uid(), ownerUid: S.user.uid, nom: nom || 'Nouvelle entreprise', secteur:'',
      transactions:[], employes:[], chantiers:[], planning:[], audit: blankAudit() };
  }

  async function persist() {
    const ent = getEnt(); if (!ent) return;
    try { await window._fb.saveEntreprise(ent); }
    catch (e) { toast('Échec de l’enregistrement'); console.error(e); }
  }

  /* ---------- computations ---------- */
  function comp(ent) {
    const y = S.year;
    const tx = ent.transactions || [];
    const recY = tx.filter(t => t.type === 'recette' && yearOf(t.date) === y).reduce((s,t)=>s+numOr(t.montant),0);
    const chgY = tx.filter(t => t.type === 'charge'  && yearOf(t.date) === y).reduce((s,t)=>s+numOr(t.montant),0);
    const ch = ent.chantiers || [];
    const chData = ch.map(c => {
      const couts = numOr(c.coutMateriaux)+numOr(c.coutMainOeuvre)+numOr(c.coutSousTraitance)+numOr(c.autresCharges);
      const marge = numOr(c.montantHT) - couts;
      const mpct = numOr(c.montantHT) > 0 ? marge / numOr(c.montantHT) * 100 : null;
      return { ...c, couts, marge, mpct };
    });
    const totHT = chData.reduce((s,c)=>s+numOr(c.montantHT),0);
    const totMarge = chData.reduce((s,c)=>s+c.marge,0);
    const margeGlob = totHT > 0 ? totMarge / totHT * 100 : null;
    const enCours = ch.filter(c => c.statut === 'en_cours').length;
    return { y, recY, chgY, resY: recY - chgY, chData, totHT, totMarge, margeGlob, nbCh: ch.length, enCours };
  }

  const empName = (ent, id) => { const e = (ent.employes||[]).find(x=>x.id===id); return e ? (e.prenom+' '+e.nom).trim() : ''; };

  /* ================= NAV ================= */
  const TABS = [
    ['synthese','Synthèse','M6 30 L15 20 L22 25 L32 9|dot'],
    ['ca','CA','M3 3v18h18|bars'],
    ['equipe','Équipe','people'],
    ['chantiers','Chantiers','crane'],
    ['planning','Planning','cal'],
    ['organigramme','Organi.','org'],
    ['audit','Audit','audit'],
  ];
  function icon(kind) {
    switch (kind) {
      case 'synthese': return '<path d="M4 19 L10 12 L14 15 L20 6"/><circle cx="20" cy="6" r="1.6" fill="currentColor" stroke="none"/>';
      case 'ca': return '<path d="M4 20V10M10 20V4M16 20v-7M22 20V8" stroke-linecap="round"/>';
      case 'equipe': return '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 11a2.6 2.6 0 100-5.2"/><path d="M18 20c0-2.4-1-4-3-4.6"/>';
      case 'chantiers': return '<path d="M4 21h16M6 21V8l7-4 7 4M9 21v-5h4v5"/><path d="M13 4l7 4"/>';
      case 'planning': return '<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/>';
      case 'organigramme': return '<rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/><rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v4M6 17v-3h12v3"/>';
      case 'audit': return '<path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M12 8 L16 10 V15 L12 17 L8 15 V10 Z"/>';
    }
    return '';
  }
  function renderNav() {
    $('#nav').innerHTML = TABS.map(([id,label]) =>
      `<button class="nav-btn ${S.tab===id?'active':''}" data-action="tab" data-tab="${id}">
         <svg viewBox="0 0 24 24">${icon(id)}</svg><span>${label}</span></button>`
    ).join('');
  }

  /* ================= RENDER ================= */
  function render() {
    const app = $('#app');
    // entreprise selector
    $('#entSelect').innerHTML = S.ents.map(e =>
      `<option value="${e.id}" ${e.id===S.curId?'selected':''}>${esc(e.nom)}</option>`).join('')
      || '<option>—</option>';
    $('#topUser').textContent = S.user ? S.user.email : '';
    renderNav();

    const v = $('#view');
    const ent = getEnt();
    if (!ent) { v.innerHTML = firstRunHTML(); return; }

    switch (S.tab) {
      case 'synthese':     v.innerHTML = viewSynthese(ent); break;
      case 'ca':           v.innerHTML = viewCA(ent); break;
      case 'equipe':       v.innerHTML = viewEquipe(ent); break;
      case 'chantiers':    v.innerHTML = viewChantiers(ent); break;
      case 'planning':     v.innerHTML = viewPlanning(ent); break;
      case 'organigramme': v.innerHTML = viewOrg(ent); break;
      case 'audit':        v.innerHTML = viewAudit(ent); break;
    }
  }

  function firstRunHTML() {
    return `<div class="card pad-lg" style="max-width:440px;margin:40px auto;text-align:center">
      <div class="empty">
        <div class="big">Aucune entreprise auditée</div>
        <p style="margin:6px 0 16px;color:var(--muted)">Créez une fiche par entreprise cliente : chaque audit conserve ses propres données (CA, équipe, chantiers, planning).</p>
        <button class="btn" data-action="new-ent">Créer une entreprise</button>
      </div></div>`;
  }

  /* ---------- Synthèse ---------- */
  function viewSynthese(ent) {
    const c = comp(ent);
    const employes = ent.employes || [];
    const tauxList = employes.filter(e => numOr(e.tauxHoraire) > 0);
    const tauxVals = tauxList.map(e => numOr(e.tauxHoraire));
    const tauxMoy = tauxVals.length ? tauxVals.reduce((a,b)=>a+b,0)/tauxVals.length : 0;

    const kpis = `
      <div class="grid cols-4">
        <div class="kpi ${c.resY>=0?'pos':'neg'}"><div class="accent-bar"></div>
          <div class="eyebrow">CA ${esc(c.y)}</div>
          <div class="val num">${eur(c.recY)}</div>
          <div class="foot">Résultat <b class="num ${c.resY>=0?'tone-pos':'tone-neg'}">${eur(c.resY)}</b> · charges ${eur(c.chgY)}</div>
        </div>
        <div class="kpi"><div class="accent-bar"></div>
          <div class="eyebrow">Chantiers</div>
          <div class="val num">${c.nbCh}</div>
          <div class="foot">${c.enCours} en cours · CA chantiers ${eur(c.totHT)}</div>
        </div>
        <div class="kpi ${c.margeGlob==null?'':(c.margeGlob>=15?'pos':(c.margeGlob<0?'neg':''))}"><div class="accent-bar"></div>
          <div class="eyebrow">Marge prestations</div>
          <div class="val num">${c.margeGlob==null?'—':pct(c.margeGlob)}</div>
          <div class="foot">Marge totale ${eur(c.totMarge)}</div>
        </div>
        <div class="kpi"><div class="accent-bar"></div>
          <div class="eyebrow">Taux horaire moyen</div>
          <div class="val num">${tauxMoy?eur2(tauxMoy):'—'}</div>
          <div class="foot">${employes.length} intervenant${employes.length>1?'s':''}</div>
        </div>
      </div>`;

    // rentabilité par chantier (bars)
    const rent = c.chData.length ? c.chData.slice().sort((a,b)=>(b.mpct??-999)-(a.mpct??-999)).slice(0,6).map(ch=>{
      const p = ch.mpct==null?0:ch.mpct;
      const w = Math.max(2, Math.min(100, p<0?4:p));
      const cls = p<0?'neg':(p>=15?'pos':'warn');
      return `<div class="bar-row"><div class="lab">${esc(ch.nom||'—')}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${w}%"></div></div>
        <div class="pct ${p<0?'tone-neg':''}">${ch.mpct==null?'—':pct(ch.mpct)}</div></div>`;
    }).join('') : `<div class="empty">Aucun chantier saisi. <button class="btn soft sm" data-action="tab" data-tab="chantiers">Ouvrir Chantiers</button></div>`;

    // taux horaires list
    const tauxRows = tauxList.length ? tauxList.slice().sort((a,b)=>numOr(b.tauxHoraire)-numOr(a.tauxHoraire)).map(e=>
      `<div class="bar-row"><div class="lab">${esc((e.prenom+' '+e.nom).trim())}<span style="color:var(--muted)"> · ${esc(e.poste||'—')}</span></div>
        <div class="pct num" style="flex-basis:auto">${eur2(e.tauxHoraire)}/h</div></div>`
    ).join('') : `<div class="empty">Aucun taux horaire saisi. <button class="btn soft sm" data-action="tab" data-tab="equipe">Ouvrir Équipe</button></div>`;

    // planning aperçu (count per employee this week)
    const planByEmp = {};
    (ent.planning||[]).forEach(p => { planByEmp[p.employeId] = (planByEmp[p.employeId]||0)+1; });
    const planRows = employes.length ? employes.map(e=>{
      const n = planByEmp[e.id]||0;
      return `<div class="bar-row"><div class="lab">${esc((e.prenom+' '+e.nom).trim())}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,n*14)}%"></div></div>
        <div class="pct num">${n} tâche${n>1?'s':''}</div></div>`;
    }).join('') : `<div class="empty">Aucun employé.</div>`;

    return `
      <div class="page-head">
        <div><div class="page-title">Synthèse — ${esc(ent.nom)}</div>
          <div class="page-sub">Vue d’ensemble de la bonne tenue de l’entreprise${ent.secteur?' · '+esc(ent.secteur):''}</div></div>
        <div class="seg" data-action="year-seg">${yearOptions(ent)}</div>
      </div>
      ${kpis}
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><div class="card-h"><h3>Rentabilité par chantier</h3><span class="eyebrow">marge %</span></div>${rent}</div>
        <div class="card"><div class="card-h"><h3>Taux horaires des intervenants</h3></div>${tauxRows}</div>
      </div>
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card">
          <div class="card-h"><h3>Organigramme</h3><button class="btn soft sm" data-action="tab" data-tab="organigramme">Détail</button></div>
          ${orgMini(ent)}
        </div>
        <div class="card">
          <div class="card-h"><h3>Charge hebdomadaire</h3><button class="btn soft sm" data-action="tab" data-tab="planning">Planning</button></div>
          ${planRows}
        </div>
      </div>
      <div class="grid cols-2" style="margin-top:14px">
        ${auditSummaryCard(ent)}
      </div>`;
  }

  function auditSummaryCard(ent) {
    const audit = ent.audit || blankAudit();
    const scores = AUDIT_THEMES.map(([k]) => numOr(audit[k] && audit[k].score));
    const filled = scores.filter(s => s > 0);
    const global = filled.length ? filled.reduce((a,b)=>a+b,0)/AUDIT_THEMES.length : 0;
    const rows = AUDIT_THEMES.map(([k,label], i) => {
      const s = scores[i];
      return `<div class="bar-row"><div class="lab">${esc(label)}</div>
        <div class="bar-track"><div class="bar-fill ${s<=2&&s>0?'neg':(s>=4?'pos':'')}" style="width:${s*20}%"></div></div>
        <div class="pct">${s?s+'/5':'—'}</div></div>`;
    }).join('');
    return `<div class="card">
      <div class="card-h"><h3>Audit diagnostic</h3><button class="btn soft sm" data-action="tab" data-tab="audit">Détail</button></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
        <span class="val sm num" style="font-size:22px">${filled.length?global.toFixed(1):'—'}</span>
        <span class="page-sub" style="margin:0">/ 5 · ${filled.length}/${AUDIT_THEMES.length} thèmes évalués</span>
      </div>
      ${rows}
    </div>`;
  }

  function yearOptions(ent) {
    const years = new Set([String(new Date().getFullYear())]);
    (ent.transactions||[]).forEach(t => { const y = yearOf(t.date); if (y) years.add(y); });
    if (!years.has(S.year)) years.add(S.year);
    return [...years].sort().reverse().map(y =>
      `<button class="${y===S.year?'on':''}" data-year="${y}">${y}</button>`).join('');
  }

  function orgMini(ent) {
    const emps = ent.employes || [];
    if (!emps.length) return `<div class="empty">Aucun employé pour l’organigramme.</div>`;
    const roots = emps.filter(e => !e.chefId || !emps.some(x => x.id === e.chefId));
    const line = (e) => `<span class="chip acc" style="margin:3px 4px 3px 0">${esc((e.prenom+' '+e.nom).trim())} · ${esc(e.poste||'—')}</span>`;
    let html = '<div style="line-height:1.9">';
    roots.forEach(r => {
      html += line(r);
      emps.filter(e => e.chefId === r.id).forEach(sub => { html += '<br><span style="margin-left:14px">↳ '+line(sub)+'</span>'; });
    });
    return html + '</div>';
  }

  /* ---------- Chiffre d'affaires ---------- */
  function viewCA(ent) {
    const c = comp(ent);
    const tx = (ent.transactions||[]).filter(t => !S.year || yearOf(t.date) === S.year)
      .slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    const rows = tx.length ? tx.map(t => `
      <tr>
        <td class="num">${esc(t.date||'—')}</td>
        <td>${esc(t.libelle||'—')}</td>
        <td><span class="chip">${esc(t.categorie||'—')}</span></td>
        <td>${t.type==='recette'?'<span class="chip pos">Recette</span>':'<span class="chip neg">Charge</span>'}</td>
        <td class="r num ${t.type==='recette'?'tone-pos':'tone-neg'}">${t.type==='recette'?'+':'−'}${eur2(t.montant)}</td>
        <td class="r"><div class="row-act"><button class="btn danger sm" data-action="del-tx" data-id="${t.id}">Suppr.</button></div></td>
      </tr>`).join('') : `<tr><td colspan="6"><div class="empty">Aucun mouvement pour ${esc(S.year)}.</div></td></tr>`;

    return `
      <div class="page-head">
        <div><div class="page-title">Chiffre d’affaires</div><div class="page-sub">Recettes, charges et résultat — ${esc(ent.nom)}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="seg" data-action="year-seg">${yearOptions(ent)}</div>
          <button class="btn" data-action="add-tx">+ Mouvement</button>
        </div>
      </div>
      <div class="grid cols-3">
        <div class="kpi pos"><div class="accent-bar"></div><div class="eyebrow">Recettes ${esc(c.y)}</div><div class="val sm num">${eur(c.recY)}</div></div>
        <div class="kpi neg"><div class="accent-bar"></div><div class="eyebrow">Charges ${esc(c.y)}</div><div class="val sm num">${eur(c.chgY)}</div></div>
        <div class="kpi ${c.resY>=0?'pos':'neg'}"><div class="accent-bar"></div><div class="eyebrow">Résultat ${esc(c.y)}</div><div class="val sm num ${c.resY>=0?'tone-pos':'tone-neg'}">${eur(c.resY)}</div></div>
      </div>
      <div class="card" style="margin-top:14px">
        <table class="tbl">
          <thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Type</th><th class="r">Montant</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  /* ---------- Équipe ---------- */
  function viewEquipe(ent) {
    const emps = ent.employes || [];
    const cards = emps.length ? emps.map(e => {
      const chef = e.chefId ? empName(ent, e.chefId) : '';
      const nTasks = (ent.planning||[]).filter(p => p.employeId === e.id).length;
      return `<div class="card">
        <div class="card-h">
          <div><h3>${esc((e.prenom+' '+e.nom).trim()||'—')}</h3>
            <div class="page-sub">${esc(e.poste||'Poste non défini')}${e.age?' · '+esc(e.age)+' ans':''}</div></div>
          <div class="row-act">
            <button class="btn soft sm" data-action="edit-emp" data-id="${e.id}">Modifier</button>
            <button class="btn danger sm" data-action="del-emp" data-id="${e.id}">Suppr.</button>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
          ${e.tauxHoraire?`<span class="chip acc">${eur2(e.tauxHoraire)}/h</span>`:''}
          ${e.typeContrat?`<span class="chip">${esc(e.typeContrat)}</span>`:''}
          ${e.qualification?`<span class="chip">${esc(e.qualification)}</span>`:''}
          ${chef?`<span class="chip">↳ dépend de ${esc(chef)}</span>`:'<span class="chip warn">sans supérieur</span>'}
          <span class="chip">${nTasks} tâche${nTasks>1?'s':''} au planning</span>
        </div>
        ${e.dateEmbauche?`<div class="page-sub">Entrée le ${esc(e.dateEmbauche)}</div>`:''}
      </div>`;
    }).join('') : '';

    return `
      <div class="page-head">
        <div><div class="page-title">Équipe</div><div class="page-sub">Identité, poste, taux horaire, rattachement hiérarchique — ${esc(ent.nom)}</div></div>
        <button class="btn" data-action="add-emp">+ Employé</button>
      </div>
      ${emps.length ? `<div class="grid cols-2">${cards}</div>`
        : `<div class="card"><div class="empty"><div class="big">Aucun employé</div>
             <p style="color:var(--muted)">Chaque employé alimente l’organigramme, le planning et le taux horaire moyen.</p>
             <button class="btn" data-action="add-emp" style="margin-top:8px">Ajouter le premier employé</button></div></div>`}`;
  }

  /* ---------- Chantiers ---------- */
  function viewChantiers(ent) {
    const c = comp(ent);
    const statutChip = (s) => s==='en_cours'?'<span class="chip warn">En cours</span>'
      : s==='termine'?'<span class="chip pos">Terminé</span>'
      : '<span class="chip">Prospect</span>';
    const rows = c.chData.length ? c.chData.map(ch => `
      <tr>
        <td><b>${esc(ch.nom||'—')}</b><div class="page-sub">${esc(ch.maitreOuvrage||'')}</div></td>
        <td>${statutChip(ch.statut)}</td>
        <td class="r num">${eur(ch.montantHT)}</td>
        <td class="r num">${eur(ch.couts)}</td>
        <td class="r num ${ch.marge>=0?'tone-pos':'tone-neg'}">${eur(ch.marge)}</td>
        <td class="r num ${ch.mpct==null?'':(ch.mpct<0?'tone-neg':(ch.mpct>=15?'tone-pos':'tone-warn'))}">${ch.mpct==null?'—':pct(ch.mpct)}</td>
        <td class="r"><div class="row-act">
          <button class="btn soft sm" data-action="edit-ch" data-id="${ch.id}">Modifier</button>
          <button class="btn danger sm" data-action="del-ch" data-id="${ch.id}">Suppr.</button></div></td>
      </tr>`).join('') : `<tr><td colspan="7"><div class="empty">Aucun chantier saisi.</div></td></tr>`;

    return `
      <div class="page-head">
        <div><div class="page-title">Chantiers</div><div class="page-sub">Volume, prix, coûts et marge par chantier — ${esc(ent.nom)}</div></div>
        <button class="btn" data-action="add-ch">+ Chantier</button>
      </div>
      <div class="grid cols-3">
        <div class="kpi"><div class="accent-bar"></div><div class="eyebrow">Nombre de chantiers</div><div class="val sm num">${c.nbCh}</div><div class="foot">${c.enCours} en cours</div></div>
        <div class="kpi"><div class="accent-bar"></div><div class="eyebrow">CA chantiers (HT)</div><div class="val sm num">${eur(c.totHT)}</div></div>
        <div class="kpi ${c.margeGlob!=null&&c.margeGlob>=15?'pos':(c.margeGlob!=null&&c.margeGlob<0?'neg':'')}"><div class="accent-bar"></div><div class="eyebrow">Marge globale</div><div class="val sm num">${c.margeGlob==null?'—':pct(c.margeGlob)}</div><div class="foot">${eur(c.totMarge)}</div></div>
      </div>
      <div class="card" style="margin-top:14px">
        <table class="tbl">
          <thead><tr><th>Chantier</th><th>Statut</th><th class="r">Montant HT</th><th class="r">Coûts</th><th class="r">Marge</th><th class="r">Marge %</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
          ${c.chData.length?`<tfoot><tr><td colspan="2">Total</td><td class="r num">${eur(c.totHT)}</td><td class="r num">${eur(c.totHT-c.totMarge)}</td><td class="r num ${c.totMarge>=0?'tone-pos':'tone-neg'}">${eur(c.totMarge)}</td><td class="r num">${c.margeGlob==null?'—':pct(c.margeGlob)}</td><td></td></tr></tfoot>`:''}
        </table>
      </div>`;
  }

  /* ---------- Planning ---------- */
  function viewPlanning(ent) {
    const emps = ent.employes || [];
    if (!emps.length) return `

  /* ---------- Organigramme ---------- */
  function viewOrg(ent) {
    const emps = ent.employes || [];
    if (!emps.length) return `
      <div class="page-head"><div><div class="page-title">Organigramme</div>
        <div class="page-sub">Définissez les employés et leur supérieur dans l’onglet Équipe.</div></div></div>
      <div class="card"><div class="empty"><button class="btn" data-action="tab" data-tab="equipe">Ouvrir Équipe</button></div></div>`;

    const byChef = {};
    emps.forEach(e => { const k = (e.chefId && emps.some(x=>x.id===e.chefId)) ? e.chefId : '__root__';
      (byChef[k] = byChef[k] || []).push(e); });
    const roots = byChef['__root__'] || [];

    const node = (e, isRoot, seen) => {
      if (seen.has(e.id)) return '';
      seen.add(e.id);
      const kids = byChef[e.id] || [];
      const box = `<div class="org-node ${isRoot?'root':''}"><div class="n">${esc((e.prenom+' '+e.nom).trim()||'—')}</div><div class="p">${esc(e.poste||'—')}</div></div>`;
      const children = kids.length ? `<ul>${kids.map(k=>`<li>${node(k,false,seen)}</li>`).join('')}</ul>` : '';
      return box + children;
    };
    const seen = new Set();
    const tree = roots.length
      ? `<ul>${roots.map(r=>`<li>${node(r,true,seen)}</li>`).join('')}</ul>`
      : `<div class="empty">Aucun dirigeant identifié — indiquez un employé sans supérieur.</div>`;

    return `
      <div class="page-head">
        <div><div class="page-title">Organigramme</div><div class="page-sub">Qui dépend de qui — ${esc(ent.nom)}</div></div>
        <button class="btn soft" data-action="tab" data-tab="equipe">Gérer l’équipe</button>
      </div>
      <div class="card"><div class="org">${tree}</div></div>`;
  }

  /* ---------- Audit (radar) ---------- */
  function radarSVG(scores) {
    // scores: array of 4 values 0-5, axes at top/right/bottom/left
    const cx = 110, cy = 110, R = 84, n = scores.length;
    const angle = (i) => (-Math.PI/2) + i * (2*Math.PI/n);
    const pt = (i, r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];
    const rings = [1,2,3,4,5].map(k => {
      const r = R * (k/5);
      const poly = Array.from({length:n}, (_,i)=>pt(i,r).join(',')).join(' ');
      return `<polygon points="${poly}" fill="none" stroke="#e7e3ef" stroke-width="1"/>`;
    }).join('');
    const axes = Array.from({length:n}, (_,i) => { const [x,y]=pt(i,R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e7e3ef" stroke-width="1"/>`; }).join('');
    const dataPts = scores.map((s,i)=> pt(i, R*(Math.max(0,Math.min(5,s))/5)));
    const dataPoly = dataPts.map(p=>p.join(',')).join(' ');
    const dots = dataPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#5b3df5"/>`).join('');
    const labels = AUDIT_THEMES.map(([,label],i) => {
      const [x,y] = pt(i, R+20);
      const anchor = Math.abs(x-cx) < 4 ? 'middle' : (x > cx ? 'start' : 'end');
      return `<text x="${x}" y="${y}" font-size="11" font-weight="600" fill="#413b52" text-anchor="${anchor}" dominant-baseline="middle">${esc(label)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 220 220" width="100%" height="240" style="max-width:320px;display:block;margin:0 auto">
      ${rings}${axes}
      <polygon points="${dataPoly}" fill="#5b3df5" fill-opacity="0.16" stroke="#5b3df5" stroke-width="2"/>
      ${dots}${labels}
    </svg>`;
  }

  function viewAudit(ent) {
    const audit = ent.audit || (ent.audit = blankAudit());
    const scores = AUDIT_THEMES.map(([k]) => numOr(audit[k] && audit[k].score));
    const filled = scores.filter(s => s > 0);
    const globalScore = filled.length ? (filled.reduce((a,b)=>a+b,0) / AUDIT_THEMES.length) : 0;
    let weakest = null;
    AUDIT_THEMES.forEach(([k,label], i) => {
      if (scores[i] > 0 && (weakest === null || scores[i] < weakest.score)) weakest = { label, score: scores[i] };
    });

    const themeCards = AUDIT_THEMES.map(([k,label,help]) => {
      const t = audit[k] || { score:0, comment:'' };
      return `<div class="card">
        <div class="card-h"><div><h3>${esc(label)}</h3><div class="page-sub">${esc(help)}</div></div>
          <span class="chip acc num">${t.score||0}/5</span></div>
        <input type="range" min="0" max="5" step="1" value="${numOr(t.score)}" style="width:100%"
          data-action="audit-score" data-key="${k}">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:2px 0 10px">
          <span>0 — non évalué</span><span>5 — maîtrisé</span>
        </div>
        <label class="lbl">Observations</label>
        <textarea class="inp" rows="2" data-action="audit-comment" data-key="${k}" placeholder="Ce que tu observes pendant l’échange…">${esc(t.comment)}</textarea>
      </div>`;
    }).join('');

    return `
      <div class="page-head">
        <div><div class="page-title">Audit diagnostic</div>
          <div class="page-sub">Offre &amp; demande, prix, démarchage, vente — ${esc(ent.nom)}</div></div>
      </div>
      <div class="grid cols-2">
        <div class="card" style="display:flex;align-items:center;justify-content:center">
          ${radarSVG(scores)}
        </div>
        <div class="grid" style="align-content:start;gap:14px">
          <div class="kpi"><div class="accent-bar"></div><div class="eyebrow">Score global</div>
            <div class="val num">${filled.length ? globalScore.toFixed(1) : '—'}<span style="font-size:14px;color:var(--muted)"> / 5</span></div>
            <div class="foot">${filled.length}/${AUDIT_THEMES.length} thèmes évalués</div></div>
          <div class="kpi ${weakest && weakest.score<=2 ? 'neg':''}"><div class="accent-bar"></div><div class="eyebrow">Point le plus fragile</div>
            <div class="val sm">${weakest ? esc(weakest.label) : '—'}</div>
            <div class="foot">${weakest ? weakest.score+'/5' : 'Renseigne au moins un thème'}</div></div>
        </div>
      </div>
      <div class="grid cols-2" style="margin-top:14px">${themeCards}</div>`;
  }

  /* ================= EVENTS ================= */
  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const ent = getEnt();

    // year segmented (delegated to buttons with data-year)
    if (el.dataset.year) { S.year = el.dataset.year; render(); return; }

    switch (a) {
      case 'tab': S.tab = el.dataset.tab; render(); break;
      case 'logout': await window._fb.signOut(); break;

      case 'ent-menu': modalEntMenu(); break;
      case 'modal-back': if (ev.target === el) closeModal(); break;
      case 'modal-cancel': closeModal(); break;

      case 'new-ent': modalEntMenu(); break;
      case 'create-ent': {
        const nom = fval('f_entnom'); if (!nom) { toast('Indiquez un nom'); break; }
        const e = blankEnt(nom); S.ents.push(e); S.curId = e.id;
        await window._fb.saveEntreprise(e); closeModal(); S.tab='synthese'; render(); toast('Entreprise créée');
        break; }
      case 'switch-ent': S.curId = el.dataset.id; closeModal(); S.tab='synthese'; render(); break;
      case 'rename-ent': { const n = fval('f_entrename'); if (n){ ent.nom = n; await persist(); render(); modalEntMenu(); toast('Renommée'); } break; }
      case 'del-ent': {
        if (!confirm('Supprimer définitivement cette entreprise et toutes ses données ?')) break;
        const id = el.dataset.id;
        try { await window._fb.deleteEntreprise(id); } catch(e){ toast('Échec suppression'); break; }
        S.ents = S.ents.filter(x => x.id !== id);
        if (S.curId === id) S.curId = S.ents[0] ? S.ents[0].id : null;
        closeModal(); render(); toast('Supprimée');
        break; }

      /* CA */
      case 'add-tx': modalTx(); break;
      case 'save-tx': {
        ent.transactions.push({ id:uid(), type:fval('f_type'), date:fval('f_date'),
          libelle:fval('f_lib'), categorie:fval('f_cat'), montant:numOr(fval('f_mnt')) });
        await persist(); closeModal(); render(); toast('Mouvement ajouté'); break; }
      case 'del-tx': ent.transactions = ent.transactions.filter(t=>t.id!==el.dataset.id); await persist(); render(); break;

      /* Équipe */
      case 'add-emp': modalEmp(null); break;
      case 'edit-emp': modalEmp((ent.employes||[]).find(e=>e.id===el.dataset.id)); break;
      case 'save-emp': {
        const id = el.dataset.id;
        const data = { prenom:fval('f_prenom'), nom:fval('f_nom'), age:numOr(fval('f_age')),
          poste:fval('f_poste'), qualification:fval('f_qualif'), typeContrat:fval('f_contrat'),
          tauxHoraire:numOr(fval('f_taux')), dateEmbauche:fval('f_entree'), chefId:fval('f_chef') };
        if (id) { const e = ent.employes.find(x=>x.id===id); Object.assign(e, data); }
        else { ent.employes.push({ id:uid(), taches:[], ...data }); }
        await persist(); closeModal(); render(); toast('Employé enregistré'); break; }
      case 'del-emp': {
        if (!confirm('Supprimer cet employé ? Ses tâches de planning seront aussi retirées.')) break;
        const id = el.dataset.id;
        ent.employes = ent.employes.filter(e=>e.id!==id);
        ent.employes.forEach(e=>{ if(e.chefId===id) e.chefId=''; });
        ent.planning = (ent.planning||[]).filter(p=>p.employeId!==id);
        await persist(); render(); break; }

      /* Chantiers */
      case 'add-ch': modalCh(null); break;
      case 'edit-ch': modalCh((ent.chantiers||[]).find(c=>c.id===el.dataset.id)); break;
      case 'save-ch': {
        const id = el.dataset.id;
        const data = { nom:fval('f_cnom'), maitreOuvrage:fval('f_cmo'), statut:fval('f_cstatut'),
          montantHT:numOr(fval('f_cht')), coutMateriaux:numOr(fval('f_cmat')), coutMainOeuvre:numOr(fval('f_cmo2')),
          coutSousTraitance:numOr(fval('f_cst')), autresCharges:numOr(fval('f_caut')),
          dateDebut:fval('f_cdeb'), dateFin:fval('f_cfin') };
        if (id) { const c = ent.chantiers.find(x=>x.id===id); Object.assign(c, data); }
        else { ent.chantiers.push({ id:uid(), ...data }); }
        await persist(); closeModal(); render(); toast('Chantier enregistré'); break; }
      case 'del-ch': ent.chantiers = ent.chantiers.filter(c=>c.id!==el.dataset.id); await persist(); render(); break;

      /* Planning */
      case 'add-plan': modalPlan(parseInt(el.dataset.jour,10)); break;
      case 'save-plan': {
        const jour = parseInt(el.dataset.jour,10);
        const tache = fval('f_ptache'); if (!tache){ toast('Décrivez la tâche'); break; }
        ent.planning = ent.planning || [];
        ent.planning.push({ id:uid(), employeId:S.planEmp, jour, tache, debut:fval('f_pdeb'), fin:fval('f_pfin') });
        await persist(); closeModal(); render(); break; }
      case 'del-plan': ent.planning = (ent.planning||[]).filter(p=>p.id!==el.dataset.id); await persist(); render(); break;
    }
  });

      await persist();
    }
  });

  /* ================= AUTH / BOOT ================= */
  function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
  function showApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); }

  let signupMode = false;
  function bindLogin() {
    $('#switchBtn').addEventListener('click', () => {
      signupMode = !signupMode;
      $('#loginBtn').textContent = signupMode ? 'Créer mon compte' : 'Se connecter';
      $('#switchTxt').textContent = signupMode ? 'Vous avez déjà un compte ?' : 'Première utilisation ?';
      $('#switchBtn').textContent = signupMode ? 'Se connecter' : 'Créer mon compte';
      $('#loginErr').textContent = '';
    });
    const submit = async () => {
      const email = $('#email').value.trim(), pwd = $('#pwd').value;
      $('#loginErr').textContent = '';
      if (!email || !pwd) { $('#loginErr').textContent = 'Renseignez e-mail et mot de passe.'; return; }
      $('#loginBtn').disabled = true;
      try {
        if (signupMode) await window._fb.signUp(email, pwd);
        else await window._fb.signIn(email, pwd);
      } catch (e) { $('#loginErr').textContent = window._fb.errMsg(e); }
      finally { $('#loginBtn').disabled = false; }
    };
    $('#loginBtn').addEventListener('click', submit);
    $('#pwd').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  function boot() {
    bindLogin();
    window._fb.onAuth(async (user) => {
      if (!user) { S.user=null; S.ents=[]; S.curId=null; showLogin(); return; }
      S.user = user;
      try {
        S.ents = await window._fb.listEntreprises(user.uid);
        S.ents.sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
      } catch (e) { S.ents = []; toast('Lecture Firestore impossible'); console.error(e); }
      S.curId = S.ents[0] ? S.ents[0].id : null;
      S.tab = 'synthese';
      showApp(); render();
    });
  }

  if (window._fb) boot();
  else window.addEventListener('fb-ready', boot, { once:true });
})();
</script>
</body>
</html>
