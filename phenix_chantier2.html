<!--
══════════════════════════════════════════════════════════════════
 HISTORIQUE DES MODIFICATIONS — phenix_chantier2.html
──────────────────────────────────────────────────────────────────
 12/11/2026 — REFONTE DE LA PAGE CHANTIER : une seule page, plus de modes Terrain / Bureau. Maquette 3D du Carnet à gauche (40 % de l'écran, manipulable),
   panneau à droite (60 %) qui change : Récapitulatif, Lots, Planning, Réserves, Plans, Finances, Comptes rendus, Messages. La maquette sert de support : un clic sur un lot de la maquette ouvre
   Lots, un clic sur un lot de la liste cadre la maquette. Ouverture directe depuis la Synthèse 3D (plus de page de garde), « ← Synthèse 3D » pour revenir. Bouton « Dicter le compte rendu » toujours visible.
   Une maquette par chantier (instance du moteur partagé, libérée au changement de chantier). Mêmes données Firestore qu'avant.
 05/11/2026 — Bouton « Dossier de présentation » dans l'en-tête : lien Dropbox (https) gardé sur le chantier (champ dossierUrl), modifiable par l'équipe, en lecture pour Kevin.
 30/10/2026 (2) — Accès : l'adresse administrateur est reconnue même sans rôle dans phenix_users (comme l'ancien Chantier).
 30/10/2026 — [Chantier 2] NOUVEAU MODULE CHANTIER, construit À CÔTÉ de phenix_chantier.html (l'ancien reste intact).
   Principe : la maquette 3D est l'écran d'accueil ; deux façons de travailler :
   • TERRAIN (Surface Pro, tactile + vocal) : maquette, pastilles par lot, étape réelle, photos et réserves rangées
     automatiquement dans la visite en cours, UN SEUL compte rendu vocal par visite.
   • BUREAU (ordinateur) : Lots (liste), Planning (Gantt), Réserves, À traiter (validation du compte rendu).
   Moteur 3D : phenix_maquette3d.js, le même que le Carnet (écrit une seule fois). [Moteur partagé]
   Mêmes collections Firestore que l'ancien Chantier (phenix_ch_*) : aucune nouvelle collection, aucune règle à changer.
   Pas encore repris : honoraires et commissions, Équipe & accès (→ Paramètres du shell).
══════════════════════════════════════════════════════════════════
   09/11/2026 — Onglet FINANCES (Bureau) : budget des lots, facturé, payé, reste à facturer, suivi par lot (alerte facturé en avance sur l'avancement),
     situations et factures (saisie, modification, suppression, filtre par statut). Mêmes données que l'ancien Chantier (phenix_ch_factures) ;
     une situation « payée » crée la charge « sous-traitance » dans Phénix Dossier (même identifiant que l'ancien module).
   09/11/2026 (2) — Onglet « RÉSERVES ET PLANS » : bibliothèque de plans (PDF ou image), versions, pastilles (à photographier / information / question,
     forme + mot), photos, « vérifié », visibilité par entreprise et par client (publication vers l'espace client). Mêmes données que l'ancien Chantier (phenix_ch_plans).
   09/11/2026 (3) — Onglet « MESSAGES » : boîte unique artisans (phenix_ch_messages) et client (journal du carnet, administrateur), non lus, réponse ;
     les messages non lus apparaissent aussi dans « À traiter ». Mêmes données que l'ancien Chantier.
   09/11/2026 (4) — PAGE DE GARDE « Chantiers en cours » (à l'ouverture) : une parcelle par chantier, maison isométrique qui se construit avec l'étape réelle,
     état « À débloquer / À surveiller / Rien à signaler » (icône + mot), ce qui bloque (lots en retard, situations en retard, réserves, messages, comptes rendus,
     visite trop ancienne), prochaine réunion ; chaque fiche montre la MAQUETTE 3D du Carnet (miniature à l'étape réelle, gardée sur l'appareil) ; un clic sur un point ouvre directement le bon onglet. Bouton « ← Tous les chantiers » pour y revenir.
-->

<style>
:root{--bg:#0a1628;--pan:#101f38;--pan2:#16283f;--text:#e5ecf3;--text2:#a9bbd0;--text3:#8fb5da;--accent:#4fa8f0;--green:#4fd18b;--amber:#e6b95c;--red:#e0776c;--line:rgba(120,170,220,.22);--fs:'DM Sans',system-ui,sans-serif;--fd:'DM Serif Display',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--fs);-webkit-tap-highlight-color:transparent}
button{font-family:var(--fs);cursor:pointer;color:var(--text)}
input,select,textarea{font-family:var(--fs);color:var(--text);background:#0a1628;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.45}

.seg.light button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--text3);font-weight:600;text-transform:uppercase}
.card{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px}

#side{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}
#dock{display:none!important;align-items:center;gap:8px;padding:12px 18px 16px;overflow-x:auto}

#mic{position:absolute;right:16px;bottom:16px;z-index:8;min-height:68px;padding:0 26px;border-radius:34px;border:0;background:var(--accent);color:#06121f;font:700 18px var(--fs);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* pastilles du moteur partagé */
.h3-cv{display:block;width:100%;height:100%;outline:0;touch-action:none}
.h3-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.h3-sp{position:absolute;left:0;top:0;will-change:transform}
.h3-dot{background:#fff}
.h3-sp[data-state=""] .h3-dot{opacity:.45;width:26px;height:26px;left:-13px;top:-13px}
.h3-sp[data-state=todo] .h3-dot{background:#fff;border:5px solid #8a9bb2}
.h3-dot{pointer-events:auto;position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#8a9bb2;padding:0;color:#06121f;font:700 18px/34px var(--fs);text-align:center}
.h3-dot::after{content:""}
.h3-sp[data-state=doing] .h3-dot{background:linear-gradient(90deg,var(--accent) 50%,#fff 50%)}
.h3-sp[data-state=done] .h3-dot{background:var(--green)}.h3-sp[data-state=done] .h3-dot::after{content:"✓"}
.h3-sp[data-state=issue] .h3-dot{background:var(--red);color:#fff}.h3-sp[data-state=issue] .h3-dot::after{content:"!"}
.h3-sp.back .h3-dot{opacity:.5}
.h3-line,.h3-lab{display:none}
.h3-sp.open .h3-line{display:block;position:absolute;left:0;bottom:22px;width:2px;height:40px;margin-left:-1px;background:#fff}

.h3-sp.flip.open .h3-line{bottom:auto;top:22px}.h3-sp.flip.open .h3-lab{bottom:auto;top:62px}

.gb{position:absolute;top:17px;height:22px;border-radius:6px;touch-action:none;cursor:grab}
.gb.done{background:var(--green)}.gb.doing{border:2px solid var(--accent);background:rgba(79,168,240,.12);overflow:hidden}.gb.todo{border:2px dashed #9fb2c6}
.gb .hd{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}.gb .hd.l{left:0}.gb .hd.r{right:0}

@media(max-width:900px){#terrain{flex-direction:column;overflow:auto}#panel{flex:none;min-height:70vh}#stage{min-height:46vh;flex:none}}

<!-- Firebase : mêmes projet, App Check et collections que l'ancien Chantier -->
<script type="module">
const DEMO = /[?&]demo\b/.test(location.search);
window.FB = { demo: DEMO, ready: false };
if (!DEMO) {
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const S = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const U = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const AC = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js');
  const app = A.initializeApp({ apiKey:"AIzaSyCjNKNvS6p3nqE6-_Gw9I397ZtXm2FG1ew", authDomain:"phenix-architecte-9151b.firebaseapp.com", projectId:"phenix-architecte-9151b", storageBucket:"phenix-architecte-9151b.firebasestorage.app", messagingSenderId:"811231684720", appId:"1:811231684720:web:413fa324ae43c07607acb5" });
  try { AC.initializeAppCheck(app, { provider: new AC.ReCaptchaV3Provider('6LeObWktAAAAAL9eyppDRtLp5yZTyBaF4ZNKXNIO'), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn('App Check', e); }
  let db;
  try { db = S.initializeFirestore(app, { localCache: S.persistentLocalCache({ tabManager: S.persistentMultipleTabManager() }) }); } catch (e) { db = S.getFirestore(app); }
  const auth = U.getAuth(app);
  const COLS = { chantiers:'phenix_ch_chantiers', lots:'phenix_ch_lots', intervenants:'phenix_ch_intervenants', reserves:'phenix_ch_reserves', crs:'phenix_ch_crs', factures:'phenix_ch_factures', plans:'phenix_ch_plans', messages:'phenix_ch_messages' };
  const MEDIA = 'phenix_media', CH = 700000;
  Object.assign(window.FB, {
    ready: true,
    login: (e, p) => U.signInWithEmailAndPassword(auth, e, p),
    onAuth: cb => U.onAuthStateChanged(auth, cb),
    user: () => auth.currentUser,
    async role(email) { const s = await S.getDoc(S.doc(db, 'phenix_users', email)); return s.exists() ? (s.data().role || '') : ''; },
    listen(key, cb) { return S.onSnapshot(S.collection(db, COLS[key]), { includeMetadataChanges: true }, snap => { const a = []; snap.forEach(d => a.push(d.data())); cb(a, snap.metadata.hasPendingWrites); }, e => console.warn(key, e && e.message)); },
    save(key, obj) { return S.setDoc(S.doc(db, COLS[key], String(obj.id)), obj); },
    del(key, id) { return S.deleteDoc(S.doc(db, COLS[key], String(id))); },
    async delMedia(id) { const m = await S.getDoc(S.doc(db, MEDIA, id)); const n = m.exists() ? (m.data().parts || 0) : 0; for (let i = 0; i < n; i++) await S.deleteDoc(S.doc(db, MEDIA, id + '__' + i)); await S.deleteDoc(S.doc(db, MEDIA, id)); },
    async chImport(pid) { const s = await S.getDoc(S.doc(db, 'phenix_chantier_import', String(pid))); return s.exists() ? s.data() : null; },
    async fiche(pid) { const s = await S.getDoc(S.doc(db, 'phenix_portail', String(pid), 'etat', 'fiche')); return s.exists() ? s.data() : null; },
    async chunk(pid, i) { const s = await S.getDoc(S.doc(db, 'phenix_portail', String(pid), 'maquette', 'c' + i)); return s.exists() ? (s.data().d || '') : ''; },
    putMedia(id, du, kind) {
      const parts = []; for (let i = 0; i < du.length; i += CH) parts.push(du.slice(i, i + CH));
      const w = [S.setDoc(S.doc(db, MEDIA, id), { kind: kind || 'photo', name: '', parts: parts.length, createdAt: new Date().toISOString() })];
      parts.forEach((p, i) => w.push(S.setDoc(S.doc(db, MEDIA, id + '__' + i), { d: p })));
      return Promise.all(w);
    },
    async getMedia(id) { const m = await S.getDoc(S.doc(db, MEDIA, id)); if (!m.exists()) return null; let du = ''; for (let i = 0; i < (m.data().parts || 0); i++) { const c = await S.getDoc(S.doc(db, MEDIA, id + '__' + i)); if (c.exists()) du += c.data().d || ''; } return du; },
    saveCharge(c) { return S.setDoc(S.doc(db, 'phenix_charges', String(c.id)), c); },
    delCharge(id) { return S.deleteDoc(S.doc(db, 'phenix_charges', String(id))); },
    saveMsg(m) { return S.setDoc(S.doc(db, 'phenix_ch_messages', String(m.id)), m); },
    listenId(name, cb) { return S.onSnapshot(S.collection(db, name), function(snap){ var a = []; snap.forEach(function(d){ a.push(Object.assign({ _id:d.id }, d.data())); }); cb(a); }, function(e){ console.warn(name, e && e.message); }); },
    listenSub(path, cb) { return S.onSnapshot(S.collection.apply(null, [db].concat(path)), function(snap){ var a = []; snap.forEach(function(d){ a.push(Object.assign({ _id:d.id }, d.data())); }); cb(a); }, function(e){ console.warn('journal client', e && e.message); }); },

var REC = { on:false, sr:null, text:'', interim:'' };

  found.sort(function(a, b){ return a.i - b.i; });

  if (found[0].i > 0) out.avancement = text.slice(0, found[0].i).trim();
  found.forEach(function(f, n){ var end = n + 1 < found.length ? found[n + 1].i : text.length, seg = text.slice(f.i + f.len, end).replace(/^[\s:,.\-–]+/, '').replace(/[\s,]+$/, '').trim(); out[f.k] = (out[f.k] ? out[f.k] + ' ' : '') + seg; });

function proposeAv(text){

    }

    '<div class="muted" style="font-size:13px;margin-top:6px">' + (x.lots ? x.done + ' lot(s) terminé(s) sur ' + x.lots + ' · ' + x.avg + ' % fait' : 'Aucun lot') + (c.fin ? ' · fin prévue ' + frDate(c.fin) : '') + '</div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' + k('Réserves ouvertes', x.rs) + k('Messages non lus', x.msgs) + k('Comptes rendus à valider', x.crPend) + k('Prochaine réunion', x.prochaine ? esc(x.prochaine) : '—') + '</div>' +
    '<div class="card"><div class="eyebrow">À faire</div><div id="gd-tk" style="margin-top:4px">' + tachesHtml(c) + '</div></div><div class="card"><div class="eyebrow">Sur le chantier</div><div style="margin-top:4px">' + (arts.length ? arts.join('<br>') : '<span class="muted">Aucun lot en cours.</span>') + '</div></div>' +
    (x.flags.length ? '<div style="display:flex;flex-direction:column;gap:6px">' + x.flags.slice(0, 5).map(function(f){ return '<button type="button" class="flag" data-gt="' + (f.tab || '') + '"><b style="flex-shrink:0">' + (f.lvl === 2 ? '✕ Bloquant' : '⚠ À voir') + '</b><span>' + esc(f.txt) + '</span></button>'; }).join('') + '</div>' : '<div class="card">✓ Rien à signaler.</div>') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="button" data-gm="terrain">Ouvrir sur le terrain</button>' + (staff ? '<button class="btn" type="button" data-gm="bureau">Bureau</button>' : '') + '</div></div></div>';
  $('garde').innerHTML = h;
  [].forEach.call($('garde').querySelectorAll('[data-gm]'), function(b){ b.onclick = function(){ openChantier(c.id, b.getAttribute('data-gm')); }; });
  [].forEach.call($('garde').querySelectorAll('[data-gt]'), function(b){ b.onclick = function(){ var t = b.getAttribute('data-gt'); if (t) S.tab = t; openChantier(c.id, t ? 'bureau' : S.mode); }; });
  [].forEach.call($('garde').querySelectorAll('[data-tk]'), function(b){ b.onchange = function(){ tacheFait(c, b.getAttribute('data-tk'), b.checked); }; });
  gdMaquette(c);
}
function gdMaquette(c){
  if (GD.cid === c.id && GD.X) return; gdStop(); GD.cid = c.id;
  thFiche(c).then(function(m){
    if (!m || S.screen !== 'garde' || GD.cid !== c.id) return;
    var go = function(){
      if (S.screen !== 'garde' || GD.cid !== c.id || GD.X) return;
      var host = $('gd-3d'); if (!host) return; var X = window.PXModel.create(); GD.X = X; X.quiet = true; X.cfg = m;
      X.loader = (FB.demo && window.__DEMO_GLB) ? function(){ return Promise.resolve(window.__DEMO_GLB); } : maqLoader(c, m);
      X.onfail = function(){ if (GD.X === X) { try{ X.dispose(); }catch(e){} GD.X = null; } };
      X.onload = function(){ var sv = host.querySelector('svg'); if (sv) sv.remove(); try{ X.setActive(true); X.setStage(c.etape || null); X.setMode('out'); X.overview(); }catch(e){} };
      try{ X.init(host, HZ, function(){}); }catch(e){ GD.X = null; }
    };

/* Les fiches des chantiers (cartes avec maquette 3D et signaux) s'ouvrent depuis la Synthèse 3D : message ouvrir-module {module:'chantier', projetId:'fiches'}.
   Dans le Shell, « ← Synthèse » ramène à la Synthèse ; hors Shell le bouton n'existe pas. */
function embedded(){ try{ return window.parent !== window && !FB.demo; }catch(e){ return false; } }

function goHome(){ S.screen = 'home'; setMode(S.mode); }
/* Glisser une barre du Planning : décaler / changer les dates (jour entier) */
function barDrag(el){
  var lot = D.lots.filter(function(y){ return y.id == el.getAttribute('data-bar'); })[0]; if (!lot) return;
  var ppd = S.zoom === 'mois' ? 5 : 14, x0, l0, w0, mode = null;
  el.onpointerdown = function(e){ mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm'; x0 = e.clientX; l0 = parseFloat(el.style.left); w0 = parseFloat(el.style.width); el.setPointerCapture(e.pointerId); e.preventDefault(); };
  el.onpointermove = function(e){ if (!mode) return; var dx = Math.round((e.clientX - x0) / ppd) * ppd; if (mode === 'm') el.style.left = (l0 + dx) + 'px'; else if (mode === 'l') { el.style.left = (l0 + dx) + 'px'; el.style.width = Math.max(ppd, w0 - dx) + 'px'; } else el.style.width = Math.max(ppd, w0 + dx) + 'px'; };
  el.onpointerup = function(){
    if (!mode) return; mode = null; var r = rangeDates(lotsOf()), a = parseFloat(el.style.left), w = parseFloat(el.style.width);
    var iso = function(px){ var d = new Date(r.min.getTime() + Math.round(px / ppd) * 864e5); return d.toISOString().slice(0, 10); };
    lot.debut = iso(a); lot.fin = iso(a + w); save('lots', lot); renderBureau();
  };
}

/* ═══════════ Démarrage ═══════════ */
function renderAll(){ renderTop(); renderTabs(); if (S.screen === 'home') { renderHome(); return; } if (S.screen === 'garde') { renderGarde(); return; } renderStageBar(); renderTiles(); renderBureau(); renderMic(); applyStage(); }

function ensureChantier(){
  if (S.cid != null && chantier()) return;
  var want = lk('px2.cid'), act = D.chantiers.filter(function(c){ return c.statut !== 'termine' && c.statut !== 'archive'; });
  var pick = D.chantiers.filter(function(c){ return String(c.id) === want; })[0] || act[0] || D.chantiers[0];
  if (pick) { S.cid = pick.id; boot2(); }
}
function cliStart(){
  if (FB.demo || S.role !== 'admin' || !FB.listenId) return;
  if (!CLI.on.__n) { CLI.on.__n = 1; FB.listenId('phenix_notifs_client', function(a){ CLI.notifs = (a || []).filter(function(x){ return x.lu === false; }); if (S.tab === 'messages' && S.screen === 'chantier') renderBureau(); renderTabs(); }); }
  D.chantiers.forEach(function(c){ if (!c.projetId || CLI.on[c.projetId]) return; CLI.on[c.projetId] = 1; FB.listenSub(['phenix_portail', String(c.projetId), 'journal'], function(a){ CLI.j[String(c.projetId)] = a || []; if (S.tab === 'messages' && S.screen === 'chantier') renderBureau(); }); });
}
function startData(){

  ['chantiers', 'lots', 'intervenants', 'reserves', 'crs', 'factures', 'plans', 'messages'].forEach(function(k){ FB.listen(k, function(a, pend){ D[k] = a; S.pending = !!pend; if (k === 'chantiers') cliStart(); any(); }); });
}
var ADMIN_EMAILS = ['contact@phenixarchitecte.fr'];   /* même repli que l'ancien Chantier */
function authed(email){
  FB.role(email.toLowerCase()).then(function(role){
    S.role = role || ''; S.user = email;
    if (['admin', 'equipe', 'chantier'].indexOf(S.role) < 0 && ADMIN_EMAILS.indexOf(email.toLowerCase()) >= 0) S.role = 'admin';
    if (['admin', 'equipe', 'chantier'].indexOf(S.role) < 0) { $('app').innerHTML = '<div class="card" style="margin:24px">Ce module est réservé à l\'équipe Phénix.</div>'; return; }
    $('login').style.display = 'none'; if (S.role === 'chantier') S.mode = 'terrain'; setMode(S.mode); startData();
  }).catch(function(e){ console.warn('Rôle illisible', e && e.message); if (ADMIN_EMAILS.indexOf(String(email).toLowerCase()) >= 0) { S.role = 'admin'; $('login').style.display = 'none'; setMode(S.mode); startData(); } else $('app').innerHTML = '<div class="card" style="margin:24px">Accès impossible (rôle illisible).</div>'; });
}
function init(){
  S.mode = lk('px2.mode') === 'bureau' ? 'bureau' : 'terrain';
  window.addEventListener('online', function(){ S.online = true; renderTop(); }); window.addEventListener('offline', function(){ S.online = false; renderTop(); });
  /* ordres du Shell : ouvrir le chantier d'un dossier */
  window.addEventListener('message', function(ev){ var d = ev.data; if (!d || d.source !== 'phenix-shell' || d.action !== 'open-projet' || d.id == null) return; if (String(d.id) === 'fiches') { S.screen = 'home'; setMode(S.mode); return; } var c = D.chantiers.filter(function(x){ return String(x.projetId) === String(d.id); })[0]; if (c) { S.cid = c.id; S.screen = 'chantier'; M3.cid = null; S.tab = d.onglet === 'planning' ? 'planning' : d.onglet === 'avancement' ? 'lots' : d.onglet === 'reception' ? 'reserves' : 'recap'; setMode(S.mode); boot2(); } });
  try { window.parent.postMessage({ source:'phenix-chantier', ready:true }, '*'); } catch (e) {}
  if (FB.demo) { demoSeed(); setMode(S.mode); boot2(); return; }
  $('lg-go').onclick = function(){ FB.login($('lg-e').value.trim(), $('lg-p').value).catch(function(){ $('lg-m').textContent = 'Connexion refusée.'; }); };
  FB.onAuth(function(u){ if (u) authed(u.email); else if (window.parent === window) $('login').style.display = 'flex'; });
}
if (window.FB) init(); else window.addEventListener('fb-loaded', init, {once:true});
