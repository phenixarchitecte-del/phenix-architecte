<style>
:root{--bg:#0a1628;--pan:#101f38;--pan2:#16283f;--text:#e5ecf3;--text2:#a9bbd0;--text3:#8fb5da;--accent:#4fa8f0;--green:#4fd18b;--amber:#e6b95c;--red:#e0776c;--line:rgba(120,170,220,.22);--fs:'DM Sans',system-ui,sans-serif;--fd:'DM Serif Display',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--fs);-webkit-tap-highlight-color:transparent}
button{font-family:var(--fs);cursor:pointer;color:var(--text)}
input,select,textarea{font-family:var(--fs);color:var(--text);background:#0a1628;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.45}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid rgba(120,170,220,.35);background:var(--pan2);font:600 15px var(--fs);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:#06121f;border:0;font-weight:700}
.btn.ghost{background:transparent}
.btn.big{min-height:60px;font-size:17px;border-radius:16px;padding:0 24px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:600 13px var(--fs);background:rgba(255,255,255,.04)}
.chip.blue{background:rgba(79,168,240,.14);border-color:rgba(79,168,240,.5);color:#cfe6fb}
.chip.amber{border-color:rgba(230,185,92,.6);color:#f3dfb0}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--pan);border:1px solid var(--line)}
.seg button{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:transparent;font:500 15px var(--fs);color:#b8c9dc}
.seg button[aria-pressed=true]{background:var(--accent);color:#06121f;font-weight:700}
.seg.light button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--text3);font-weight:600;text-transform:uppercase}
.card{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--text2);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--fd)}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
#top .nm{font:400 26px/1.1 var(--fd)}
#top .sp{flex:1}
#tabs{display:flex;gap:6px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs[hidden]{display:none}
#tabs button{min-height:48px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;font:500 15px var(--fs);color:#b8c9dc;white-space:nowrap}
#tabs button[aria-current=page]{border-bottom-color:var(--accent);color:var(--text);font-weight:700}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
/* TERRAIN */
#terrain{flex:1;min-height:0;display:flex;gap:14px;padding:14px 18px 0}
#stage{flex:1;min-width:0;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#14294b,#0d1d36);border:1px solid var(--line)}
#h3-host{position:absolute;inset:0}
#tiles{position:absolute;inset:0;overflow:auto;padding:16px;display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.tile{min-height:92px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--pan2);display:flex;flex-direction:column;gap:6px}
.tile[aria-pressed=true]{border:2px solid var(--accent);background:rgba(79,168,240,.12)}
.tile b{font-size:16px}
#stagebar{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:7}
#side{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
#dock{display:flex;align-items:center;gap:8px;padding:12px 18px 16px;overflow-x:auto}
.ph{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;font:500 14px var(--fs);color:#c3d3e6;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ph[aria-current=step]{border:2px solid var(--accent);background:rgba(79,168,240,.14);color:#fff;font-weight:700}
.ph.past{color:var(--text2)}
#mic{position:absolute;right:16px;bottom:16px;z-index:8;min-height:68px;padding:0 26px;border-radius:34px;border:0;background:var(--accent);color:#06121f;font:700 18px var(--fs);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(135deg,#4fa8f0 0 6px,#2f6fc0 6px 12px)}
/* pastilles du moteur partagé */
.h3-cv{display:block;width:100%;height:100%;outline:0;touch-action:none}
.h3-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.h3-sp{position:absolute;left:0;top:0;will-change:transform}.h3-sp[data-state=todo] .h3-dot,.h3-dot{background:#fff;border-style:dashed;border-color:#8a9bb2}.h3-sp[data-state] .h3-dot{border-style:solid;border-color:#fff}.h3-sp[data-state=todo] .h3-dot{border-style:dashed;border-color:#8a9bb2}
.h3-dot{pointer-events:auto;position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#8a9bb2;padding:0;color:#06121f;font:700 18px/34px var(--fs);text-align:center}
.h3-dot::after{content:""}
.h3-sp[data-state=doing] .h3-dot{background:linear-gradient(90deg,var(--accent) 50%,#fff 50%)}
.h3-sp[data-state=done] .h3-dot{background:var(--green)}.h3-sp[data-state=done] .h3-dot::after{content:"✓"}
.h3-sp[data-state=issue] .h3-dot{background:var(--red);color:#fff}.h3-sp[data-state=issue] .h3-dot::after{content:"!"}
.h3-sp.back .h3-dot{opacity:.5}
.h3-line,.h3-lab{display:none}
.h3-sp.open .h3-line{display:block;position:absolute;left:0;bottom:22px;width:2px;height:40px;margin-left:-1px;background:#fff}
.h3-sp.open .h3-lab{display:block;pointer-events:auto;position:absolute;left:0;transform:translateX(-50%);bottom:62px;white-space:nowrap;text-align:left;background:#fff;color:#0a1628;border:0;border-radius:10px;padding:8px 14px;font:700 14px var(--fs)}
.h3-lab small{display:block;font:400 12px var(--fs);color:#4a5a78}.h3-lab em{display:none}
.h3-sp.flip.open .h3-line{bottom:auto;top:22px}.h3-sp.flip.open .h3-lab{bottom:auto;top:62px}
/* DICTÉE / FEUILLES */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;overflow:auto}
#overlay.on{display:flex}
.sheetbg{position:fixed;inset:0;background:rgba(5,10,20,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);background:var(--pan);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.rub{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--pan2)}
.rub.miss{border:2px dashed var(--amber)}
.rec{width:14px;height:14px;border-radius:50%;background:var(--red);animation:pul 1.2s infinite}
@keyframes pul{50%{opacity:.25}}
/* BUREAU */
#bureau{flex:1;min-height:0;overflow:auto;padding:16px 18px 40px;display:none}
.tbl{border-radius:16px;background:var(--pan);border:1px solid var(--line);overflow-x:auto}
.row{display:grid;grid-template-columns:44px minmax(150px,240px) 150px 90px minmax(120px,1fr);align-items:center;min-height:60px;border-top:1px solid rgba(120,170,220,.16);padding-right:14px}
.row.h{min-height:40px;border-top:0;font-size:12px;letter-spacing:.08em;color:var(--text3);font-weight:600}
.row.sel{background:rgba(79,168,240,.1)}
.row>*:first-child{padding-left:14px}
.gantt{position:relative}
.gl{position:sticky;left:0;z-index:2;width:230px;flex-shrink:0;height:56px;display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--line);background:var(--pan)}
.grow{display:flex;border-top:1px solid rgba(120,170,220,.16);position:relative}
.gb{position:absolute;top:17px;height:22px;border-radius:6px;touch-action:none;cursor:grab}
.gb.done{background:var(--green)}.gb.doing{border:2px solid var(--accent);background:rgba(79,168,240,.12);overflow:hidden}.gb.todo{border:2px dashed #9fb2c6}
.gb .hd{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}.gb .hd.l{left:0}.gb .hd.r{right:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;z-index:99}
@media(max-width:900px){#terrain{flex-direction:column}#side{width:auto;flex-direction:row;flex-wrap:wrap}#stage{min-height:46vh;flex:none}}
</style>

  try { AC.initializeAppCheck(app, { provider: new AC.ReCaptchaV3Provider('6LeObWktAAAAAL9eyppDRtLp5yZTyBaF4ZNKXNIO'), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn('App Check', e); }
  let db;
  try { db = S.initializeFirestore(app, { localCache: S.persistentLocalCache({ tabManager: S.persistentMultipleTabManager() }) }); } catch (e) { db = S.getFirestore(app); }
  const auth = U.getAuth(app);

    ready: true,
    login: (e, p) => U.signInWithEmailAndPassword(auth, e, p),
    onAuth: cb => U.onAuthStateChanged(auth, cb),
    user: () => auth.currentUser,
    async role(email) { const s = await S.getDoc(S.doc(db, 'phenix_users', email)); return s.exists() ? (s.data().role || '') : ''; },
    listen(key, cb) { return S.onSnapshot(S.collection(db, COLS[key]), { includeMetadataChanges: true }, snap => { const a = []; snap.forEach(d => a.push(d.data())); cb(a, snap.metadata.hasPendingWrites); }, e => console.warn(key, e && e.message)); },
    save(key, obj) { return S.setDoc(S.doc(db, COLS[key], String(obj.id)), obj); },

      const w = [S.setDoc(S.doc(db, MEDIA, id), { kind: kind || 'photo', name: '', parts: parts.length, createdAt: new Date().toISOString() })];
      parts.forEach((p, i) => w.push(S.setDoc(S.doc(db, MEDIA, id + '__' + i), { d: p })));
      return Promise.all(w);
    },
    async getMedia(id) { const m = await S.getDoc(S.doc(db, MEDIA, id)); if (!m.exists()) return null; let du = ''; for (let i = 0; i < (m.data().parts || 0); i++) { const c = await S.getDoc(S.doc(db, MEDIA, id + '__' + i)); if (c.exists()) du += c.data().d || ''; } return du; },
    publishClient(pid, payload) { return S.setDoc(S.doc(db, 'phenix_chantier_client', String(pid)), payload); }

<script>
'use strict';
/* ═══════════ Constantes ═══════════ */
var ETAPES = ['Terrassement','Réseaux enterrés','Fouilles et ferraillage','Coulage des semelles','Dalle sur terre-plein','Liaison fondations – murs','Montée des murs','Linteaux','Chaînage haut et pignons','Charpente : fermes','Charpente : pannes','Charpente : chevrons','Écran et liteaux','Couverture','Pose des menuiseries','Isolation : doublage','Faux plafonds et isolation toit','Cloisons','Plomberie','Électricité','Chauffage','Plaques de plâtre et portes','Sols et peinture','Cuisine et salle de bain','Mobilier','Extérieurs et réception'];
var PHASES = [['Préparation',1,2],['Gros œuvre',3,9],['Hors d\'eau',10,15],['Second œuvre',16,22],['Finitions',23,25],['Réception',26,26]];
var HZ = [['couverture','Couverture'],['murs','Gros œuvre et murs'],['menuiseries','Menuiseries'],['porte','Portes'],['volets','Volets'],['plancher','Planchers'],['cloture','Clôture'],['portail','Portail'],['allee','Allée']].map(function(z){ return {id:z[0], t:z[1], m:'out'}; });
var ZONE_RE = [['couverture',/couvert|toit|charpent|zinc|tuile/i],['menuiseries',/menuis|fen[eê]tr|baie|vitr/i],['porte',/porte/i],['volets',/volet/i],['plancher',/dalle|plancher|chape/i],['portail',/portail/i],['cloture',/cl[oô]ture/i],['allee',/all[ée]e|terrasse|vrd/i],['murs',/gros|ma[cç]on|mur|fa[cç]ade|fondation|terrass|enduit/i]];
var LOT_ST = { done:['Terminé','var(--green)'], doing:['En cours','var(--accent)'], todo:['À venir','var(--text2)'], issue:['Avec réserves','var(--red)'] };
/* icône + mot : jamais la couleur seule (Maxime est daltonien) */
function ico(k){
  var c = LOT_ST[k][1], a = 'width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"';
  if (k === 'done') return '<svg ' + a + '><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if (k === 'doing') return '<svg ' + a + '><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="' + c + '" stroke="none"/></svg>';
  if (k === 'issue') return '<svg ' + a + '><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></svg>';
  return '<svg ' + a + ' stroke-dasharray="3.5 3.5"><circle cx="12" cy="12" r="8"/></svg>';
}

/* ═══════════ Utilitaires ═══════════ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
function today(){ return new Date().toISOString().slice(0, 10); }
function frDate(iso){ if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function norm(s){ return String(s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function toast(m){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200); }
function lk(key, v){ try{ if (v === undefined) return localStorage.getItem(key); localStorage.setItem(key, v); }catch(e){ return null; } }
function stOf(lot){ var s = lot.statut; return s === 'termine' ? 'done' : s === 'en_cours' ? 'doing' : s === 'reserve' ? 'issue' : 'todo'; }
function stHtml(k){ var s = LOT_ST[k]; return '<span class="st" style="color:' + s[1] + '">' + ico(k) + s[0] + '</span>'; }
function zoneOf(lot){ for (var i = 0; i < ZONE_RE.length; i++) if (ZONE_RE[i][1].test(lot.nom || '')) return ZONE_RE[i][0]; return null; }
function phaseIdx(n){ for (var i = 0; i < PHASES.length; i++) if (n >= PHASES[i][1] && n <= PHASES[i][2]) return i; return -1; }

/* ═══════════ Données ═══════════ */
var D = { chantiers:[], lots:[], intervenants:[], reserves:[], crs:[] };
var S = { mode:'terrain', tab:'lots', view:'liste', zoom:'mois', cid:null, lotId:null, role:'', pending:false, online:navigator.onLine, real:false, in3d:'out', maq:null, user:'' };
function chantier(){ return D.chantiers.filter(function(c){ return c.id == S.cid; })[0] || null; }
function lotsOf(){ return D.lots.filter(function(l){ return l.chantierId == S.cid; }).sort(function(a, b){ return String(a.nom).localeCompare(String(b.nom), 'fr', {numeric:true}); }); }

  found.sort(function(a, b){ return a.i - b.i; });

  return out;
}

      if (m) { var v = Math.max(0, Math.min(100, +m[2])); if (v !== (l.av || 0)) res.push({ lotId:l.id, from:l.av || 0, to:v, on:true }); break; }
    }
  });
  return res;
}

  q('[data-statut]', function(x){ x.onchange = function(){ var l = D.lots.filter(function(y){ return y.id == x.getAttribute('data-statut'); })[0]; if (!l) return; l.statut = x.value; if (l.statut === 'termine') l.av = 100; save('lots', l); renderBureau(); }; });
  q('[data-av]', function(x){ x.onchange = function(){ var l = D.lots.filter(function(y){ return y.id == x.getAttribute('data-av'); })[0]; if (!l) return; l.av = Math.max(0, Math.min(100, parseFloat(x.value) || 0)); if (l.av > 0 && l.av < 100 && l.statut === 'attribue') l.statut = 'en_cours'; if (l.av === 100) l.statut = 'termine'; save('lots', l); renderBureau(); }; });
  q('[data-rstat]', function(x){ x.onchange = function(){ var r = D.reserves.filter(function(y){ return y.id == x.getAttribute('data-rstat'); })[0]; if (!r) return; r.statut = x.value; r.dateLevee = (x.value === 'levee' || x.value === 'verifiee') ? (r.dateLevee || today()) : ''; save('reserves', r); renderBureau(); }; });
  q('[data-valid]', function(x){ x.onclick = function(){ validerCR(+x.getAttribute('data-valid')); }; });
  q('[data-ignore]', function(x){ x.onclick = function(){ var c = D.crs.filter(function(y){ return y.id == x.getAttribute('data-ignore'); })[0]; if (c && confirm('Ignorer : le compte rendu reste enregistré mais rien n\'est appliqué aux lots ni aux réserves.')) { c.aValider = false; c.ignore = true; save('crs', c); renderBureau(); renderTabs(); } }; });
  q('[data-bar]', function(x){ barDrag(x); });
}
function validerCR(id){
  var c = D.crs.filter(function(y){ return y.id == id; })[0]; if (!c) return;
  (c.propositions || []).forEach(function(q){ var l = D.lots.filter(function(y){ return y.id == q.lotId; })[0]; if (!l) return; l.av = q.a; if (q.a > 0 && q.a < 100 && l.statut === 'attribue') l.statut = 'en_cours'; if (q.a === 100) l.statut = 'termine'; save('lots', l); });
  var n = D.reserves.filter(function(r){ return r.chantierId == c.chantierId; }).length;
  (c.reservesNouvelles || []).forEach(function(r){ n++; var photos = r.photoMediaId ? [{ mediaId:r.photoMediaId, caption:'' }] : []; var rs = { id:uid(), chantierId:c.chantierId, ref:'R' + String(n).padStart(2, '0'), titre:r.titre, description:r.description || '', lieu:r.lieu || '', lotId:r.lotId || null, intervId:null, priorite:'normale', origine:'visite ' + c.num, echeance:'', statut:'ouverte', dateLevee:'', photos:photos }; D.reserves.push(rs); save('reserves', rs); });
  c.aValider = false; c.valideLe = new Date().toISOString(); save('crs', c);
  toast('Compte rendu validé : lots et réserves mis à jour.'); renderBureau(); renderTabs();
}
/* Glisser une barre du Planning : décaler / changer les dates (jour entier) */
function barDrag(el){
  var lot = D.lots.filter(function(y){ return y.id == el.getAttribute('data-bar'); })[0]; if (!lot) return;
  var ppd = S.zoom === 'mois' ? 5 : 14, x0, l0, w0, mode = null;
  el.onpointerdown = function(e){ mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm'; x0 = e.clientX; l0 = parseFloat(el.style.left); w0 = parseFloat(el.style.width); el.setPointerCapture(e.pointerId); e.preventDefault(); };
  el.onpointermove = function(e){ if (!mode) return; var dx = Math.round((e.clientX - x0) / ppd) * ppd; if (mode === 'm') el.style.left = (l0 + dx) + 'px'; else if (mode === 'l') { el.style.left = (l0 + dx) + 'px'; el.style.width = Math.max(ppd, w0 - dx) + 'px'; } else el.style.width = Math.max(ppd, w0 + dx) + 'px'; };
  el.onpointerup = function(){
    if (!mode) return; mode = null; var r = rangeDates(lotsOf()), a = parseFloat(el.style.left), w = parseFloat(el.style.width);
    var iso = function(px){ var d = new Date(r.min.getTime() + Math.round(px / ppd) * 864e5); return d.toISOString().slice(0, 10); };
    lot.debut = iso(a); lot.fin = iso(a + w); save('lots', lot); renderBureau();
  };
}

/* ═══════════ Démarrage ═══════════ */
function renderAll(){ renderTop(); renderTabs(); if (S.mode === 'terrain') { renderStageBar(); renderTiles(); renderSide(); renderDock(); renderMic(); applyStage(); } else renderBureau(); }
function boot2(){
  var c = chantier(); if (!c) { renderAll(); return; }
  visGet(c.id).then(function(v){ VIS = v; renderAll(); loadMaquette(); });
}
function ensureChantier(){
  if (S.cid != null && chantier()) return;
  var want = lk('px2.cid'), act = D.chantiers.filter(function(c){ return c.statut !== 'termine' && c.statut !== 'archive'; });
  var pick = D.chantiers.filter(function(c){ return String(c.id) === want; })[0] || act[0] || D.chantiers[0];
  if (pick) { S.cid = pick.id; boot2(); }
}
function startData(){
  var n = 0, any = function(){ ensureChantier(); if (S.mode === 'terrain') { renderSide(); renderTiles(); renderDock(); applyStage(); renderTop(); } else { renderBureau(); renderTabs(); } };
  ['chantiers', 'lots', 'intervenants', 'reserves', 'crs'].forEach(function(k){ FB.listen(k, function(a, pend){ D[k] = a; S.pending = !!pend; any(); }); });
}
var ADMIN_EMAILS = ['contact@phenixarchitecte.fr'];   /* même repli que l'ancien Chantier */
function authed(email){
  FB.role(email.toLowerCase()).then(function(role){
    S.role = role || ''; S.user = email;
    if (['admin', 'equipe', 'chantier'].indexOf(S.role) < 0 && ADMIN_EMAILS.indexOf(email.toLowerCase()) >= 0) S.role = 'admin';
    if (['admin', 'equipe', 'chantier'].indexOf(S.role) < 0) { $('app').innerHTML = '<div class="card" style="margin:24px">Ce module est réservé à l\'équipe Phénix.</div>'; return; }
    $('login').style.display = 'none'; if (S.role === 'chantier') S.mode = 'terrain'; setMode(S.mode); startData();
  }).catch(function(e){ console.warn('Rôle illisible', e && e.message); if (ADMIN_EMAILS.indexOf(String(email).toLowerCase()) >= 0) { S.role = 'admin'; $('login').style.display = 'none'; setMode(S.mode); startData(); } else $('app').innerHTML = '<div class="card" style="margin:24px">Accès impossible (rôle illisible).</div>'; });
}
function init(){
  S.mode = lk('px2.mode') === 'bureau' ? 'bureau' : 'terrain';
  window.addEventListener('online', function(){ S.online = true; renderTop(); }); window.addEventListener('offline', function(){ S.online = false; renderTop(); });
  /* ordres du Shell : ouvrir le chantier d'un dossier */
  window.addEventListener('message', function(ev){ var d = ev.data; if (!d || d.source !== 'phenix-shell' || d.action !== 'open-projet' || d.id == null) return; var c = D.chantiers.filter(function(x){ return String(x.projetId) === String(d.id); })[0]; if (c) { S.cid = c.id; M3.cid = null; if (d.onglet === 'avancement' || d.onglet === 'planning') { S.mode = 'bureau'; S.tab = 'lots'; S.view = d.onglet === 'planning' ? 'planning' : 'liste'; } else if (d.onglet === 'reception') { S.mode = 'bureau'; S.tab = 'reserves'; } setMode(S.mode); boot2(); } });
  try { window.parent.postMessage({ source:'phenix-chantier', ready:true }, '*'); } catch (e) {}
  if (FB.demo) { demoSeed(); setMode(S.mode); boot2(); return; }
  $('lg-go').onclick = function(){ FB.login($('lg-e').value.trim(), $('lg-p').value).catch(function(){ $('lg-m').textContent = 'Connexion refusée.'; }); };
  FB.onAuth(function(u){ if (u) authed(u.email); else if (window.parent === window) $('login').style.display = 'flex'; });
}
if (window.FB) init(); else window.addEventListener('fb-loaded', init, {once:true});
</script>
