<!DOCTYPE html>
<html lang="fr">
<head>
<!--
 PHÉNIX — PORTAIL UNIQUE DE L'ASSISTANTE ADMINISTRATIVE (phenix_assistante.html)
 16/10/2026 — Un seul point d'entrée, deux onglets :
   • « Devis à relancer » → phenix_relances.html  (mode restreint : ?restreint=1)
   • « Tâches à réaliser » → phenix_espace.html   (mode restreint : ?restreint=1)
 Cette page ne contient aucune logique métier : elle affiche les deux modules existants
 et relaie les messages avec le Shell (connexion automatique, ouverture de Dossier…).
 Paramètre facultatif : ?tab=taches pour ouvrir directement sur les tâches.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<title>Phénix-Architecture · Espace assistante</title>
<style>
:root{--bg:#0a1628;--bg2:#0d1c33;--card:rgba(16,31,56,.90);--text:#e5ecf3;--text2:#9fb2c6;--border:rgba(120,170,220,.18);--accent:#4fa8f0;--amber:#e6b95c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg2);border-bottom:1px solid var(--border)}
.brand{font-family:'DM Serif Display',Georgia,serif;font-size:19px;color:#fff;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:8px;flex:1;justify-content:flex-end}
.tab{flex:1;max-width:260px;min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font:600 14px 'DM Sans',system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tab:hover{border-color:var(--accent)}
.tab.on{background:#12233f;border-color:var(--accent);color:#fff}
.tab .n{display:none;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--amber);color:#1a1200;font-size:12px;font-weight:700;text-align:center}
.tab .n.show{display:inline-block}
@media(max-width:620px){.brand{display:none}.tabs{justify-content:stretch}.tab{max-width:none;font-size:13px;padding:0 8px}}
.frames{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Phénix<span>-Architecture</span></div>
  <div class="tabs" role="tablist">
    <button class="tab on" id="t-devis" role="tab" data-tab="devis">📞 Devis à relancer <span class="n" id="n-devis"></span></button>
    <button class="tab" id="t-taches" role="tab" data-tab="taches">✅ Tâches à réaliser</button>
  </div>
</div>
<div class="frames">
  <iframe id="f-devis" title="Devis à relancer"></iframe>
  <iframe id="f-taches" title="Tâches à réaliser"></iframe>
</div>

<script>
(function(){
'use strict';
function $(id){ return document.getElementById(id); }
// Les deux modules sont toujours ouverts en mode « assistante » (restreint).
var SRC = { devis:'phenix_relances.html?restreint=1', taches:'phenix_espace.html?restreint=1' };
var frames = { devis:$('f-devis'), taches:$('f-taches') };
var loaded = {}, cached = null, current = null;

function show(k){
  if (!SRC[k]) return;
  if (!loaded[k]) { frames[k].src = SRC[k]; loaded[k] = true; }
  current = k;
  Object.keys(frames).forEach(function(x){
    frames[x].classList.toggle('on', x === k);
    $('t-' + x).classList.toggle('on', x === k);
    $('t-' + x).setAttribute('aria-selected', x === k ? 'true' : 'false');
  });
}
function post(fr, d){ try { fr.contentWindow.postMessage(d, '*'); } catch(e) {} }

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){ show(b.getAttribute('data-tab')); });
});

/* ── Relais des messages Shell ⇄ modules ──
   - Shell → modules : la connexion automatique (auto-login) est mémorisée puis transmise aux deux modules.
   - Modules → Shell : tout est relayé tel quel (ouverture de Dossier, création de projet…),
     sauf « ouvrir Devis » demandé depuis les tâches, qui devient simplement un changement d'onglet. */
window.addEventListener('message', function(ev){
  var d = ev.data, from = null;
  Object.keys(frames).forEach(function(k){ if (frames[k].contentWindow && ev.source === frames[k].contentWindow) from = k; });
  if (from) {
    if (d && d.source === 'phenix-espace' && d.action === 'open-module' && /relances|devis/i.test(String(d.module || d.name || d.target || ''))) { show('devis'); return; }
    if (d && d.readyForLogin && cached) { post(frames[from], cached); return; }   // identifiants déjà reçus : on les redonne
    if (window.parent !== window) { try { window.parent.postMessage(d, '*'); } catch(e) {} }
    return;
  }
  if (window.parent !== window && ev.source === window.parent) {
    if (d && d.action === 'auto-login' && d.email) cached = d;
    Object.keys(frames).forEach(function(k){ if (loaded[k]) post(frames[k], d); });
  }
});

/* Pastille « à relancer » sur l'onglet Devis (lecture du compteur du module, même domaine) */
setInterval(function(){
  try {
    var el = frames.devis.contentDocument.querySelector('[data-tab="todo"] .n');
    var n = el ? parseInt(el.textContent, 10) : 0;
    var b = $('n-devis');
    b.textContent = n > 0 ? n : ''; b.classList.toggle('show', n > 0);
  } catch(e) {}
}, 2500);

var wanted = (new URLSearchParams(location.search).get('tab') || '').toLowerCase();
show(wanted === 'taches' ? 'taches' : 'devis');
// on précharge l'autre onglet en arrière-plan pour que le changement soit immédiat
setTimeout(function(){ Object.keys(SRC).forEach(function(k){ if (!loaded[k]) { frames[k].src = SRC[k]; loaded[k] = true; } }); }, 1500);
})();
</script>
</body>
</html>
