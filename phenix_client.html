<!--
══════════════════════════════════════════════════════════════════════
 PHÉNIX — ESPACE CLIENT (phenix_client.html)
──────────────────────────────────────────────────────────────────────
 HISTORIQUE DES MODIFICATIONS
 27/11/2026 — [Statuts client v2] 52 statuts (S01 à S52) : petit texte sous le titre, et dessous les compteurs (devis, décennales, contrats), pièces de la
   déclaration, dommages-ouvrage, délai de recours, étapes du chantier, dernier compte rendu, constat, réserves, garanties et règlement de l'étape (d.suivi).
 25/11/2026 — [Conversation] « Le fil » montre aussi les échanges avec Phénix (messages de l'espace, réponses de Phénix par mail ou SMS) et
   permet d'« Écrire à Phénix » : le message arrive dans la cloche de Phénix et dans la fiche du dossier. Données : phenix_client_dossiers/{id}/messages.
 25/11/2026 — [Carnet] Le carnet de projet s'ouvre DANS l'espace client (bouton or « Ouvrir mon carnet de projet », puis onglet Carnet
   une fois validé) : accueil sur la maison en 3D, questions pas à pas, synthèse ; même connexion par lien magique, plus de mot de passe.
   Fichiers partagés : phenix_carnet_questions.js (questions), phenix_carnet_vue.js (écran), phenix_maquette3d.js / phenix_maison3d.js (3D).
   Données : phenix_portail/{id}/etat/fiche (lecture) et /etat/choix (lecture-écriture), règle Firestore à ajouter. Aperçu Phénix : ?apercu=<id>&carnet=1.
 25/11/2026 — [Espace client] Le côté Phénix quitte cette page : tout se gère dans Phénix Dossier (fiche projet › onglet « Espace client »),
   avec le statut qui change tout seul à chaque case de checklist liée à une étape. Ici ne restent que la vue du client et l'aperçu
   (?apercu=<id du projet>, compte Phénix). Les liens [texte](https://…) des statuts s'affichent comme de vrais liens.
 24/11/2026 — [Espace client] Création, charte « avec caractère » (skill phenix-charte-espace-client).
   CÔTÉ CLIENT (téléphone d'abord, s'adapte à la tablette et à l'ordinateur) :
   • Connexion par LIEN MAGIQUE : le client tape son e-mail, reçoit un lien, il est connecté sans mot de passe.
   • Écran Avancement : phase, statut (titre, délai, « de votre côté »), « Pourquoi cela prend-il ce temps ? »,
     parcours en 7 étapes, projet en pause, bouton or carnet / visite 3D (règles du parcours validées le 24/11).
   • Mes documents (Plans, 3D, Visuels, Photos, Contrats) et Le fil de votre projet.
   CÔTÉ PHÉNIX (même fichier, compte administrateur) :
   • Liste des dossiers (copie filtrée phenix_projets_assistante, jamais de montant).
   • Ouvrir l'accès d'un client et lui envoyer son lien ; publier un statut de la bibliothèque (78 statuts) ;
     ajouter une note au fil ; ajouter des documents (liens) ; carnet, carnet validé, visite 3D ; aperçu client.
   DONNÉES (nouvelles collections, règles Firestore à ajouter, voir REGLES_FIRESTORE_ESPACE_CLIENT.txt) :
   • phenix_client_acces/{email}  : { email, projetId, at, par }  → qui voit quel dossier
   • phenix_client_dossiers/{id}  : ce que voit le client (statut, parcours, documents, fil, carnet). Écrit par Phénix seul.
   PRÉ-REQUIS : Firebase › Authentication › Méthode de connexion › E-mail/Mot de passe › activer « Lien par e-mail ».
   Repérer : [Espace client].

<style>
:root{
  --bg:#0b1f4a; --bar:#12285a; --line:#2f4f86; --line2:#3b5f96;
  --or:#d4b26a; --or2:#f3dca6; --t1:#ffffff; --t2:#dfe9f6; --t3:#cfdcef; --t4:#a9c1e3; --t5:#8aa5cc;
  --alerte:#e0605a;
  --voile:rgba(11,31,74,0.72);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Jost',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--t4)} a:hover{color:#fff}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.ital{font-family:'Italiana',serif;font-weight:400}
#app{position:relative;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}
.wm{position:fixed;top:-30px;right:calc(50% - 280px - 55px);width:430px;height:617px;object-fit:contain;opacity:.3;pointer-events:none;z-index:0}
@media (max-width:560px){.wm{right:-55px}}
.page{position:relative;z-index:1;padding:24px 26px 170px}
.voile{background:var(--voile);box-shadow:0 0 10px 4px rgba(11,31,74,.6);border-radius:12px}
.marque{font-size:15px;font-weight:400;letter-spacing:7px;color:var(--or)}
.sous{font-size:12px;color:var(--t4)}
.h1{margin:0;font-family:'Italiana',serif;font-weight:400;font-size:44px;line-height:1.04}
.sv{margin-top:18px;padding:12px 14px;border-radius:16px;background:rgba(11,31,74,.78);border:.75px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.sv .t{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t5)}
.sv .l{display:flex;gap:10px;align-items:baseline;border-top:.5px solid var(--line);padding:7px 0;font-size:13px;color:var(--t2)}
.sv .l .e{margin-left:auto;font-size:12px;white-space:nowrap;text-align:right}
.sv .ok{color:var(--or2)} .sv .at{color:var(--t4)} .sv .al{color:var(--alerte)}
.sv .ch{font-size:13px;color:var(--t2)} .sv .ch b{font-weight:500;color:var(--or2)}
.jg{height:6px;border-radius:3px;background:rgba(255,255,255,.08);border:.5px solid var(--line);overflow:hidden}.jg span{display:block;height:100%;background:var(--or)}
.sv.or{border-color:var(--or);background:rgba(212,178,106,.08)} .sv.or .v{font-size:15px;font-weight:500;color:var(--or2)}
.h2{margin:0 0 14px 4px;font-family:'Italiana',serif;font-weight:400;font-size:22px}
.meta{font-size:11px;color:var(--t5)}
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;border:none;background:var(--or);color:var(--bg);font-size:15px;font-weight:500;text-decoration:none}
.btn-or:hover{color:var(--bg);filter:brightness(1.05)}
.btn-ligne{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:.75px solid var(--or);background:transparent;color:var(--or2);font-size:14px;font-weight:400;text-decoration:none}
.btn-discret{min-height:44px;padding:0 6px;border:none;background:none;color:var(--t4);font-size:13px}
.champ{width:100%;min-height:46px;padding:0 14px;border-radius:14px;border:.75px solid var(--line2);background:rgba(11,31,74,.85);color:#fff;font-family:inherit;font-size:15px;font-weight:300}
textarea.champ{min-height:96px;padding:10px 14px;line-height:1.5;resize:vertical}
select.champ{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--or) 50%),linear-gradient(135deg,var(--or) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
label.lib{display:block;font-size:11px;color:var(--t4);margin:14px 0 6px}
/* barre du bas */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(536px,calc(100% - 24px));padding:6px;border-radius:24px;background:var(--bar);border:.75px solid var(--line2);box-shadow:0 10px 30px rgba(3,10,30,.55);display:flex;flex-direction:column;gap:6px;z-index:20}
.nav .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;border-radius:18px;border:.75px solid var(--line);background:none;color:var(--t3);font-size:12px;font-weight:400;text-decoration:none}
.tab[aria-current="page"]{color:var(--or2);border:1px solid var(--or);background:rgba(212,178,106,.14)}
.tab svg{stroke:currentColor}
.nav .btn-or{min-height:44px;border-radius:18px}
/* parcours */
.parcours{position:relative}
.parcours ol{list-style:none;margin:0;padding:0 0 0 72px}
.parcours li{height:54px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t2)}
.parcours li.avenir{color:var(--t5)}
.parcours li.encours{font-family:'Italiana',serif;font-size:17px;color:#fff}
.parcours li .et{font-family:'Jost',sans-serif;font-size:11px;font-weight:400;color:var(--t4)}
.parcours li.encours .et{color:var(--or)}
details.pq summary{list-style:none;display:inline-flex;align-items:center;gap:10px;min-height:36px;padding:0 12px 0 10px;border-radius:17px;border:.5px solid var(--line2);background:rgba(11,31,74,.8);color:var(--t4);font-size:12px;font-weight:400}
details.pq summary::-webkit-details-marker{display:none}
details.pq[open] summary svg{transform:rotate(90deg)}
details.pq p{margin:12px 0 0;font-size:13px;line-height:1.6;color:var(--t2)}
/* listes */
.liste{padding:0 14px;background:rgba(11,31,74,.78);box-shadow:0 0 22px 14px rgba(11,31,74,.78);border-radius:14px}
.ligne{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:.5px solid var(--line);text-decoration:none;color:#fff}
.ligne:last-child{border-bottom:none}
.puces{display:flex;flex-wrap:wrap;gap:10px}
.puce{min-height:36px;padding:0 14px;border-radius:18px;border:.5px solid var(--line2);background:rgba(11,31,74,.8);color:var(--t3);font-size:13px;font-weight:400}
.puce[aria-selected="true"]{border:1px solid var(--or);color:var(--or2);background:rgba(212,178,106,.14)}
.fil{list-style:none;margin:34px 0 0;padding:0;position:relative}
.fil:before{content:"";position:absolute;left:8.5px;top:10px;bottom:30px;width:.75px;background:#4f72a8}
.fil li{position:relative;display:flex;gap:16px;padding:0 0 20px}
.fil .pt{flex:none;width:18px;display:flex;justify-content:center;padding-top:4px}
.fil .corps{flex:1;padding:2px 8px;margin:-2px -8px}
/* côté Phénix */
.carte{margin-top:18px;padding:16px;border-radius:16px;border:.5px solid var(--line);background:rgba(18,40,90,.7)}
.carte h3{margin:0 0 4px;font-family:'Italiana',serif;font-weight:400;font-size:20px}
.alerte{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--alerte);color:#ffd9d6;font-size:12px;line-height:1.5}
.ok{margin-top:10px;font-size:12px;color:var(--or2)}
.rangee{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dossier{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border:none;border-bottom:.5px solid var(--line);background:none;color:#fff;text-align:left}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:14px;background:var(--bar);border:.75px solid var(--or);color:var(--or2);font-size:13px;max-width:90vw}
@media (min-width:900px){ #app.large{max-width:980px} #app.large .page{padding-left:40px;padding-right:40px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    if (!silencieux) { try { localStorage.setItem('phx_client_email', email); } catch (e) {} }

  } catch (e) {
    console.warn(e);
    toast(e && e.code === 'auth/operation-not-allowed' ? 'La connexion par lien n’est pas encore activée dans Firebase.' : 'Le lien n’a pas pu partir. Réessayez dans un instant.');

      ${x.desc ? `<span style="font-size:11px;color:var(--t4);margin-top:2px">${esc(x.desc)}</span>` : ''}</span>
      <span style="font-size:10px;color:var(--t5)">${esc(dateFr(x.date))}</span>${IC.ext}</a>`).join('')
    : `<p style="padding:20px 0;margin:0;font-size:12px;color:var(--t4)">Rien dans « ${esc(S.cat)} » pour l’instant. Vos documents apparaîtront ici dès qu’ils seront prêts.</p>`;
  return `<main class="page">${enTete(d)}
    <section style="margin-top:46px">
      <div class="voile" style="display:inline-block;padding:6px 10px;margin-left:-10px"><h1 class="h1">Mes documents</h1><div style="margin-top:6px;font-size:13px;color:var(--t4)">Toujours la dernière version, au même endroit</div></div>
      <div role="tablist" aria-label="Catégories" class="puces" style="margin-top:72px">${CATS.map(c => `<button role="tab" class="puce" data-cat="${c}" aria-selected="${c === S.cat}">${c}</button>`).join('')}</div>
      <div class="liste" style="margin-top:52px">${rows}</div>
      <p style="margin:40px 0 0;font-size:11px;line-height:1.55;color:var(--t5)">Les plans du chantier (électricité, plomberie, cloisons) apparaîtront ici pendant la préparation du chantier.</p>
    </section></main>`;
}
// [Conversation 25/11/2026] échanges avec Phénix : phenix_client_dossiers/{id}/messages (messages de l'espace, et réponses de Phénix par mail ou SMS)
function ecouterMessages(pid, apres) {
  unsubs.push(onSnapshot(collection(db, COL_DOS, pid, 'messages'), s => { S.msgs = []; s.forEach(x => S.msgs.push(Object.assign({ _id: x.id }, x.data()))); apres(); },
    e => { console.warn('Échanges :', e && e.code); S.msgs = null; }));
}
async function envoyerAPhenix(texte) {
  const pid = String(S.acces && S.acces.projetId || ''); if (!pid || S.apercu) return false;
  const t = new Date().toISOString(), email = String(S.user && S.user.email || '').toLowerCase();
  try {
    await setDoc(doc(db, COL_DOS, pid, 'messages', 'c' + Date.now().toString(36)), { de: 'client', canal: 'espace', texte: String(texte).slice(0, 4000), t, par: email });
    addDoc(collection(db, 'phenix_notifs_client'), { pid, nom: (S.dossier && S.dossier.clientNom) || '', who: email, text: String(texte).slice(0, 200), t, lu: false }).catch(() => {});
    journal('message', 'échanges', 'Message à Phénix');
    return true;
  } catch (e) { console.warn(e); toast('Votre message n’est pas parti. Réessayez dans un instant.'); return false; }
}
function htmlFil(d) {
  const msgs = (S.msgs || []).map(m => ({ msg: true, de: m.de, canal: m.canal, date: String(m.t || '').slice(0, 10), t: m.t || '', texte: m.texte || '' }));
  const f = (d.fil || []).map(x => Object.assign({ t: (x.date || '') + 'T12:00' }, x)).concat(msgs).sort((a, b) => String(b.t || '').localeCompare(String(a.t || '')) || String(b.id || '').localeCompare(String(a.id || '')));
  const bulle = x => `<li><div class="pt" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 4 H15 V12 H8 L5 15 V12 H3 Z" fill="none" stroke="${x.de === 'phenix' ? '#d4b26a' : '#8aa5cc'}" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
      <div class="corps voile" style="${x.de === 'client' ? 'border:.5px solid var(--line2);' : 'border:.5px solid var(--or);'}border-radius:12px;padding:8px 10px"><div style="font-size:10px;color:var(--t5)">${esc(dateFr(x.date))} — ${x.de === 'phenix' ? '<span style="color:var(--or)">Phénix vous écrit</span>' : 'Vous avez écrit'}${x.canal === 'mail' ? ' · par mail' : x.canal === 'sms' ? ' · par SMS' : ''}</div>
      <p style="margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--t2);white-space:pre-wrap">${esc(x.texte)}</p></div></li>`;
  const lis = f.length ? f.map(x => x.msg ? bulle(x) : `<li><div class="pt" aria-hidden="true">${x.etape ? '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="#0b1f4a" stroke="#d4b26a"/><circle cx="9" cy="9" r="3" fill="#d4b26a"/></svg>' : '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="3.5" fill="#cfe2f6"/></svg>'}</div>
      <div class="corps voile"><div style="font-size:10px;color:var(--t5)">${esc(dateFr(x.date))} — ${x.etape ? '<span style="color:var(--or)">Étape franchie</span>' : esc(x.type || 'Note')}</div>
      <div style="margin-top:4px;${x.etape ? "font-family:'Italiana',serif;font-size:18px;line-height:1.1" : 'font-size:13px;font-weight:400'}">${esc(x.titre)}</div>
      ${x.texte ? `<p style="margin:3px 0 0;font-size:12px;line-height:1.5;color:var(--t3)">${esc(x.texte)}</p>` : ''}</div></li>`).join('')
    : '<li><div class="corps" style="font-size:12px;color:var(--t4)">Le fil se remplira au fil de votre projet.</div></li>';
  return `<main class="page">${enTete(d)}
    <section style="margin-top:46px">
      <div class="voile" style="display:inline-block;padding:6px 10px;margin-left:-10px"><h1 class="h1" style="font-size:40px">Le fil de votre projet</h1><div style="margin-top:6px;font-size:13px;color:var(--t4)">Tout ce qui s’est passé, du plus récent au plus ancien</div></div>
      ${pushPossible() && !pushActif() ? `<div class="voile" style="margin-top:28px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px;font-size:13px;color:var(--t2)">Être prévenu sur ce téléphone à chaque nouveauté de votre projet.</span><button class="btn-ligne" type="button" id="b-push">Activer les notifications</button></div>` : ''}
      ${S.apercu ? '' : `<form id="f-msg" class="voile" style="margin-top:28px;padding:10px 12px"><label class="lib" for="msg-tx" style="margin-top:0">Écrire à Phénix</label><textarea class="champ" id="msg-tx" rows="3" placeholder="Une question, une précision… Phénix vous répond ici."></textarea><button class="btn-ligne" type="submit" style="margin-top:10px">Envoyer</button></form>`}
      <ol class="fil">${lis}</ol></section></main>`;
}
function htmlNav(d) {
  const b = boutonOr(d), o = S.onglet;
  const t = (id, lib, ic) => `<button class="tab" data-ong="${id}" ${o === id ? 'aria-current="page"' : ''}>${ic}${lib}</button>`;
  const carnetTab = d.carnetValide && carnetDispo(d) ? `<button class="tab" data-carnet>${IC.car}Carnet</button>` : '';
  const gold = o !== 'avancement' && b && !d.pause ? htmlBoutonOr(b) : '';
  return `<nav class="nav" aria-label="Navigation">${gold}<div class="tabs">${t('avancement', 'Avancement', IC.av)}${t('documents', 'Documents', IC.doc)}${carnetTab}${t('fil', 'Le fil', IC.fil)}</div></nav>`;
}
function brancherClient(d) {
  document.querySelectorAll('[data-ong]').forEach(b => b.onclick = () => { S.onglet = b.dataset.ong; S.apercu ? rendreApercu() : rendreClient(); });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; S.apercu ? rendreApercu() : rendreClient(); });
  const dec = document.getElementById('dec'); if (dec) dec.onclick = () => S.apercu ? window.close() : signOut(auth);
  document.querySelectorAll('[data-carnet]').forEach(b => b.onclick = ouvrirCarnet);
  const bp = document.getElementById('b-push'); if (bp) bp.onclick = activerPush;
  const fm = document.getElementById('f-msg');
  if (fm) fm.onsubmit = async ev => { ev.preventDefault(); const ta = document.getElementById('msg-tx'), t = ta.value.trim(); if (!t) return; const b = fm.querySelector('button'); b.disabled = true;
    if (await envoyerAPhenix(t)) { ta.value = ''; toast('Message envoyé à Phénix. Vous aurez la réponse ici.'); } b.disabled = false; };
  if (S.ouvrirCarnetAuto && carnetDispo(d)) { S.ouvrirCarnetAuto = false; ouvrirCarnet(); }
}

// ═════════ CÔTÉ PHÉNIX : APERÇU SEULEMENT ═════════
// [Espace client 25/11/2026] Tout se gère dans Phénix Dossier (fiche projet › onglet Espace client).
// Le bouton « Voir comme le client » ouvre cette page avec ?apercu=<id du projet>.
function demarrerApercu() {
  let pid = ''; try { pid = new URLSearchParams(location.search).get('apercu') || ''; } catch (e) {}
  if (!pid) {
    $app().innerHTML = `<main class="page" style="padding-top:40px"><div class="marque">PHÉNIX</div>
      <h1 class="h1" style="margin-top:60px;font-size:36px">Côté Phénix</h1>
      <p style="font-size:13px;line-height:1.6;color:var(--t3);max-width:380px">L’espace client se gère dans <b style="font-weight:500">Phénix Dossier</b> : fiche du projet, onglet « Espace client ». Le bouton « Voir comme le client » ouvre ici l’aperçu du dossier.</p>
      <button class="btn-discret" id="dec">Se déconnecter</button></main>`;
    document.getElementById('dec').onclick = () => signOut(auth); return;
  }
  S.apercu = true; S.apercuPid = String(pid);
  try { if (new URLSearchParams(location.search).get('carnet') === '1') S.ouvrirCarnetAuto = true; } catch (e) {}
  ecouterMessages(String(pid), () => { if (S.onglet === 'fil') rendreApercu(); });
  unsubs.push(onSnapshot(doc(db, COL_DOS, String(pid)), s => { S.dossier = s.exists() ? s.data() : null; rendreApercu(); },
    e => { console.warn(e); toast('Aperçu indisponible (règles Firestore).'); }));
}
function rendreApercu() {
  const d = S.dossier;
  if (!d) { $app().innerHTML = `<main class="page" style="padding-top:40px"><div class="marque">PHÉNIX</div><h1 class="h1" style="margin-top:60px;font-size:34px">Rien à montrer</h1><p style="font-size:13px;color:var(--t3)">Ce dossier n’a pas encore d’espace client. Ouvrez l’accès depuis Phénix Dossier.</p></main>`; return; }
  $app().className = '';
  const ong = S.onglet;
  $app().innerHTML = `<div style="position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--bar);border-bottom:.75px solid var(--or);font-size:12px;color:var(--or2)">Aperçu : ce que voit le client<button class="btn-discret" id="fin-apercu" style="min-height:32px;font-size:12px">Fermer</button></div>`
    + (ong === 'documents' ? htmlDocuments(d) : ong === 'fil' ? htmlFil(d) : htmlAvancement(d)) + htmlNav(d);
  brancherClient(d);
  document.getElementById('fin-apercu').onclick = () => { window.close(); };
}

// ── démarrage ──
retourLien();
</script>
</body>
</html>
