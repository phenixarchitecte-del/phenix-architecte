<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phénix-Architecture — Suivi collaborateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--bg2:#E4ECF3;--card:#fff;--navy:#0F1E3D;--blue:#4A9CC7;
  --ink:#1B2D5B;--mute:#5E7A92;--border:#D4E0ED;
  --danger:#B83232;--danger-bg:#FDE8E8;
  --warn:#9A6000;--warn-bg:#FFF3CD;
  --ok:#2D6A4F;--ok-bg:#D8F3DC;
  --info:#185FA5;--info-bg:#E3EFF9;
  --r:10px;--r-lg:14px;
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0}

/* ── LOGIN ── */
#login-overlay{display:flex;position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0A1422,#1B2D5B,#2A5298);align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:18px;padding:36px 30px;max-width:360px;width:100%;text-align:center}
.login-logo{font-family:'DM Serif Display',Georgia,serif;font-size:32px;color:#fff;margin-bottom:3px}
.login-logo span{color:#7DC6E8}
.login-sub{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase;margin-bottom:28px}
.login-input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:9px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.93);font-size:14px;outline:none;font-family:inherit}
.login-btn{width:100%;padding:13px;border:none;border-radius:9px;background:linear-gradient(135deg,#4A9CC7,#2A5298);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.login-err{color:#FFB4A8;font-size:12.5px;margin-top:12px;min-height:18px}

/* ── TOPBAR ── */
.topbar{background:var(--navy);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{font-family:'DM Serif Display',Georgia,serif;font-size:20px;color:#fff;letter-spacing:.02em}
.topbar-brand span{color:#7DC6E8}
.topbar-right{display:flex;align-items:center;gap:12px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5EEE90;margin-right:5px}
.sync-label{font-size:12px;color:rgba(255,255,255,.6)}
.user-chip{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:12px;color:#fff;font-weight:500}
.logout-btn{background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;color:rgba(255,255,255,.7);cursor:pointer;font-size:12px;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,.1)}

/* ── MAIN LAYOUT ── */
.main{max-width:860px;margin:0 auto;padding:20px 16px 60px}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:12px 14px;text-align:center}
.stat-n{font-size:26px;font-weight:700;line-height:1}
.stat-l{font-size:11px;color:var(--mute);margin-top:4px}
.n-danger{color:var(--danger)}.n-warn{color:var(--warn)}.n-ok{color:var(--ok)}.n-info{color:var(--info)}

/* ── FILTRES ── */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fil{font-size:12px;padding:5px 13px;border-radius:99px;border:.5px solid var(--border);background:var(--card);cursor:pointer;font-weight:500;color:var(--ink);font-family:inherit;transition:all .15s}
.fil:hover{border-color:var(--blue);color:var(--blue)}
.fil.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.fil-mine{border-color:var(--blue);color:var(--blue)}
.fil-mine.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── SECTIONS ── */
.section-sep{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.section-sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── CARDS ── */
.card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 12px rgba(15,30,61,.08)}
.card.is-danger{border-color:#E9A0A0}
.card.is-muted{opacity:.72}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-left{flex:1;min-width:0}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;letter-spacing:.05em;margin-bottom:6px}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-neutral{background:var(--bg2);color:var(--mute)}
.card-title{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--mute);margin-top:2px}
.card-due{text-align:right;flex-shrink:0}
.due-label{font-size:10px;color:var(--mute);white-space:nowrap}
.due-date{font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap}
.due-date.late{color:var(--danger)}
.due-date.soon{color:var(--warn)}

/* ── PHASE BAR ── */
.phase-bar{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.phase-step{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg2);color:var(--mute);font-weight:600}
.phase-step.current{background:var(--blue);color:#fff}
.phase-step.done{background:var(--ok-bg);color:var(--ok)}

/* ── TÂCHES ── */
.tasks-panel{background:var(--bg);border-radius:8px;padding:10px 12px}
.tasks-label{font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.task-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:.5px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-cb{width:16px;height:16px;accent-color:var(--navy);cursor:pointer;margin-top:2px;flex-shrink:0}
.task-body{flex:1;min-width:0}
.task-titre{font-size:13px;color:var(--ink);line-height:1.3}
.task-titre.done{color:var(--mute);text-decoration:line-through}
.task-meta{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.task-prio{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600}
.task-prio.urgent{background:var(--danger-bg);color:var(--danger)}
.task-prio.haute{background:var(--warn-bg);color:var(--warn)}
.task-prio.normale{background:var(--bg2);color:var(--mute)}
.task-deadline{font-size:10px;color:var(--mute)}
.task-deadline.late{color:var(--danger);font-weight:600}
.task-assigne{font-size:10px;color:var(--info);background:var(--info-bg);padding:1px 7px;border-radius:99px}
.no-tasks{font-size:12px;color:var(--mute);font-style:italic;padding:4px 0}

/* ── AVANCEMENT ── */
.progress-wrap{margin-top:8px;margin-bottom:2px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:3px}
.progress-bar{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}

/* ── CHECKLIST DE PROCESS ── */
.process-panel{background:#fff;border:.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px}
.process-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;cursor:pointer;user-select:none}
.process-title{font-size:10px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.process-title i{font-size:13px}
.process-pct{font-size:11px;font-weight:700;color:var(--blue)}
.process-overall-bar{height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.process-overall-fill{height:100%;background:linear-gradient(90deg,#4A9CC7,#2D6A4F);border-radius:99px;transition:width .3s}
.process-fiches{display:none}
.process-fiches.open{display:block}
.process-fiche{border-top:.5px solid var(--border);padding:7px 0}
.process-fiche:first-child{border-top:none}
.process-fiche-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.process-fiche-chevron{font-size:11px;color:var(--mute);transition:transform .15s;flex-shrink:0;width:12px}
.process-fiche-chevron.open{transform:rotate(90deg)}
.process-fiche-num{font-size:10px;font-weight:700;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px;flex-shrink:0}
.process-fiche-num.complete{background:var(--ok)}
.process-fiche-num.current{background:var(--blue)}
.process-fiche-titre{font-size:12.5px;font-weight:600;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.process-fiche-count{font-size:10.5px;color:var(--mute);flex-shrink:0}
.process-fiche-steps{display:none;padding:6px 0 2px 20px}
.process-fiche-steps.open{display:block}
.process-step-row{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.process-step-row input{width:14px;height:14px;accent-color:var(--ok);cursor:pointer;margin-top:2px;flex-shrink:0}
.process-step-txt{font-size:12px;color:var(--ink);line-height:1.4}
.process-step-txt.done{color:var(--mute);text-decoration:line-through}
.process-phase-empty{font-size:11.5px;color:var(--mute);font-style:italic;padding:2px 0}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--mute);font-size:14px}
.empty i{font-size:36px;display:block;margin-bottom:8px;opacity:.4}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:600px){.card-top{flex-direction:column}.card-due{text-align:left}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">Phénix<span>-Architecture</span></div>
    <div class="login-sub">Espace collaborateur</div>
    <input id="pl-email" type="email" autocomplete="username" placeholder="E-mail" class="login-input">
    <input id="pl-pwd" type="password" autocomplete="current-password" placeholder="Mot de passe" class="login-input" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="pl-btn" onclick="doLogin()">Se connecter</button>
    <div class="login-err" id="pl-err"></div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">Phénix<span>-Architecture</span> &nbsp;<span style="font-family:'DM Sans',sans-serif;font-size:12px;color:rgba(255,255,255,.5);font-weight:400">Suivi collaborateur</span></div>
  <div class="topbar-right">
    <span><span class="sync-dot" id="syncDot"></span><span class="sync-label" id="syncLabel">Connexion…</span></span>
    <span class="user-chip" id="userChip">—</span>
    <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout" style="font-size:13px"></i></button>
  </div>
</div>

<div class="main" id="main-content" style="display:none">

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card"><div class="stat-n" id="st-actifs">—</div><div class="stat-l">Dossiers actifs</div></div>
    <div class="stat-card"><div class="stat-n n-danger" id="st-retard">—</div><div class="stat-l">En retard</div></div>
    <div class="stat-card"><div class="stat-n n-warn" id="st-todo">—</div><div class="stat-l">Tâches à faire</div></div>
    <div class="stat-card"><div class="stat-n n-info" id="st-attente">—</div><div class="stat-l">En attente client</div></div>
  </div>

  <!-- FILTRES -->
  <div class="filters">
    <button class="fil active" data-filter="all" onclick="setFilter('all',this)">Tous</button>
    <button class="fil" data-filter="ESQ,APS,APD" onclick="setFilter('ESQ,APS,APD',this)">Avant-Projet</button>
    <button class="fil" data-filter="PC" onclick="setFilter('PC',this)">Permis de construire</button>
    <button class="fil" data-filter="DCE,ACT" onclick="setFilter('DCE,ACT',this)">DCE / Contrats</button>
    <button class="fil" data-filter="DET,AOR" onclick="setFilter('DET,AOR',this)">Chantier</button>
    <button class="fil fil-mine" data-filter="mine" onclick="setFilter('mine',this)">⚡ Mes tâches</button>
  </div>

  <!-- LISTE -->
  <div id="cards-container"></div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }   from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc }
                           from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                           from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey:            "AIzaSyCjNKNvS6p3nqE6-_Gw9I397ZtXm2FG1ew",
  authDomain:        "phenix-architecte-9151b.firebaseapp.com",
  projectId:         "phenix-architecte-9151b",
  storageBucket:     "phenix-architecte-9151b.firebasestorage.app",
  messagingSenderId: "811231684720",
  appId:             "1:811231684720:web:413fa324ae43c07607acb5"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ─── état global ───────────────────────────────────────────────
let projets  = [];
let taches   = [];
let processSteps = [];  // docs de phenix_process_steps (checklist du livret, par projet)
let me       = '';   // email du collaborateur connecté
let curFilter = 'all';
let unsubProjets = null;
let unsubTaches  = null;
let unsubProcess = null;
let expandedFiches = new Set(); // clés "projetId-ficheNum" dépliées dans l'UI
let expandedProcessPanel = new Set(); // clés projetId dont le panneau checklist est ouvert
let provisioned = new Set(); // projetId déjà vérifiés pour la génération des étapes manquantes

// ─── phases ────────────────────────────────────────────────────
const PHASES = ['ESQ','APS','APD','PC','DCE','ACT','DET','AOR'];
const PHASE_LABELS = {
  ESQ:'Esquisse',APS:'Avant-Projet Sommaire',APD:'Avant-Projet Définitif',
  PC:'Permis de construire',DCE:'DCE',ACT:'Assistance Contrats',
  DET:'Direction travaux',AOR:'Réception travaux'
};
const PHASE_GROUP = {
  ESQ:'Avant-Projet',APS:'Avant-Projet',APD:'Avant-Projet',
  PC:'Permis de construire',DCE:'DCE / Contrats',ACT:'DCE / Contrats',
  DET:'Chantier',AOR:'Chantier'
};

// ─── référentiel du process Phénix (Livret de process) ──────────
// Chaque fiche du livret d'intégration, rattachée à la phase du projet
// correspondante. Modifiable ici si le livret évolue — les étapes déjà
// cochées sur les dossiers en cours sont conservées (voir ensureProcessSteps).
const PROCESS_FICHES = [
  { num:1, titre:"La rencontre client", phase:'ESQ', steps:[
    "Écouter la demande du client et reformuler pour vérifier qu'elle est bien comprise.",
    "Identifier les raisons réelles de la demande, au-delà de ce qui est énoncé au premier abord.",
    "En rénovation, effectuer un audit rapide du bâti concerné (état général, contraintes visibles, points d'attention).",
    "Évaluer objectivement si notre intervention est nécessaire et adaptée à la situation.",
    "Donner son avis de professionnel, même s'il diverge de la vision initiale du client.",
  ]},
  { num:2, titre:"Le devis", phase:'ESQ', steps:[
    "Rédiger le devis sur la base des éléments recueillis pendant la rencontre client.",
    "Joindre des instructions claires pour la signature (comment signer, ce que cela engage, les étapes suivantes).",
    "Expliquer le contexte dans lequel le client va signer, pour qu'il n'y ait aucune ambiguïté sur ce qu'il valide.",
    "Envoyer le tout avec un ton rassurant et accompagnant, jamais commercial ou pressant.",
  ]},
  { num:3, titre:"Le relevé", phase:'ESQ', steps:[
    "Se rendre sur site dans les conditions convenues avec le client.",
    "Préparer et vérifier le matériel avant le départ (charge des batteries, piles de rechange, carte mémoire vidée).",
    "Prendre les côtes rapidement, avec précision, sans rien négliger.",
    "Adopter un code couleur pendant le relevé pour retrouver facilement chaque côte par la suite.",
    "Photographier abondamment l'ensemble du bien, y compris les éléments particuliers ou singuliers.",
    "Compléter par des vidéos si certains éléments sont difficiles à saisir par la photo seule.",
  ]},
  { num:4, titre:"Le plan préliminaire", phase:'APS', steps:[
    "Regarder l'emplacement du projet sur Géoportail (contexte satellite et cadastral).",
    "Aller sur Géoportail de l'urbanisme, identifier la parcelle et lire l'intégralité du règlement associé.",
    "Construire un plan d'aménagement basique, pensé pour être compris rapidement.",
    "Annoter chaque pièce avec sa fonction et sa surface.",
    "Appliquer un code couleur pour identifier clairement l'usage de chaque pièce.",
    "Faire figurer les côtes principales, suffisantes pour saisir l'empattement des pièces.",
    "Produire des images de synthèse associées au plan, extrapolées selon le même principe.",
    "Utiliser ces images pour montrer l'aménagement et engager la discussion sur les finitions et matériaux.",
  ]},
  { num:5, titre:"Rencontre client — plans préliminaires", phase:'APS', steps:[
    "Présenter simplement le plan, sans surcharger d'explications à ce stade.",
    "Présenter ensuite les images de synthèse, sans entrer dans le détail.",
    "Laisser au client le temps d'intégrer les informations et de se faire son propre avis.",
    "Confronter le plan extrapolé à l'idée que le client avait initialement en tête.",
    "Si le plan s'en écarte, expliquer l'intérêt de la démarche et appuyer la démonstration si besoin.",
    "Faire émerger un troisième plan qui correspond réellement au client.",
    "Annoter en direct, sur la tablette, les modifications demandées par le client.",
    "Aborder le règlement de façon décontractée, en proposant plusieurs moyens de paiement.",
  ]},
  { num:6, titre:"Reprise du plan préliminaire", phase:'APD', steps:[
    "Reprendre les notes dessinées et annotées sur tablette lors du rendez-vous précédent.",
    "Reprendre le plan point par point, en traitant tous les sujets identifiés avec le client.",
    "Une fois le travail terminé, organiser une nouvelle réunion avec le client pour lui présenter la reprise.",
    "À l'issue de cette réunion, faire valider le plan comme plan définitif.",
    "Prévenir le client que le projet entre en phase de chiffrage.",
  ]},
  { num:7, titre:"Le chiffrage", phase:'APD', steps:[
    "Dans Phénix Suite, se rendre dans l'onglet Chiffrage et sélectionner le type de projet.",
    "En rénovation, importer directement le PDF du plan dans le logiciel.",
    "Rédiger une description claire des travaux.",
    "Laisser le logiciel créer le chantier avec les lots et lignes correspondants.",
    "Inspecter une à une les lignes proposées par l'IA pour les corriger si besoin.",
    "Générer le devis client PDF une fois le chiffrage réalisé et contrôlé.",
    "Transférer le chiffrage vers la plateforme d'appel d'offres.",
    "Faire valider le chiffrage — lots et marge — par un supérieur compétent.",
    "Prendre rendez-vous avec le client pour valider le chiffrage et les plans.",
  ]},
  { num:8, titre:"Rendez-vous chiffrage", phase:'APD', steps:[
    "Expliquer chaque lot avec précision.",
    "Faire comprendre clairement au client ce qui est compris, et ce qui ne l'est pas, dans le chiffrage.",
    "Rester à l'écoute et dans l'empathie tout au long de l'échange.",
    "Expliquer au client le déclenchement de la mission de déclaration administrative.",
  ]},
  { num:9, titre:"Déclaration administrative — principes", phase:'PC', steps:[
    "Identifier le type de dossier à monter (moteur de recherche, service-public.fr, ou mairie).",
    "Télécharger le CERFA correspondant sur un site du gouvernement.",
    "Ne fournir dans le dossier que les informations demandées — rien de plus, rien de moins.",
  ]},
  { num:10, titre:"Constitution du dossier graphique", phase:'PC', steps:[
    "Page de garde (projet, client, adresse, nom du dossier, liste des pages).",
    "Plan de situation (IGN dézoomé, vue satellite, extrait cadastral).",
    "Le plan de masse.",
    "La coupe du terrain.",
    "La notice descriptive.",
    "Les façades.",
    "L'insertion (projection photoréaliste).",
    "La photo proche.",
    "Les photos lointaines.",
    "Remplir le CERFA.",
  ]},
  { num:11, titre:"Préparation de chantier", phase:'DCE', steps:[
    "Faire signer le contrat d'engagement par chaque artisan positionné.",
    "Rédiger le CCTP à partir du DPGF produit lors du chiffrage.",
    "Faire signer le CCTP par chaque artisan concerné par son lot.",
    "Produire les plans de DCE, idéalement un jeu par lot.",
    "S'acquitter des obligations légales de préparation de chantier.",
    "Rassembler les contrats d'engagement signés pour en extraire les dates d'intervention.",
    "Construire le planning de chantier à partir de ces dates (Phénix Planning).",
  ]},
];
// Liste à plat, avec une clé stable par étape (utilisée comme identifiant Firestore)
const PROCESS_STEPS_FLAT = [];
PROCESS_FICHES.forEach(f => {
  f.steps.forEach((texte, i) => {
    PROCESS_STEPS_FLAT.push({ stepKey:`f${f.num}-${i+1}`, ficheNum:f.num, ficheTitre:f.titre, phase:f.phase, texte });
  });
});

// ─── auth ───────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  const ov = document.getElementById('login-overlay');
  if (user) {
    me = (user.email || '').toLowerCase();
    ov.style.display = 'none';
    document.getElementById('main-content').style.display = '';
    document.getElementById('userChip').textContent = me.split('@')[0];
    startListeners();
  } else {
    ov.style.display = 'flex';
    document.getElementById('main-content').style.display = 'none';
    if (unsubProjets) { unsubProjets(); unsubProjets = null; }
    if (unsubTaches)  { unsubTaches();  unsubTaches  = null; }
    if (unsubProcess) { unsubProcess(); unsubProcess = null; }
  }
});

window.doLogin = function() {
  const email = document.getElementById('pl-email').value.trim();
  const pwd   = document.getElementById('pl-pwd').value;
  const btn   = document.getElementById('pl-btn');
  const err   = document.getElementById('pl-err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Connexion…';
  signInWithEmailAndPassword(auth, email, pwd)
    .catch(e => {
      const c = e.code || '';
      err.textContent =
        c.includes('invalid-credential') || c.includes('wrong-password') ? 'Identifiants incorrects.' :
        c.includes('user-not-found') ? 'Compte introuvable.' :
        c.includes('too-many-requests') ? 'Trop de tentatives.' :
        ('Erreur : ' + (c || e.message));
    })
    .finally(() => { btn.disabled = false; btn.textContent = 'Se connecter'; });
};

window.doLogout = function() {
  signOut(auth);
};

// ─── listeners Firebase ─────────────────────────────────────────
function startListeners() {
  setSyncStatus('sync','Chargement…');

  unsubProjets = onSnapshot(collection(db,'phenix_projets'), snap => {
    projets = snap.docs.map(d => d.data());
    ensureProcessSteps();
    render();
  });
  unsubTaches = onSnapshot(collection(db,'phenix_taches'), snap => {
    taches = snap.docs.map(d => d.data());
    render();
    setSyncStatus('ok','En direct');
  });
  unsubProcess = onSnapshot(collection(db,'phenix_process_steps'), snap => {
    processSteps = snap.docs.map(d => d.data());
    render();
  });
}

// ─── checklist de process : génération des étapes manquantes ────
// Pour chaque dossier actif, crée dans Firestore les étapes du livret qui
// n'existent pas encore pour ce projet — sans jamais toucher à celles déjà
// présentes (donc sans jamais effacer une case déjà cochée).
async function ensureProcessSteps() {
  const actifs = projets.filter(p => p.statut !== 'cloture' && p.statut !== 'archive');
  for (const p of actifs) {
    const pid = String(p.id);
    if (provisioned.has(pid)) continue;
    provisioned.add(pid);
    const existantes = new Set(
      processSteps.filter(s => String(s.projetId) === pid).map(s => s.stepKey)
    );
    const manquantes = PROCESS_STEPS_FLAT.filter(s => !existantes.has(s.stepKey));
    if (!manquantes.length) continue;
    manquantes.forEach(s => {
      const docId = pid + '__' + s.stepKey;
      setDoc(doc(db,'phenix_process_steps', docId), {
        id: docId, projetId: p.id, stepKey: s.stepKey,
        ficheNum: s.ficheNum, ficheTitre: s.ficheTitre, phase: s.phase,
        texte: s.texte, done: false
      }).catch(()=>{ provisioned.delete(pid); });
    });
  }
}

// ─── filtres ────────────────────────────────────────────────────
window.setFilter = function(f, btn) {
  curFilter = f;
  document.querySelectorAll('.fil').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
};

// ─── toggle tâche ───────────────────────────────────────────────
window.toggleTache = async function(id, checked) {
  const newStatut = checked ? 'done' : 'todo';
  try {
    await updateDoc(doc(db,'phenix_taches', String(id)), { statut: newStatut, updatedAt: new Date().toISOString() });
    toast(checked ? '✅ Tâche marquée achevée' : '↩ Tâche remise à faire');
  } catch(e) { toast('⚠️ Erreur : ' + e.message); }
};

// ─── toggle étape de process (checklist du livret) ───────────────
window.toggleProcessStep = async function(docId, checked) {
  try {
    await updateDoc(doc(db,'phenix_process_steps', docId), {
      done: checked,
      doneAt: checked ? new Date().toISOString() : null,
      doneBy: checked ? me : null
    });
  } catch(e) { toast('⚠️ Erreur : ' + e.message); }
};

window.toggleFicheOpen = function(key) {
  if (expandedFiches.has(key)) expandedFiches.delete(key); else expandedFiches.add(key);
  render();
};
window.toggleProcessPanel = function(pid) {
  if (expandedProcessPanel.has(pid)) expandedProcessPanel.delete(pid); else expandedProcessPanel.add(pid);
  render();
};

// ─── utilitaires ────────────────────────────────────────────────
function isoToDate(s) { return s ? new Date(s.includes('T') ? s : s+'T00:00:00') : null; }
function fmtDate(s)   {
  const d = isoToDate(s); if (!d) return null;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function isLate(s)    { const d=isoToDate(s); return d && d < new Date() && d.toDateString() !== new Date().toDateString(); }
function isSoon(s)    {
  const d=isoToDate(s); if(!d) return false;
  const diff=(d - new Date())/(1000*60*60*24);
  return diff>=0 && diff<=5;
}

function tachesProjet(projetId) {
  return taches.filter(t => String(t.projetId) === String(projetId) && t.statut !== 'done');
}
function tachesProjetAll(projetId) {
  return taches.filter(t => String(t.projetId) === String(projetId));
}

function projetHasRetard(proj) {
  return tachesProjet(proj.id).some(t => isLate(t.dateLivraison));
}

// ─── RENDER ─────────────────────────────────────────────────────
function render() {
  const today   = new Date();
  const actifs  = projets.filter(p => p.statut !== 'cloture' && p.statut !== 'archive');

  // stats
  document.getElementById('st-actifs').textContent  = actifs.length;
  document.getElementById('st-retard').textContent  = actifs.filter(projetHasRetard).length;
  document.getElementById('st-todo').textContent    = taches.filter(t => t.statut === 'todo' || t.statut === 'doing').length;
  document.getElementById('st-attente').textContent = actifs.filter(p => p.statut === 'etude' || p.statut === 'demarrage').length;

  // filtrer les projets
  let filtered = actifs;
  if (curFilter === 'mine') {
    const mesIds = new Set(taches.filter(t => (t.assigneA||'') === me).map(t => String(t.projetId)));
    filtered = actifs.filter(p => mesIds.has(String(p.id)));
  } else if (curFilter !== 'all') {
    const phases = curFilter.split(',');
    filtered = actifs.filter(p => phases.includes(p.phase));
  }

  // trier : en retard → actif avec tâches → en attente
  filtered.sort((a,b) => {
    const ar = projetHasRetard(a) ? 0 : tachesProjet(a.id).length > 0 ? 1 : 2;
    const br = projetHasRetard(b) ? 0 : tachesProjet(b.id).length > 0 ? 1 : 2;
    return ar - br;
  });

  const cont = document.getElementById('cards-container');

  if (!filtered.length) {
    cont.innerHTML = `<div class="empty"><i class="ti ti-folder-off"></i>Aucun dossier à afficher pour ce filtre.</div>`;
    return;
  }

  // groupes
  let html = '';
  const groupes = [
    { key:'retard', label:'🔴 En retard',          test: p => projetHasRetard(p) },
    { key:'todo',   label:'🟡 Tâches à produire',   test: p => !projetHasRetard(p) && tachesProjet(p.id).length > 0 },
    { key:'wait',   label:'🔵 En attente / instruction', test: p => !projetHasRetard(p) && tachesProjet(p.id).length === 0 },
  ];

  groupes.forEach(g => {
    const group = filtered.filter(g.test);
    if (!group.length) return;
    html += `<div class="section-sep">${g.label}</div>`;
    group.forEach(p => { html += cardHtml(p, g.key); });
  });

  cont.innerHTML = html;
}

function cardHtml(p, groupe) {
  const tasks     = tachesProjetAll(p.id);
  const tasksTodo = tasks.filter(t => t.statut !== 'done');
  const hasRetard = projetHasRetard(p);

  // badge principal
  let badge = '', badgeCls = '';
  if (hasRetard)                        { badge='EN RETARD';         badgeCls='badge-danger'; }
  else if (tasksTodo.length > 0)        { badge='À PRODUIRE';        badgeCls='badge-warn'; }
  else if (tasks.length > 0)            { badge='TÂCHES ACHEVÉES';   badgeCls='badge-ok'; }
  else                                  { badge='EN ATTENTE';        badgeCls='badge-info'; }

  // date la plus proche parmi les tâches
  const deadlines = tasksTodo.map(t => t.dateLivraison).filter(Boolean).sort();
  const dueDate   = deadlines[0] || null;
  const dueLabel  = dueDate ? fmtDate(dueDate) : null;
  const dueCls    = dueDate && isLate(dueDate) ? 'late' : dueDate && isSoon(dueDate) ? 'soon' : '';

  // phase bar
  const ci = PHASES.indexOf(p.phase);
  const phaseBar = PHASES.map((ph,i) => {
    const cls = i < ci ? 'done' : i === ci ? 'current' : '';
    return `<span class="phase-step ${cls}" title="${PHASE_LABELS[ph]||ph}">${ph}</span>`;
  }).join('');

  // tâches
  let tasksHtml = '';
  if (tasks.length === 0) {
    tasksHtml = `<div class="no-tasks">Aucune tâche enregistrée pour ce dossier</div>`;
  } else {
    // priorité : urgent > haute > normale, puis todo avant done
    const sorted = [...tasks].sort((a,b) => {
      const pmap = {urgent:0,haute:1,normale:2};
      const ps = (pmap[a.priorite]||2) - (pmap[b.priorite]||2);
      if (ps !== 0) return ps;
      if (a.statut==='done' && b.statut!=='done') return 1;
      if (b.statut==='done' && a.statut!=='done') return -1;
      return 0;
    });
    sorted.forEach(t => {
      const isDone     = t.statut === 'done';
      const tlabel     = isDone ? `<span class="task-titre done">${esc(t.titre)}</span>` : `<span class="task-titre">${esc(t.titre)}</span>`;
      const prioCls    = t.priorite || 'normale';
      const prioLabel  = prioCls === 'urgent' ? '🔴 Urgent' : prioCls === 'haute' ? '🟡 Haute' : '';
      const dlabel     = t.dateLivraison ? `<span class="task-deadline ${isLate(t.dateLivraison)&&!isDone?'late':''}">📅 ${fmtDate(t.dateLivraison)}</span>` : '';
      const assigneeHtml = t.assigneA ? `<span class="task-assigne">${esc(t.assigneA.split('@')[0])}</span>` : '';
      const mine       = (t.assigneA||'').toLowerCase() === me;
      const border     = mine ? 'border-left:2.5px solid var(--blue);padding-left:8px;margin-left:-8px' : '';
      tasksHtml += `
        <div class="task-row" style="${border}">
          <input class="task-cb" type="checkbox" ${isDone?'checked':''} onchange="toggleTache('${esc(String(t.id))}',this.checked)">
          <div class="task-body">
            ${tlabel}
            <div class="task-meta">
              ${prioLabel ? `<span class="task-prio ${prioCls}">${prioLabel}</span>` : ''}
              ${dlabel}
              ${assigneeHtml}
            </div>
          </div>
        </div>`;
    });
  }

  const avancement = parseInt(p.avancement) || 0;
  const cardCls    = hasRetard ? 'card is-danger' : groupe === 'wait' ? 'card is-muted' : 'card';

  return `
  <div class="${cardCls}">
    <div class="card-top">
      <div class="card-left">
        <span class="badge ${badgeCls}">${badge}</span>
        <div class="card-title">${esc(p.nom||p.ref||'—')}</div>
        <div class="card-sub">${esc(p.client||'—')}${p.adresse ? ' · '+esc(p.adresse) : ''}</div>
      </div>
      ${dueLabel ? `<div class="card-due"><div class="due-label">Livraison</div><div class="due-date ${dueCls}">${dueLabel}</div></div>` : ''}
    </div>

    <div class="phase-bar">${phaseBar}</div>

    <div class="progress-wrap">
      <div class="progress-label"><span>Avancement</span><span>${avancement} %</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${avancement}%"></div></div>
    </div>

    ${processChecklistHtml(p)}

    <div class="tasks-panel" style="margin-top:10px">
      <div class="tasks-label">Tâches <span style="font-weight:400;color:var(--mute)">(${tasksTodo.length} restante${tasksTodo.length>1?'s':''})</span></div>
      ${tasksHtml}
    </div>
  </div>`;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── checklist de process (livret Phénix) ────────────────────────
function processChecklistHtml(p) {
  const pid = String(p.id);
  const steps = processSteps.filter(s => String(s.projetId) === pid);
  if (!steps.length) return ''; // pas encore provisionné (ou dossier tout juste créé)

  const total = steps.length;
  const done  = steps.filter(s => s.done).length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  const panelOpen = expandedProcessPanel.has(pid);

  const fichesHtml = PROCESS_FICHES.map(f => {
    const fSteps = steps.filter(s => s.ficheNum === f.num).sort((a,b)=>a.stepKey.localeCompare(b.stepKey,undefined,{numeric:true}));
    if (!fSteps.length) return '';
    const fDone = fSteps.filter(s=>s.done).length;
    const fTotal = fSteps.length;
    const complete = fDone === fTotal;
    const isCurrentPhase = f.phase === p.phase;
    const key = pid + '-' + f.num;
    const open = expandedFiches.has(key);
    const numCls = complete ? 'complete' : (isCurrentPhase ? 'current' : '');
    const rows = fSteps.map(s => `
      <div class="process-step-row">
        <input type="checkbox" ${s.done?'checked':''} onchange="toggleProcessStep('${esc(s.id)}',this.checked)">
        <span class="process-step-txt ${s.done?'done':''}">${esc(s.texte)}</span>
      </div>`).join('');
    return `
      <div class="process-fiche">
        <div class="process-fiche-head" onclick="toggleFicheOpen('${key}')">
          <span class="process-fiche-chevron ${open?'open':''}"><i class="ti ti-chevron-right"></i></span>
          <span class="process-fiche-num ${numCls}">F${f.num}</span>
          <span class="process-fiche-titre">${esc(f.titre)}</span>
          <span class="process-fiche-count">${fDone}/${fTotal}</span>
        </div>
        <div class="process-fiche-steps ${open?'open':''}">${rows}</div>
      </div>`;
  }).join('');

  return `
    <div class="process-panel">
      <div class="process-head" onclick="toggleProcessPanel('${pid}')">
        <span class="process-title"><i class="ti ${panelOpen?'ti-chevron-down':'ti-chevron-right'}"></i><i class="ti ti-list-check"></i> Checklist de process (livret)</span>
        <span class="process-pct">${done}/${total} · ${pct}%</span>
      </div>
      <div class="process-overall-bar"><div class="process-overall-fill" style="width:${pct}%"></div></div>
      <div class="process-fiches ${panelOpen?'open':''}">${fichesHtml}</div>
    </div>`;
}

// ─── sync status ────────────────────────────────────────────────
function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.style.background = state==='ok' ? '#5EEE90' : state==='sync' ? '#F0C040' : '#FF7070';
  lbl.textContent = label;
}

// ─── toast ──────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
window.toast = toast;
</script>
