 28/11/2026 — [Prospection] Création. Salle « Prospection » des bureaux de la Synthèse 3D (prospection des entreprises par mail).
   • Réservé à l'administrateur (contact@phenixarchitecte.fr). Restriction d'affichage : la règle Firestore de
     phenix_prospection (lecture et écriture administrateur seulement) protège réellement les données.
   • Collection phenix_prospection : une fiche par entreprise (nom, contact, e-mail, cible, commune, étape,
     mails[] datés, prochaine relance, rendez-vous, demande « ne plus contacter » avec sa preuve).
   • Écran : « N mails envoyés à N entreprises », barre de répartition + six étapes cliquables (filtre),
     cartes « À faire », tableau en colonnes par étape, fiche de l'entreprise avec ses mails et ses actions.
   • Bouclier : une entreprise « Ne plus contacter » (ou son domaine mail) est refusée à l'import et sort dans
     « Liste à exclure » (CSV à donner à Sellbird avant chaque campagne). Sa fiche ne peut pas être supprimée (preuve).
   • La Synthèse 3D lit la même collection : avenue « Prospection par mail » (mails = véhicules, réponses = piétons).

<script>
(function(){
'use strict';
var ADMIN = 'contact@phenixarchitecte.fr';
var ETAPES = [
  { id:'envoye',  s:'○', t:'Mail envoyé',       aide:'En attente de réponse' },
  { id:'relance', s:'◐', t:'Relancé',           aide:'Relance partie, en attente' },
  { id:'repondu', s:'●', t:'A répondu',         aide:'À traiter en priorité', chaud:true },
  { id:'rdv',     s:'★', t:'Rendez-vous',       aide:'Entre au district Devis' },
  { id:'clos',    s:'–', t:'Pas intéressé',     aide:'Pas de projet ou sans réponse' },
  { id:'stop',    s:'⊘', t:'Ne plus contacter', aide:'Retirées de toute campagne' }
];
var TEINTE = { envoye:['#24426b','#f2f6fb'], relance:['#3a6699','#f2f6fb'], repondu:['#7fa9dc','#0a1424'], rdv:['#e3bc66','#1a1406'], clos:['#1a2c47','#b9c9dd'], stop:['#0e1b30','#9fb3cc'] };
var CIBLES = { commerce:'Commerce', sante:'Santé', agricole:'Agricole', pme:'Artisans et PME', autre:'Autre' };
var DELAI_RELANCE = 7;

var S = { user:'', liste:[], focus:null, sel:null, recherche:'', cible:'' };
var $ = function(id){ return document.getElementById(id); };
function esc(x){ return String(x == null ? '' : x).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function auj(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function plusJours(iso, n){ var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
var MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function court(iso){ if (!iso) return ''; var d = new Date(String(iso).slice(0,10) + 'T12:00:00'); if (isNaN(d)) return ''; return d.getDate() + ' ' + MOIS[d.getMonth()]; }
function heure(iso){ if (!iso || String(iso).length < 16) return ''; return String(iso).slice(11,16).replace(':', ' h '); }
function domaine(email){ var m = String(email || '').toLowerCase().match(/@([^@\s>]+)$/); return m ? m[1] : ''; }
var WEBMAIL = /^(gmail|googlemail|hotmail|outlook|live|yahoo|orange|wanadoo|free|sfr|laposte|icloud|me|aol|gmx|bbox|neuf|msn)\./;
function norm(x){ return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function nbMails(e){ return (e.mails || []).filter(function(m){ return m.type === 'presentation' || m.type === 'relance'; }).length; }
function dernierMail(e){ var l = (e.mails || []).filter(function(m){ return m.type === 'presentation' || m.type === 'relance'; }); return l.length ? l[l.length-1].d : ''; }
function etapeDe(id){ return ETAPES.filter(function(x){ return x.id === id; })[0] || ETAPES[0]; }
function toast(t){ var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ el.style.display = 'none'; }, 3800); }
function erreur(t){ var el = $('err'); el.textContent = t || ''; el.style.display = t ? 'block' : 'none'; }

function suite(e){
  var a = auj();
  if (e.etape === 'envoye' || e.etape === 'relance') {
    if (e.prochaineRelance) return { txt: (e.prochaineRelance <= a ? 'Relance à valider (' + court(e.prochaineRelance) + ')' : 'Relance le ' + court(e.prochaineRelance)), retard: e.prochaineRelance <= a };
    return { txt: 'En attente de réponse' };
  }
  if (e.etape === 'repondu') return { txt: 'Répondre', retard: true };
  if (e.etape === 'rdv') return { txt: e.rdv ? 'RDV ' + court(e.rdv) + (heure(e.rdv) ? ' · ' + heure(e.rdv) : '') : 'Fixer le rendez-vous', retard: !e.rdv };
  if (e.etape === 'clos') return { txt: e.rappel ? 'Recontacter le ' + court(e.rappel) : 'Clos' };
  if (e.etape === 'stop') return { txt: 'Demande du ' + court(e.stop && e.stop.d) };
  return { txt: '' };
}

/* ═══════════ RENDU ═══════════ */
function visibles(){
  var r = norm(S.recherche);
  return S.liste.filter(function(e){
    if (S.cible && e.cible !== S.cible) return false;
    if (!r) return true;
    return norm([e.nom, e.contact, e.commune, e.email].join(' ')).indexOf(r) >= 0;
  });
}
function rendre(){
  if (!S.user) { $('titre').textContent = 'Connexion…'; $('app').innerHTML = ''; return; }
  if (S.user !== ADMIN) { $('titre').textContent = 'Réservé à l’administrateur'; $('app').innerHTML = '<p class="vide-fiche">La prospection est visible par Maxime seul.</p>'; return; }
  var tous = S.liste, a = auj();
  var mails = tous.reduce(function(s, e){ return s + nbMails(e); }, 0);
  $('titre').innerHTML = '<b>' + mails + '</b> mail' + (mails > 1 ? 's' : '') + ' envoyé' + (mails > 1 ? 's' : '') + ' à <b>' + tous.length + '</b> entreprise' + (tous.length > 1 ? 's' : '');
  var parE = {}; ETAPES.forEach(function(x){ parE[x.id] = []; });
  var vis = visibles();
  vis.forEach(function(e){ (parE[e.etape] || parE.envoye).push(e); });
  var cpt = {}; ETAPES.forEach(function(x){ cpt[x.id] = tous.filter(function(e){ return (e.etape || 'envoye') === x.id; }).length; });
  var repondues = tous.filter(function(e){ return (e.mails || []).some(function(m){ return m.type === 'reponse'; }) || e.etape === 'repondu' || e.etape === 'rdv'; }).length;
  var taux = tous.length ? Math.round(repondues / tous.length * 100) : 0;
  var relDues = tous.filter(function(e){ return (e.etape === 'envoye' || e.etape === 'relance') && e.prochaineRelance && e.prochaineRelance <= plusJours(a, 7); });
  var rdvAvenir = tous.filter(function(e){ return e.etape === 'rdv' && (!e.rdv || String(e.rdv).slice(0,10) >= a); });
  var h = '';

  if (!tous.length) {
    h += '<div class="verre repart"><p class="vide-fiche">Aucune entreprise pour l’instant. Importe le fichier CSV exporté par Sellbird (bouton « Importer ») ou ajoute une entreprise à la main. Chaque mail envoyé fait avancer l’entreprise de colonne.</p></div>';
  }

function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  var sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  var lignes = [], l = [], c = '', q = false;
  for (var i = 0; i < txt.length; i++) {
    var ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i+1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { l.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i+1] === '\n') i++; l.push(c); lignes.push(l); l = []; c = ''; }
    else c += ch;
  }
  if (c || l.length) { l.push(c); lignes.push(l); }
  return lignes.filter(function(x){ return x.some(function(v){ return String(v).trim(); }); });
}
function importer(txt, cible, d){
  var L = parseCSV(txt); if (L.length < 2) { toast('Fichier vide ou illisible.'); return; }
  var tete = L[0].map(norm);
  function col(motifs){ for (var i = 0; i < tete.length; i++) for (var j = 0; j < motifs.length; j++) if (tete[i].indexOf(motifs[j]) >= 0) return i; return -1; }
  var cNom = col(['company','entreprise','societe','business','organisation','organization','raison sociale','nom entreprise']);
  var cMail = col(['email','e mail','mail','courriel']);
  var cPre = col(['first name','firstname','prenom']), cCont = col(['contact','person','decision','full name','nom contact']);
  var cRole = col(['title','role','fonction','poste']);
  var cVille = col(['city','ville','commune','town','locality']);
  var cTel = col(['phone','telephone','tel']);
  if (cNom < 0) cNom = col(['name','nom']);
  if (cNom < 0 && cMail < 0) { toast('Colonnes « entreprise » ou « e-mail » introuvables dans le fichier.'); return; }
  var ajout = 0, connus = 0, bloques = 0, ecritures = [], vus = {};
  L.slice(1).forEach(function(r, i){
    var g = function(k){ return k >= 0 ? String(r[k] || '').trim() : ''; };
    var e = { nom: g(cNom), email: g(cMail).toLowerCase(), contact: [g(cPre) || g(cCont), g(cRole)].filter(Boolean).join(', '), commune: g(cVille), tel: g(cTel), cible: cible, mails: [], cree: new Date().toISOString() };
    if (!e.nom && e.email) e.nom = domaine(e.email);
    if (!e.nom) return;
    e.domaine = domaine(e.email);
    var cle = e.email || norm(e.nom); if (vus[cle]) return; vus[cle] = 1;
    if (bloquee(e)) { bloques++; return; }
    if (doublon(e)) { connus++; return; }
    e._id = nouvelId(e) + i.toString(36);
    ajoutMail(e, 'presentation', '', d); e.etape = 'envoye'; e.prochaineRelance = plusJours(d, DELAI_RELANCE);
    ecritures.push(window._pr.ecrire(e._id, e)); ajout++;
  });
  Promise.all(ecritures).then(function(){
    toast(ajout + ' ajoutée' + (ajout > 1 ? 's' : '') + ' · ' + connus + ' déjà connue' + (connus > 1 ? 's' : '') + ' · ' + bloques + ' refusée' + (bloques > 1 ? 's' : '') + ' (ne plus contacter)');
  }).catch(function(err){ erreur('Import interrompu (' + (err && err.code || 'erreur') + ').'); });
}

if (window.parent && window.parent !== window) $('retour').style.display = '';
if (window._prUser !== undefined) window.PR.utilisateur(window._prUser);
rendre();
})();
