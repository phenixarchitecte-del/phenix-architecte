<title>Phénix-Architecture · Mon espace</title>
<!--
══════════════════════════════════════════════════════════════════════
 PHÉNIX — MON ESPACE (portail de l'assistante administrative)
──────────────────────────────────────────────────────────────────────
 15/10/2026 — Création.
   • Onglet Tâches : toutes les tâches (celles qui lui sont assignées en tête),
     création de tâches, terminer / en cours / note, « me l'assigner ».
   • Onglet Projets : fiches en LECTURE SEULE issues de la collection
     phenix_projets_assistante, copie FILTRÉE écrite par Dossier (jamais de
     honoraires, commissions, budget ni prix d'achat artisans).
   • Notifications vers Maxime : collection phenix_notifs_taches (badge sur
     « Dossier » dans le shell).
   • Lien vers « Devis en cours » (module Relances) via le shell.
 Réglages : voir les constantes juste en dessous (catégories masquées, e-mail admin).

 15/10/2026 (2) — ÉVOLUTIONS :
   • Création de tâche : assignable à n'importe qui (Maxime, C. Gironde, soi-même,
     personne) ; nouveau bouton « Assigner à… » sur chaque tâche. La personne
     choisie reçoit la notification (champ « pour »).
   • Fiche projet : nouvelle section « Chiffrage » (lots, statut, entreprise, montants
     CLIENT, total) lue dans phenix_chiffrage_assistante — SANS marge ni prix artisans —
     et section « Suivi de chantier » (phenix_chantier_assistante). Mention ROUGE
     « Aucune entreprise » par lot tant qu'aucun devis artisan / entreprise n'est
     saisi ; phrase prête à dire au client (« il manque encore une entreprise pour… »).
   • Fiche projet : section « Planning de chantier » (interventions : lot, entreprise,
     dates ; en cours / à venir / terminé) lue dans phenix_planning_assistante.
   • Liste des projets : pastille rouge « N lot(s) sans entreprise ».
   • JOURNAL D'ACTIVITÉ : toutes ses actions (tâche créée / terminée / assignée /
     note, fiche consultée) sont écrites dans phenix_historique (module Journal).
══════════════════════════════════════════════════════════════════════
-->
<script type="module">
import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, setDoc }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeAppCheck, ReCaptchaV3Provider }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';

// Même projet Firebase que le reste de la suite Phénix
const firebaseConfig = {
  apiKey:            "AIzaSyCjNKNvS6p3nqE6-_Gw9I397ZtXm2FG1ew",
  authDomain:        "phenix-architecte-9151b.firebaseapp.com",
  projectId:         "phenix-architecte-9151b",
  storageBucket:     "phenix-architecte-9151b.firebasestorage.app",
  messagingSenderId: "811231684720",
  appId:             "1:811231684720:web:413fa324ae43c07607acb5"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── [Journal] historique d'actions daté — collection phenix_historique ──
//   Une ligne par action : qui (e-mail), quand (ts + jour), dans quel module, quoi.
//   Jamais de montants ni de données sensibles : uniquement des libellés.
//   Lecture : module « Journal » (phenix_journal.html), réservé à l'administrateur.
window.phenixJournal = function(module, action, objet, libelle, extra){
  try{
    const u = auth.currentUser; if(!u || !u.email) return;
    const now = new Date();
    const jour = now.toLocaleDateString('sv-SE', { timeZone:'Europe/Paris' });   // AAAA-MM-JJ
    const email = String(u.email).toLowerCase();
    const lib = String(libelle == null ? '' : libelle).slice(0, 200);
    const cle = [email, module, action, objet, lib].join('|');
    window.__jrnLast = window.__jrnLast || {};
    if(window.__jrnLast[cle] && now.getTime() - window.__jrnLast[cle] < 20000) return;   // anti-doublon (20 s)
    window.__jrnLast[cle] = now.getTime();
    const e = { ts: now.toISOString(), jour: jour, email: email, module: module, action: action, objet: objet || '', libelle: lib };
    if(extra) Object.keys(extra).forEach(function(k){ if(extra[k] !== undefined && extra[k] !== null && extra[k] !== '') e[k] = typeof extra[k] === 'string' ? extra[k].slice(0, 200) : extra[k]; });
    const id = now.getTime().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    setDoc(doc(db, 'phenix_historique', id), e).catch(function(){});
  }catch(err){}
};

const RECAPTCHA_SITE_KEY = '6LeObWktAAAAAL9eyppDRtLp5yZTyBaF4ZNKXNIO';
try {
  initializeAppCheck(app, { provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
} catch (e) { console.warn('App Check non initialisé :', e); }

// ── Auto-login transmis par le Shell (même protocole que les autres modules) ──
window.addEventListener('message', function(ev){
  var d = ev.data;
  if (d && d.source === 'phenix-shell' && d.action === 'auto-login' && d.email && d.password) {
    signInWithEmailAndPassword(auth, d.email, d.password).catch(function(){});
  }
});
try { window.parent.postMessage({ source:'phenix-module', readyForLogin:true }, '*'); } catch(e) {}

window.phenixDoLogin = function(){
  const email = (document.getElementById('pl-email').value || '').trim();
  const pwd   = document.getElementById('pl-pwd').value || '';
  const err   = document.getElementById('pl-err'); if (err) err.textContent = '';
  const btn   = document.getElementById('pl-btn'); if (btn) btn.disabled = true;
  signInWithEmailAndPassword(auth, email, pwd).catch(e => {
    const c = (e && e.code) || '';
    if (err) err.textContent =
      (c.indexOf('invalid-credential')>=0 || c.indexOf('wrong-password')>=0 || c.indexOf('user-not-found')>=0) ? 'E-mail ou mot de passe incorrect.' :
      c.indexOf('invalid-email')>=0 ? 'E-mail invalide.' :
      c.indexOf('too-many-requests')>=0 ? 'Trop de tentatives, réessayez plus tard.' :
      c.indexOf('network')>=0 ? 'Pas de connexion internet.' :
      ('Erreur : ' + (c || (e && e.message) || ''));
  }).finally(() => { if (btn) btn.disabled = false; });
};

// Écritures « fusionnées » : on ne touche que les champs modifiés d'une tâche,
// jamais le reste du document (Dossier peut l'éditer en parallèle).
window._fb = {
  saveTache:      (id, patch) => setDoc(doc(db, 'phenix_taches', String(id)), patch, { merge: true }),
  saveNotifTache: (id, data)  => setDoc(doc(db, 'phenix_notifs_taches', String(id)), data, { merge: true }),
  logout: () => signOut(auth),
};

let unsubT = null, unsubP = null, unsubC = null, unsubS = null, unsubL = null;
const lire = snap => { const l = []; snap.forEach(d => { const x = d.data(); if (x && x.id == null) x.id = d.id; l.push(x); }); return l; };
onAuthStateChanged(auth, user => {
  const ov = document.getElementById('phenix-login');
  if (unsubT) { unsubT(); unsubT = null; }
  if (unsubP) { unsubP(); unsubP = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  if (unsubS) { unsubS(); unsubS = null; }
  if (unsubL) { unsubL(); unsubL = null; }
  if (user) {
    if (ov) ov.style.display = 'none';
    window.E.setUser(user.email || '');
    unsubT = onSnapshot(collection(db, 'phenix_taches'),             s => window.E.setTaches(lire(s)),  e => window.E.onError(e, 'tâches'));
    unsubP = onSnapshot(collection(db, 'phenix_projets_assistante'), s => window.E.setProjets(lire(s)), e => window.E.onError(e, 'projets'));
    unsubC = onSnapshot(collection(db, 'phenix_chiffrage_assistante'), s => window.E.setChiffrage(lire(s)), e => window.E.onError(e, 'chiffrage'));
    unsubS = onSnapshot(collection(db, 'phenix_chantier_assistante'),  s => window.E.setSuivi(lire(s)),     e => window.E.onError(e, 'suivi'));
    unsubL = onSnapshot(collection(db, 'phenix_planning_assistante'),  s => window.E.setPlanning(lire(s)),  e => window.E.onError(e, 'planning'));
  } else {
    window.E.setTaches([]); window.E.setProjets([]); window.E.setChiffrage([]); window.E.setSuivi([]); window.E.setPlanning([]);
    if (ov) ov.style.display = 'flex';
  }
});
</script>
<style>

<body>

<div id="phenix-login" style="display:flex;position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0a1628,#12233f,#2f6fc0);align-items:center;justify-content:center;padding:20px;font-family:'DM Sans',sans-serif">

  </div>
</div>

<div class="wrap">
  <div class="head">
    <div>
      <h1>Mon <span>espace</span></h1>
      <div class="sub" id="who">…</div>
    </div>
    <button class="icon-btn" title="Se déconnecter" onclick="E.logout()"><i class="ti ti-logout"></i></button>

  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-v="taches" onclick="E.vue('taches')">Tâches <span class="n" id="n-taches">0</span></button>
    <button class="tab" data-v="projets" onclick="E.vue('projets')">Projets <span class="n" id="n-projets">0</span></button>
  </div>

  <div id="view"></div>
</div>

<div id="sheet-back" onclick="E.closeSheet()"></div>
<div id="sheet"><div class="inner" id="sheet-in"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* ═══════════ RÉGLAGES ═══════════ */
// Tâches de gestion d'entreprise MASQUÉES à l'assistante (par catégorie). Vider la liste ([]) pour tout lui montrer.
var CATEGORIES_MASQUEES = ['Patrimoine / holding'];
var ADMIN_EMAIL = 'contact@phenixarchitecte.fr';
var NOMS = {}; // rempli depuis ASSIGNABLES juste après
// Personnes à qui l'assistante peut assigner une tâche (en plus d'elle-même). Ajouter les autres ici, p. ex. Kévin.
var ASSIGNABLES = [
  { email:'contact@phenixarchitecte.fr',   nom:'Maxime' },
  { email:'c.gironde@phenixarchitecte.fr', nom:'C. Gironde' }
  // , { email:'kevin@exemple.fr', nom:'Kévin' }
];
var STATUT_CHIFFRAGE = { Chiffrage:'En chiffrage', Valide:'Validé', Revision:'En révision' };
var STATUT_LOT = { chiffrage:'Chiffrage', ao:'Appel d\'offres', attribue:'Attribué', en_cours:'En cours', termine:'Terminé', reserve:'Réserves' };
var CATEGORIES_GESTION = ['Administratif / compta','Commercial / marketing','RH / équipe','Outils & logiciels','Patrimoine / holding'];
var PHASES = ['ESQ','APS','APD','PC','DCE','ACT','DET','AOR'];
var PHASE_LABELS = { ESQ:'Esquisse',APS:'Avant-Projet Sommaire',APD:'Avant-Projet Définitif',PC:'Permis de construire',DCE:'DCE',ACT:'Assistance Contrats',DET:'Direction travaux',AOR:'Réception travaux' };
var PRIO = { urgent:3, haute:2, normale:1 };

ASSIGNABLES.forEach(function(a){ NOMS[a.email.toLowerCase()] = a.nom; });
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var RESTREINT = /[?&]restreint=1/.test(location.search);
var S = { me:'', taches:[], projets:[], chiffrage:{}, suivi:{}, planning:{}, v:'taches', filtre:'all', q:'', qp:'', projetId:null, tasksReady:false };

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return iso(new Date()); }
function dStr(t){ var v = t && t.date; if (!v) return ''; try { if (typeof v === 'string') { var s = v.slice(0,10); return isNaN(new Date(s)) ? '' : s; } if (typeof v.toDate === 'function') return iso(v.toDate()); } catch(e){} return ''; }
function fr(s){ if (!s) return ''; var p = s.split('-'); return p[2]+'/'+p[1]; }
function frL(s){ if (!s) return ''; var p = s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function nom(email){ email = String(email||'').toLowerCase(); if (!email) return ''; if (email === S.me) return 'Moi'; return NOMS[email] || (email.split('@')[0].replace(/^./, function(c){return c.toUpperCase();})); }
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function rid(p){ return p + '-' + Date.now() + '-' + Math.floor(Math.random()*1000); }

/* ═══════════ DONNÉES ═══════════ */
function visibles(){
  return S.taches.filter(function(t){
    if (!t || !t.titre) return false;
    if (t.type === 'gestion' && CATEGORIES_MASQUEES.indexOf(t.categorie) >= 0) return false;
    return true;
  });
}
function projetDe(id){ for (var i=0;i<S.projets.length;i++) if (String(S.projets[i].id) === String(id)) return S.projets[i]; return null; }
function cmp(a,b){
  var td = todayISO(), da = dStr(a), db = dStr(b);
  var ra = da && da < td ? 0 : 1, rb = db && db < td ? 0 : 1;
  if (ra !== rb) return ra - rb;
  if (da !== db) { if (!da) return 1; if (!db) return -1; return da < db ? -1 : 1; }
  return (PRIO[b.priorite]||1) - (PRIO[a.priorite]||1);
}
function find(id){ for (var i=0;i<S.taches.length;i++) if (String(S.taches[i].id) === String(id)) return S.taches[i]; return null; }

/* ═══════════ ÉCRITURES ═══════════ */
function now(){ return new Date().toISOString(); }
async function patch(id, p){
  p.updatedAt = now();
  try { await window._fb.saveTache(id, p); return true; }
  catch(e){ toast('⚠️ Enregistrement impossible : ' + (e && e.code === 'permission-denied' ? 'accès refusé (règles Firestore)' : (e && e.message) || e)); return false; }
}
function jr(action, objet, libelle, extra){ try { if (window.phenixJournal) window.phenixJournal('espace', action, objet, libelle, extra); } catch(e){} }
function tp(t, detail){ var p = t && t.projetId ? projetDe(t.projetId) : null; return { projetId: t && t.projetId ? String(t.projetId) : '', projetNom: p ? (p.nom || p.client || '') : '', detail: detail || '' }; }
function autrui(email){ email = String(email||'').toLowerCase(); return email && email !== S.me ? email : ''; }
async function notif(type, t, texte, pour){
  try { await window._fb.saveNotifTache(rid('nt'), { type:type, tacheId:String(t.id), titre:t.titre||'', par:S.me, quand:now(), lu:false, texte:texte||'', pour:autrui(pour !== undefined ? pour : t.assigneA) }); }
  catch(e){ console.warn('Notification non enregistrée :', e); }
}
function ajouterIntervalle(d, freq, n){
  var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (freq === 'weekly') { r.setDate(r.getDate()+7*n); return r; }
  var mois = freq === 'monthly' ? n : freq === 'quarterly' ? 3*n : 12*n, jour = d.getDate();
  r.setDate(1); r.setMonth(r.getMonth()+mois);
  var dernier = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate();
  r.setDate(Math.min(jour, dernier)); return r;
}
function prochaineDate(dateStr, freq){
  var today = new Date(); today.setHours(0,0,0,0);
  var base = today; if (dateStr) { var p = dateStr.split('-').map(Number); base = new Date(p[0], p[1]-1, p[2]); }
  var n = 1, next = ajouterIntervalle(base, freq, n);
  while (dateStr && next < today && n < 400) { n++; next = ajouterIntervalle(base, freq, n); }
  return iso(next);
}
async function terminer(id){
  var t = find(id); if (!t) return;
  var ok = await patch(id, { statut:'done', terminePar:S.me, termineLe:now() });
  if (!ok) return;
  t.statut = 'done';
  var msg = '✅ Tâche terminée.';
  if (t.recurrence && t.recurrence.freq && !t.recurrenceGeneree) {   // même règle que Dossier : prochaine occurrence, une seule fois
    var date = prochaineDate(dStr(t), t.recurrence.freq), n = now();
    var suivante = {}; Object.keys(t).forEach(function(k){ suivante[k] = t[k]; });
    suivante.id = 't-' + Date.now() + '-' + Math.floor(Math.random()*1000);
    suivante.statut = 'todo'; suivante.date = date; suivante.dateLivraison = date; suivante.recurrenceGeneree = false;
    suivante.createdAt = n; suivante.updatedAt = n; suivante.commentaires = []; delete suivante.terminePar; delete suivante.termineLe;
    try { await window._fb.saveTache(suivante.id, suivante); await window._fb.saveTache(id, { recurrenceGeneree:true }); msg = '✅ Terminée — prochaine échéance le ' + frL(date) + '.'; }
    catch(e){ console.warn(e); }
  }
  await notif('termine', t);
  jr('termine', 'tâche', t.titre, tp(t));
  toast(msg);
}
async function enCours(id){ var t = find(id); if (!t) return; if (await patch(id, { statut:'doing' })) { jr('demarre', 'tâche', t.titre, tp(t)); toast('▶ Tâche en cours.'); } }
async function rouvrir(id){ var t = find(id); if (!t) return; if (await patch(id, { statut:'todo' })) { jr('rouvre', 'tâche', t.titre, tp(t)); toast('↺ Tâche rouverte.'); } }
async function prendre(id){ var t = find(id); if (!t) return; if (await patch(id, { assigneA:S.me })) { jr('assigne', 'tâche', t.titre, tp(t, 'à elle-même')); toast('👤 Tâche assignée à vous.'); } }
async function assigner(id, email){
  var t = find(id); if (!t) return; email = String(email || '').toLowerCase();
  if (await patch(id, { assigneA:email })) {
    t.assigneA = email;
    await notif('assignee', t, '', email);
    jr('assigne', 'tâche', t.titre, tp(t, email ? 'à ' + (email === S.me ? 'elle-même' : nom(email)) : 'non assignée'));
    closeSheet(); toast(email ? '👤 Assignée à ' + nom(email) + '.' : 'Tâche non assignée.');
  }
}
function assignOptions(){   // Maxime, collègues, soi-même, personne — sans doublon
  var l = ASSIGNABLES.map(function(a){ return { email:a.email.toLowerCase(), nom:a.nom }; });
  if (S.me && !l.some(function(a){ return a.email === S.me; })) l.push({ email:S.me, nom:'Moi' });
  return l.map(function(a){ return a.email === S.me ? { email:a.email, nom:'Moi' } : a; });
}
function sheetAssigner(id){
  var t = find(id); if (!t) return;
  var cur = String(t.assigneA||'').toLowerCase();
  openSheet('<h2>Assigner la tâche</h2><div class="sub2">' + esc(t.titre) + '</div><div class="chips">' +
    assignOptions().map(function(a){ return '<button class="opt' + (cur === a.email ? ' sel' : '') + '" onclick="E.assigner(\'' + esc(id) + '\',\'' + esc(a.email) + '\')">' + esc(a.nom) + '</button>'; }).join('') +
    '<button class="opt' + (!cur ? ' sel a' : '') + '" onclick="E.assigner(\'' + esc(id) + '\',\'\')">Personne</button></div>' +
    '<div class="c-actions"><button class="btn ghost" onclick="E.closeSheet()">Annuler</button></div>');
}

/* ═══════════ FEUILLE DU BAS ═══════════ */
function openSheet(html){ $('sheet-in').innerHTML = html; $('sheet-back').style.display = 'block'; $('sheet').style.display = 'block'; }
function closeSheet(){ $('sheet-back').style.display = 'none'; $('sheet').style.display = 'none'; $('sheet-in').innerHTML = ''; }

function sheetNote(id){
  var t = find(id); if (!t) return;
  openSheet('<h2>Ajouter une note</h2><div class="sub2">' + esc(t.titre) + ' — Maxime la verra dans la tâche.</div>' +
    '<div class="fgroup"><textarea class="field" id="note-txt" placeholder="Ex. Client rappelé, rendez-vous pris jeudi 14h…"></textarea></div>' +
    '<div class="c-actions"><button class="btn primary" onclick="E.saveNote(\'' + esc(id) + '\')"><i class="ti ti-send"></i> Enregistrer</button><button class="btn ghost" onclick="E.closeSheet()">Annuler</button></div>');
  setTimeout(function(){ var x = $('note-txt'); if (x) x.focus(); }, 80);
}
async function saveNote(id){
  var t = find(id), txt = ($('note-txt').value || '').trim(); if (!t) return; if (!txt) { toast('Écrivez une note.'); return; }
  var coms = (t.commentaires || []).concat([{ par:S.me, quand:now(), texte:txt }]);
  if (await patch(id, { commentaires:coms })) { t.commentaires = coms; await notif('note', t, txt); jr('note', 'tâche', t.titre, tp(t)); closeSheet(); toast('💬 Note enregistrée.'); }
}

var NEW = null;
function sheetNouvelle(projetId){
  NEW = { rattach: projetId ? 'dossier' : 'dossier', prio:'normale', assigne:ADMIN_EMAIL, projetId: projetId ? String(projetId) : '' };
  renderNew();
}
function renderNew(){
  var opts = '<option value="">— Aucun projet —</option>' + S.projets.slice().sort(function(a,b){ return String(a.nom||'').localeCompare(String(b.nom||'')); })
    .map(function(p){ return '<option value="' + esc(p.id) + '"' + (String(p.id) === NEW.projetId ? ' selected' : '') + '>' + esc(p.nom || p.client || p.ref) + '</option>'; }).join('');
  var cats = CATEGORIES_GESTION.filter(function(c){ return CATEGORIES_MASQUEES.indexOf(c) < 0; });
  var copts = '<option value="">— Choisir —</option>' + cats.map(function(c){ return '<option' + (NEW.categorie === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
  function chip(label, on, fn, cls){ return '<button class="opt' + (on ? ' sel ' + (cls||'') : '') + '" onclick="' + fn + '">' + label + '</button>'; }
  openSheet('<h2>Nouvelle tâche</h2><div class="sub2">Elle apparaît aussitôt dans Dossier, chez Maxime.</div>' +
    '<div class="fgroup"><span class="lbl">Titre *</span><input class="field" id="n-titre" value="' + esc(NEW.titre||'') + '" placeholder="Ex. Rappeler M. Dupont pour le rendez-vous"></div>' +
    '<div class="fgroup"><span class="lbl">Détails</span><textarea class="field" id="n-desc" style="min-height:70px">' + esc(NEW.desc||'') + '</textarea></div>' +
    '<div class="fgroup"><span class="lbl">Échéance</span><input class="field" type="date" id="n-date" value="' + esc(NEW.date||'') + '"></div>' +
    '<span class="lbl">Priorité</span><div class="chips">' + chip('Normale', NEW.prio==='normale', "E.nset('prio','normale')") + chip('Haute', NEW.prio==='haute', "E.nset('prio','haute')", 'a') + chip('Urgente', NEW.prio==='urgent', "E.nset('prio','urgent')", 'r') + '</div>' +
    '<span class="lbl">Rattachement</span><div class="chips">' + chip('Dossier client', NEW.rattach==='dossier', "E.nset('rattach','dossier')") + chip('Gestion d\'entreprise', NEW.rattach==='gestion', "E.nset('rattach','gestion')") + '</div>' +
    (NEW.rattach === 'dossier' ? '<div class="fgroup"><span class="lbl">Projet</span><select class="field" id="n-projet" onchange="E.nkeep()">' + opts + '</select></div>'
                               : '<div class="fgroup"><span class="lbl">Catégorie *</span><select class="field" id="n-cat" onchange="E.nkeep()">' + copts + '</select></div>') +
    '<span class="lbl">Assignée à</span><div class="chips">' + assignOptions().map(function(a){ return chip(esc(a.nom), NEW.assigne===a.email, "E.nset('assigne','" + esc(a.email) + "')"); }).join('') + chip('Personne', NEW.assigne==='', "E.nset('assigne','')") + '</div>' +
    '<div class="c-actions"><button class="btn primary" onclick="E.saveNew()"><i class="ti ti-check"></i> Créer la tâche</button><button class="btn ghost" onclick="E.closeSheet()">Annuler</button></div>');
}
function nkeep(){
  if ($('n-titre')) NEW.titre = $('n-titre').value; if ($('n-desc')) NEW.desc = $('n-desc').value; if ($('n-date')) NEW.date = $('n-date').value;
  if ($('n-projet')) NEW.projetId = $('n-projet').value; if ($('n-cat')) NEW.categorie = $('n-cat').value;
}
function nset(k, v){ nkeep(); NEW[k] = v; renderNew(); }
async function saveNew(){
  nkeep();
  var titre = (NEW.titre || '').trim(); if (!titre) { toast('Saisissez un titre.'); return; }
  if (NEW.rattach === 'gestion' && !NEW.categorie) { toast('Choisissez une catégorie.'); return; }
  var n = now(), date = NEW.date || '';
  var t = { id:'t-' + Date.now(), titre:titre, desc:(NEW.desc||'').trim(), date:date, heure:'', duree:60, statut:'todo', priorite:NEW.prio,
            type:NEW.rattach, categorie: NEW.rattach === 'gestion' ? NEW.categorie : '', recurrence:null, recurrenceGeneree:false,
            projetId: NEW.rattach === 'dossier' ? (NEW.projetId || '') : '', phase:'', assigneA:NEW.assigne || '', dateLivraison:date,
            createdAt:n, updatedAt:n, creePar:S.me, commentaires:[] };
  try { await window._fb.saveTache(t.id, t); } catch(e){ toast('⚠️ Création impossible : ' + (e && e.code === 'permission-denied' ? 'accès refusé (règles Firestore)' : (e && e.message) || e)); return; }
  await notif('creee', t);
  jr('cree', 'tâche', t.titre, tp(t, t.assigneA ? 'assignée à ' + (t.assigneA === S.me ? 'elle-même' : nom(t.assigneA)) : 'non assignée'));
  closeSheet(); toast('✅ Tâche créée' + (t.assigneA && t.assigneA !== S.me ? ' et assignée à ' + nom(t.assigneA) : '') + '.');
}

/* ═══════════ RENDU : TÂCHES ═══════════ */
function carte(t, mine){
  var td = todayISO(), d = dStr(t), done = t.statut === 'done';
  var cls = done ? ' done' : (d && d < td ? ' retard' : d === td ? ' today' : d ? ' soon' : '');
  var p = t.projetId ? projetDe(t.projetId) : null;
  var chips = [];
  if (d) chips.push('<span class="chip ' + (!done && d < td ? 'red' : d === td ? 'amber' : '') + '">📅 ' + fr(d) + (!done && d < td ? ' · en retard' : d === td ? " · aujourd'hui" : '') + '</span>');
  if (t.priorite === 'urgent') chips.push('<span class="chip red">🔴 Urgente</span>'); else if (t.priorite === 'haute') chips.push('<span class="chip amber">🟡 Haute</span>');
  if (t.type === 'gestion') chips.push('<span class="chip violet">🗂 ' + esc(t.categorie || 'Gestion') + '</span>');
  else if (p) chips.push('<span class="chip blue" style="cursor:pointer" onclick="E.ouvrirProjet(\'' + esc(p.id) + '\')">🏗 ' + esc(p.nom || p.client) + '</span>');
  if (t.recurrence && t.recurrence.freq) chips.push('<span class="chip">🔁 récurrente</span>');
  if (t.statut === 'doing') chips.push('<span class="chip green">▶ en cours</span>');
  if (t.assigneA && !mine) chips.push('<span class="chip">👤 ' + esc(nom(t.assigneA)) + '</span>');
  if (!t.assigneA && !done) chips.push('<span class="chip amber">non assignée</span>');
  var coms = (t.commentaires || []).slice(-3).map(function(c){ return '<div><b>' + esc(nom(c.par)) + '</b> · ' + esc(String(c.quand||'').slice(0,10).split('-').reverse().join('/')) + ' — ' + esc(c.texte) + '</div>'; }).join('');
  var act = '';
  if (done) act = '<button class="btn sm" onclick="E.rouvrir(\'' + esc(t.id) + '\')"><i class="ti ti-rotate"></i> Rouvrir</button>';
  else {
    act = '<button class="btn green sm" onclick="E.terminer(\'' + esc(t.id) + '\')"><i class="ti ti-check"></i> Terminer</button>' +
          (t.statut !== 'doing' ? '<button class="btn sm" onclick="E.enCours(\'' + esc(t.id) + '\')"><i class="ti ti-player-play"></i> En cours</button>' : '') +
          (!t.assigneA || (t.assigneA||'').toLowerCase() !== S.me ? '<button class="btn sm" onclick="E.prendre(\'' + esc(t.id) + '\')"><i class="ti ti-user-plus"></i> Me l\'assigner</button>' : '') +
          '<button class="btn sm" onclick="E.assignerA(\'' + esc(t.id) + '\')"><i class="ti ti-users"></i> Assigner à…</button>';
  }
  act += '<button class="btn sm ghost" onclick="E.note(\'' + esc(t.id) + '\')"><i class="ti ti-message"></i> Note</button>';
  return '<div class="card' + cls + '"><div class="c-top"><div><div class="c-client">' + esc(t.titre) + '</div></div></div>' +
    (chips.length ? '<div class="c-meta">' + chips.join('') + '</div>' : '') +
    (t.desc ? '<div class="c-desc">' + esc(t.desc) + '</div>' : '') +
    (coms ? '<div class="coms">' + coms + '</div>' : '') +
    '<div class="c-actions">' + act + '</div></div>';
}
function passe(t){
  if (S.filtre === 'dossier' && t.type === 'gestion') return false;
  if (S.filtre === 'gestion' && t.type !== 'gestion') return false;
  if (S.q) { var p = t.projetId ? projetDe(t.projetId) : null; var h = (t.titre + ' ' + (t.desc||'') + ' ' + (t.categorie||'') + ' ' + (p ? (p.nom||'') + ' ' + (p.client||'') : '')).toLowerCase(); if (h.indexOf(S.q.toLowerCase()) < 0) return false; }
  return true;
}
function renderTaches(){
  var all = visibles(), td = todayISO();
  var ouvertes = all.filter(function(t){ return t.statut !== 'done'; });
  var mine = ouvertes.filter(function(t){ return String(t.assigneA||'').toLowerCase() === S.me; });
  var retard = mine.filter(function(t){ var d = dStr(t); return d && d < td; }).length;
  var auj = mine.filter(function(t){ return dStr(t) === td; }).length;
  var sem = new Date(); sem.setDate(sem.getDate()-7);
  var faites = all.filter(function(t){ return t.statut === 'done' && String(t.terminePar||'').toLowerCase() === S.me && String(t.termineLe||'') >= sem.toISOString(); }).length;
  var autres = ouvertes.filter(function(t){ return mine.indexOf(t) < 0; });
  var termin = all.filter(function(t){ return t.statut === 'done'; }).sort(function(a,b){ return String(b.updatedAt||'') < String(a.updatedAt||'') ? -1 : 1; }).slice(0, 12);
  var h = '<div class="kpis"><div class="kpi"><div class="v">' + mine.length + '</div><div class="l">Mes tâches ouvertes</div></div>' +
    '<div class="kpi ' + (retard ? 'red' : '') + '"><div class="v">' + retard + '</div><div class="l">En retard</div></div>' +
    '<div class="kpi ' + (auj ? 'amber' : '') + '"><div class="v">' + auj + '</div><div class="l">Pour aujourd\'hui</div></div>' +
    '<div class="kpi green"><div class="v">' + faites + '</div><div class="l">Terminées (7 j)</div></div></div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:10px"><input class="search" style="margin:0;flex:1" id="q" placeholder="Rechercher une tâche, un projet…" value="' + esc(S.q) + '" oninput="E.setQ(this.value)"><button class="btn primary" onclick="E.nouvelle()"><i class="ti ti-plus"></i> Tâche</button></div>';
  h += '<div class="filters">' + [['all','Toutes'],['dossier','Dossiers'],['gestion','Gestion']].map(function(f){ return '<button class="opt' + (S.filtre === f[0] ? ' sel' : '') + '" onclick="E.setFiltre(\'' + f[0] + '\')">' + f[1] + '</button>'; }).join('') + '</div>';
  var m = mine.filter(passe).sort(cmp), a = autres.filter(passe).sort(cmp);
  h += '<div class="sec-title"><span>Mes tâches (' + m.length + ')</span></div>';
  h += m.length ? m.map(function(t){ return carte(t, true); }).join('') : '<div class="empty"><div class="big">🎉</div>Aucune tâche ne vous est assignée.</div>';
  h += '<div class="sec-title"><span>Autres tâches (' + a.length + ') — pour prendre des initiatives</span></div>';
  h += a.length ? a.map(function(t){ return carte(t, false); }).join('') : '<div class="empty">Rien d\'autre en cours.</div>';
  if (termin.length) { h += '<div class="sec-title"><span>Dernières terminées</span></div>' + termin.filter(passe).map(function(t){ return carte(t, false); }).join(''); }
  $('view').innerHTML = h;
  $('n-taches').textContent = mine.length;
}

/* ═══════════ CHIFFRAGE / SUIVI DE CHANTIER ═══════════ */
function fmtE(n){ try { return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n || 0); } catch(e){ return Math.round(n || 0) + ' €'; } }
function normNom(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ''); }
// Clé de rapprochement d'un lot entre Chiffrage et Chantier : son numéro (« LOT 03 » → 3), sinon son nom.
function cleLot(num, nomLot){
  var m = String(num||'').match(/(\d+)\s*([A-Za-z])?\s*$/) || String(nomLot||'').match(/lot\s*(?:n°|no|n)?\s*0*(\d+)\s*([A-Za-z])?(?![A-Za-z0-9])/i) || String(nomLot||'').match(/^\s*0*(\d+)\s*([A-Za-z])?\s*[—–:\-.)]/);
  return m ? ('n' + parseInt(m[1], 10) + (m[2] || '').toUpperCase()) : ('t' + normNom(nomLot || num));
}
function etatLots(pid){
  pid = String(pid);
  var c = S.chiffrage[pid] || null, s = S.suivi[pid] || null, parCle = {}, lots = [];
  if (s) (s.lots || []).forEach(function(l){ parCle[cleLot('', l.nom)] = l; });
  function fusion(base, sl){
    var ent = base.entreprise || (sl && sl.entreprise) || '', devis = !!base.devisArtisan || !!(sl && sl.devisArtisan);
    base.entreprise = ent; base.etat = ent ? 'ok' : (devis ? 'devis' : 'aucune'); return base;
  }
  if (c) (c.lots || []).forEach(function(l){ lots.push(fusion({ num:l.num, nom:l.nom, statut:l.statut, entreprise:l.entreprise, devisArtisan:l.devisArtisan, ht:l.montantHt, ttc:l.montantTtc }, parCle[cleLot(l.num, l.nom)])); });
  else if (s) (s.lots || []).forEach(function(l){ lots.push(fusion({ num:'', nom:l.nom, statut:'', entreprise:l.entreprise, devisArtisan:l.devisArtisan }, null)); });
  return { chiffrage:c, suivi:s, lots:lots,
           sans: lots.filter(function(l){ return l.etat === 'aucune'; }),
           devis: lots.filter(function(l){ return l.etat === 'devis'; }) };
}
function badgeEnt(l){
  if (l.etat === 'ok') return '<span class="chip">🏢 ' + esc(l.entreprise) + '</span>';
  if (l.etat === 'devis') return '<span class="chip amber">Devis reçu — entreprise à préciser</span>';
  return '<span class="chip red">⚠ Aucune entreprise sur ce lot</span>';
}
function nomsLots(l){ return l.map(function(x){ return String(x.nom || x.num || ''); }).join(', '); }
function phraseChiffrage(e){
  if (!e.lots.length) return '';
  var n = e.lots.length, manq = e.sans.length + e.devis.length;
  var s = 'Le chiffrage porte sur ' + n + ' lot' + (n > 1 ? 's' : '') + (e.chiffrage ? ' (' + fmtE(e.chiffrage.totalHt) + ' HT à ce jour)' : '') + '. ';
  if (!manq) return s + 'Une entreprise est identifiée pour chaque lot.';
  s += (n - manq) + ' lot' + (n - manq > 1 ? 's ont' : ' a') + ' une entreprise identifiée. ';
  if (e.sans.length) s += 'Il manque encore une entreprise pour : ' + nomsLots(e.sans) + '. ';
  if (e.devis.length) s += 'Devis reçu mais entreprise à préciser pour : ' + nomsLots(e.devis) + '.';
  return s.trim();
}
function majLe(iso){ var s = String(iso||''); if (!s) return ''; var d = new Date(s); if (isNaN(d)) return ''; return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function renderPlanning(p){
  var pl = S.planning[String(p.id)], td = todayISO();
  var l = pl ? (pl.interventions || []) : [];
  if (!l.length) return '<div class="sec-title"><span>Planning de chantier</span></div><div class="box"><div class="info vide">Pas encore de planning de chantier pour ce dossier.</div></div>';
  var etat = function(i){ return i.dateFin && i.dateFin < td ? 'fait' : (i.dateDebut && i.dateDebut <= td ? 'cours' : 'avenir'); };
  var faits = l.filter(function(i){ return etat(i) === 'fait'; }), restant = l.filter(function(i){ return etat(i) !== 'fait'; });
  var liste = faits.slice(-2).concat(restant);
  var h = '<div class="sec-title"><span>Planning de chantier</span></div><div class="box">' + liste.map(function(i){
    var e = etat(i);
    return '<div class="lot"><div class="lot-h"><span>' + esc(i.lot || 'Intervention') + '</span><span class="chip ' + (e === 'cours' ? 'amber' : e === 'fait' ? 'green' : 'blue') + '">' + (e === 'cours' ? 'En cours' : e === 'fait' ? 'Terminé' : 'À venir') + '</span></div>' +
      '<div class="lot-m">' + (i.artisan ? '<span class="chip">🏢 ' + esc(i.artisan) + '</span>' : '<span class="chip red">⚠ Aucune entreprise</span>') + '<span class="chip">' + (i.dateDebut ? frL(i.dateDebut) : '?') + ' → ' + (i.dateFin ? frL(i.dateFin) : '?') + '</span></div></div>';
  }).join('') + '</div>';
  if (pl.updatedAt) h += '<div class="c-objet" style="margin-top:6px">Planning mis à jour le ' + esc(majLe(pl.updatedAt)) + '</div>';
  return h;
}
function renderChiffrage(p){
  var e = etatLots(p.id);
  if (!e.chiffrage && !e.suivi) return '<div class="sec-title"><span>Chiffrage</span></div><div class="box"><div class="info vide">Pas encore de chiffrage transmis pour ce dossier.</div></div>';
  var h = '<div class="sec-title"><span>Chiffrage' + (e.chiffrage ? ' — ' + esc(e.chiffrage.chantierNom || '') : '') + '</span></div>';
  if (e.lots.length) {
    if (e.sans.length) h += '<div class="alerte"><b>⚠ ' + e.sans.length + ' lot' + (e.sans.length > 1 ? 's' : '') + ' sans entreprise :</b> ' + esc(nomsLots(e.sans)) + '.</div>';
    if (e.devis.length) h += '<div class="alerte ora"><b>' + e.devis.length + ' lot' + (e.devis.length > 1 ? 's' : '') + ' avec devis reçu</b>, entreprise à préciser : ' + esc(nomsLots(e.devis)) + '.</div>';
    if (!e.sans.length && !e.devis.length) h += '<div class="alerte ok">✓ Une entreprise est identifiée sur chaque lot.</div>';
    h += '<div class="dire"><small>Pour répondre au téléphone</small>' + esc(phraseChiffrage(e)) + '</div>';
  }
  if (e.chiffrage) {
    h += '<div class="box">' + (e.lots.length ? e.lots.map(function(l){
      return '<div class="lot"><div class="lot-h"><span><b>' + esc(l.num || '') + '</b>' + esc(l.nom) + '</span></div><div class="lot-m">' +
        (l.statut ? '<span class="chip blue">' + esc(STATUT_CHIFFRAGE[l.statut] || l.statut) + '</span>' : '') + badgeEnt(l) +
        '<span class="lot-ht">' + fmtE(l.ht) + ' HT</span></div></div>';
    }).join('') : '<div class="info vide">Aucun lot chiffré pour l\'instant.</div>') +
    (e.lots.length ? '<div class="kv" style="margin-top:6px"><span><b style="color:#fff">Total client</b></span><span><b style="color:#fff">' + fmtE(e.chiffrage.totalHt) + ' HT · ' + fmtE(e.chiffrage.totalTtc) + ' TTC</b></span></div>' : '') +
    '</div>' + (e.chiffrage.updatedAt ? '<div class="c-objet" style="margin-top:6px">Chiffrage mis à jour le ' + esc(majLe(e.chiffrage.updatedAt)) + '</div>' : '');
  } else {
    h += '<div class="box">' + e.lots.map(function(l){ return '<div class="lot"><div class="lot-h"><span>' + esc(l.nom) + '</span></div><div class="lot-m">' + badgeEnt(l) + '</div></div>'; }).join('') + '</div>';
  }
  if (e.suivi && (e.suivi.lots || []).length) {
    var td = todayISO();
    h += '<div class="sec-title"><span>Suivi de chantier</span></div><div class="box">' + e.suivi.lots.map(function(l){
      var av = Math.max(0, Math.min(100, parseFloat(l.av) || 0)), retard = l.fin && l.fin < td && l.statut !== 'termine';
      var ent = l.entreprise ? { etat:'ok', entreprise:l.entreprise } : (l.devisArtisan ? { etat:'devis' } : { etat:'aucune' });
      return '<div class="lot"><div class="lot-h"><span>' + esc(l.nom) + '</span><span class="chip ' + (l.statut === 'termine' ? 'green' : l.statut === 'en_cours' ? 'amber' : 'blue') + '">' + esc(STATUT_LOT[l.statut] || l.statut || '—') + '</span></div>' +
        '<div class="lot-m">' + badgeEnt(ent) + (l.debut ? '<span class="chip">' + frL(l.debut) + (l.fin ? ' → ' : '') + (l.fin ? '<span' + (retard ? ' style="color:var(--red)"' : '') + '>' + frL(l.fin) + '</span>' : '') + '</span>' : '') + '</div>' +
        '<div class="bar" style="margin-top:7px"><i style="width:' + av + '%"></i></div><div class="c-objet" style="margin-top:3px">Avancement : ' + av + ' %</div></div>';
    }).join('') + '</div>' + (e.suivi.updatedAt ? '<div class="c-objet" style="margin-top:6px">Suivi mis à jour le ' + esc(majLe(e.suivi.updatedAt)) + '</div>' : '');
  }
  return h;
}

/* ═══════════ RENDU : PROJETS ═══════════ */
function renderProjets(){
  if (S.projetId != null) { renderFiche(); return; }
  var l = S.projets.filter(function(p){ if (!S.qp) return true; return ((p.nom||'') + ' ' + (p.client||'') + ' ' + (p.ref||'') + ' ' + (p.adresse||'')).toLowerCase().indexOf(S.qp.toLowerCase()) >= 0; })
    .sort(function(a,b){ return String(a.nom||'').localeCompare(String(b.nom||'')); });
  var h = '<input class="search" id="qp" placeholder="Rechercher un projet, un client, une adresse…" value="' + esc(S.qp) + '" oninput="E.setQp(this.value)">';
  if (!S.projets.length) h += '<div class="empty"><div class="big">📁</div>Aucune fiche projet disponible pour l\'instant.<br><small>Maxime doit ouvrir Dossier pour les synchroniser.</small></div>';
  h += l.map(function(p){
    var av = Math.max(0, Math.min(100, parseFloat(p.avancement) || 0));
    return '<div class="card click" onclick="E.ouvrirProjet(\'' + esc(p.id) + '\')"><div class="c-top"><div><div class="c-client">' + esc(p.nom || p.client) + '</div><div class="c-objet">' + esc(p.client || '') + (p.adresse ? ' · ' + esc(p.adresse) : '') + '</div></div></div>' +
      '<div class="c-meta"><span class="chip blue">' + esc(p.phase || '—') + '</span>' + (p.type ? '<span class="chip">' + esc(p.type) + '</span>' : '') + (function(){ var e = etatLots(p.id); return e.sans.length ? '<span class="chip red">⚠ ' + e.sans.length + ' lot' + (e.sans.length > 1 ? 's' : '') + ' sans entreprise</span>' : ''; })() + '</div>' +
      '<div class="bar" style="margin-top:9px"><i style="width:' + av + '%"></i></div></div>';
  }).join('');
  $('view').innerHTML = h;
}
function kv(a, b){ return '<div class="kv"><span>' + a + '</span><span>' + (b || '—') + '</span></div>'; }
function bloc(titre, txt){ var v = String(txt||'').trim(); return '<div class="box"><h3>' + titre + '</h3><div class="info' + (v ? '' : ' vide') + '">' + (v ? esc(v) : 'À renseigner par Maxime') + '</div></div>'; }
function renderFiche(){
  var p = projetDe(S.projetId); if (!p) { S.projetId = null; renderProjets(); return; }
  var ci = PHASES.indexOf(p.phase), av = Math.max(0, Math.min(100, parseFloat(p.avancement) || 0)), td = todayISO();
  var inf = p.infos || {};
  var tel = p.tel ? '<a href="tel:' + esc(String(p.tel).replace(/\s/g,'')) + '">' + esc(p.tel) + '</a>' : '';
  var mail = p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : '';
  var adr = p.adresse ? '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.adresse) + '">' + esc(p.adresse) + '</a>' : '';
  var art = (p.artisans || []).length ? (p.artisans || []).map(function(a){ return kv(esc(a.metier || '—'), esc(a.nom)); }).join('') : '<div class="info vide">Aucun artisan renseigné.</div>';
  var ech = (p.echeances || []).filter(function(e){ return e.date >= td; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(0, 8);
  var echH = ech.length ? ech.map(function(e){ return kv(frL(e.date) + (e.heure ? ' ' + esc(e.heure) : ''), esc(e.desc || e.type)); }).join('') : '<div class="info vide">Aucune échéance à venir.</div>';
  var tp = visibles().filter(function(t){ return String(t.projetId) === String(p.id); }).sort(cmp);
  var h = '<button class="btn ghost back" onclick="E.fermerProjet()"><i class="ti ti-arrow-left"></i> Tous les projets</button>' +
    '<div class="box" style="margin-bottom:10px"><div class="c-client" style="font-size:20px">' + esc(p.nom || p.client) + '</div><div class="c-objet">' + (p.ref ? 'Réf. ' + esc(p.ref) : '') + '</div>' +
    '<div class="phases">' + PHASES.map(function(x,i){ return '<span class="ph' + (i < ci ? ' d' : i === ci ? ' c' : '') + '" title="' + esc(PHASE_LABELS[x]||x) + '">' + x + '</span>'; }).join('') + '</div>' +
    '<div class="c-objet" style="margin-bottom:8px">' + esc(PHASE_LABELS[p.phase] || '') + '</div>' +
    '<div class="bar"><i style="width:' + av + '%"></i></div><div class="c-objet" style="margin-top:4px">Avancement : ' + av + ' %</div></div>' +
    '<div class="pgrid"><div class="box"><h3>Client</h3>' + kv('Nom', esc(p.client)) + kv('Téléphone', tel) + kv('E-mail', mail) + kv('Adresse du projet', adr) + '</div>' +
    '<div class="box"><h3>Projet</h3>' + kv('Nature', esc(p.type)) + kv('Mission', esc(p.mission)) + kv('Surface', p.surface ? esc(p.surface) + ' m²' : '') + kv('Statut', esc(p.statut)) + kv('Démarrage', p.date ? frL(p.date) : '') + '</div>' +
    '<div class="box"><h3>Artisans</h3>' + art + '</div><div class="box"><h3>Planning · prochaines échéances</h3>' + echH + '</div></div>' +
    renderPlanning(p) + renderChiffrage(p) +
    '<div class="sec-title"><span>Pour répondre au client</span></div><div class="infos4">' +
    bloc('Où en est le dossier', inf.etat) + bloc('Prochaine étape', inf.prochaine) + bloc('Ce que vous pouvez dire', inf.adire) + bloc('À éviter de dire', inf.aeviter) + bloc('Questions fréquentes', inf.faq) + '</div>' +
    '<div class="sec-title"><span>Tâches de ce dossier (' + tp.length + ')</span><button class="btn sm primary" onclick="E.nouvelle(\'' + esc(p.id) + '\')"><i class="ti ti-plus"></i> Tâche</button></div>' +
    (tp.length ? tp.map(function(t){ return carte(t, String(t.assigneA||'').toLowerCase() === S.me); }).join('') : '<div class="empty">Aucune tâche sur ce dossier.</div>') +
    (p.maj ? '<div class="c-objet" style="margin-top:14px;text-align:center">Fiche synchronisée le ' + esc(String(p.maj).slice(0,10).split('-').reverse().join('/')) + '</div>' : '');
  $('view').innerHTML = h;
  window.scrollTo(0, 0);
}

/* ═══════════ ORCHESTRATION ═══════════ */
function render(){
  document.querySelectorAll('#tabs .tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-v') === S.v); });
  $('n-projets').textContent = S.projets.length;
  if (document.activeElement && (document.activeElement.id === 'q' || document.activeElement.id === 'qp')) {   // ne pas casser la saisie en cours
    var id = document.activeElement.id, pos = document.activeElement.selectionStart;
    (S.v === 'taches' ? renderTaches : renderProjets)();
    var el = $(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(e){} }
    return;
  }
  (S.v === 'taches' ? renderTaches : renderProjets)();
}
window.E = {
  restreint: RESTREINT,
  setUser: function(email){ S.me = String(email||'').toLowerCase(); $('who').textContent = S.me + (RESTREINT ? '' : ' · aperçu de l\'espace assistante'); render(); },
  setTaches: function(l){ S.taches = l || []; S.tasksReady = true; render(); },
  setProjets: function(l){ S.projets = l || []; render(); },
  onError: function(err, quoi){
    var perm = err && err.code === 'permission-denied';
    $('err').innerHTML = '<div class="banner">⚠️ Lecture des ' + esc(quoi || 'données') + ' impossible' + (perm ? ' : accès refusé par les règles Firestore (voir la règle à ajouter pour ' + (quoi === 'projets' ? 'phenix_projets_assistante' : quoi === 'chiffrage' ? 'phenix_chiffrage_assistante' : quoi === 'suivi' ? 'phenix_chantier_assistante' : quoi === 'planning' ? 'phenix_planning_assistante' : 'phenix_taches') + ').' : ' : ' + esc((err && err.message) || err)) + '</div>';
  },
  vue: function(v){ S.v = v; if (v === 'projets') S.projetId = null; render(); },
  setQ: function(v){ S.q = v; render(); }, setQp: function(v){ S.qp = v; render(); },
  setFiltre: function(f){ S.filtre = f; render(); },
  ouvrirProjet: function(id){
    S.v = 'projets'; S.projetId = id; render();
    try { var p = projetDe(id), k = 'c' + id; window.__consult = window.__consult || {};
      if (p && (!window.__consult[k] || Date.now() - window.__consult[k] > 600000)) { window.__consult[k] = Date.now(); jr('consulte', 'fiche projet', p.nom || p.client || p.ref, { projetId:String(p.id), projetNom:p.nom || p.client || '' }); } } catch(e){}
  },
  fermerProjet: function(){ S.projetId = null; render(); },
  nouvelle: sheetNouvelle, nset: nset, nkeep: nkeep, saveNew: saveNew,
  note: sheetNote, saveNote: saveNote, closeSheet: closeSheet,
  terminer: terminer, enCours: enCours, rouvrir: rouvrir, prendre: prendre, assigner: assigner, assignerA: sheetAssigner,
  setChiffrage: function(l){ var m = {}; (l || []).forEach(function(x){ m[String(x.projetId || x.id)] = x; }); S.chiffrage = m; render(); },
  setSuivi: function(l){ var m = {}; (l || []).forEach(function(x){ m[String(x.projetId || x.id)] = x; }); S.suivi = m; render(); },
  setPlanning: function(l){ var m = {}; (l || []).forEach(function(x){ m[String(x.projetId || x.id)] = x; }); S.planning = m; render(); },
  ouvrirDevis: function(){
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ source:'phenix-espace', action:'open-module', module:'relances' }, '*'); return; } } catch(e){}
    toast('Ouvrez « Devis » depuis le menu du Shell.');
  },
  logout: function(){ if (window._fb) window._fb.logout(); }
};
render();
})();
</script>
