<!--
 17/10/2026 — FUSION COMPLÈTE : l'ancien module Relances (phenix_relances.html) et le portail à deux onglets
   (phenix_assistante.html) sont intégrés ici. Onglets : Tâches · Projets · Devis à relancer. Ce fichier remplace les trois.
   Pour l'assistante (?restreint=1) l'onglet Devis s'ouvre en premier. Repérer : #rel-view, rsheet, window.R.
══════════════════════════════════════════════════════════════════════
 PHÉNIX — MON ESPACE (portail de l'assistante administrative)
──────────────────────────────────────────────────────────────────────
 15/10/2026 — Création.
   • Onglet Tâches : toutes les tâches (celles qui lui sont assignées en tête),
     création de tâches, terminer / en cours / note, « me l'assigner ».
   • Onglet Projets : fiches en LECTURE SEULE issues de la collection
     phenix_projets_assistante, copie FILTRÉE écrite par Dossier (jamais de
     honoraires, commissions, budget ni prix d'achat artisans).
   • Notifications vers Maxime : collection phenix_notifs_taches (badge sur
     « Dossier » dans le shell).
   • Lien vers « Devis en cours » (module Relances) via le shell.
 Réglages : voir les constantes juste en dessous (catégories masquées, e-mail admin).

 15/10/2026 (2) — ÉVOLUTIONS :
   • Création de tâche : assignable à n'importe qui (Maxime, C. Gironde, soi-même,
     personne) ; nouveau bouton « Assigner à… » sur chaque tâche. La personne
     choisie reçoit la notification (champ « pour »).
   • Fiche projet : nouvelle section « Chiffrage » (lots, statut, entreprise, montants
     CLIENT, total) lue dans phenix_chiffrage_assistante — SANS marge ni prix artisans —
     et section « Suivi de chantier » (phenix_chantier_assistante). Mention ROUGE
     « Aucune entreprise » par lot tant qu'aucun devis artisan / entreprise n'est
     saisi ; phrase prête à dire au client (« il manque encore une entreprise pour… »).
   • Fiche projet : section « Planning de chantier » (interventions : lot, entreprise,
     dates ; en cours / à venir / terminé) lue dans phenix_planning_assistante.
   • Liste des projets : pastille rouge « N lot(s) sans entreprise ».
   • JOURNAL D'ACTIVITÉ : toutes ses actions (tâche créée / terminée / assignée /
     note, fiche consultée) sont écrites dans phenix_historique (module Journal).
══════════════════════════════════════════════════════════════════════
-->
<script type="module">
import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, query, where }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeAppCheck, ReCaptchaV3Provider }
                               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';

// Même projet Firebase que le reste de la suite Phénix
const firebaseConfig = {
  apiKey:            "AIzaSyCjNKNvS6p3nqE6-_Gw9I397ZtXm2FG1ew",
  authDomain:        "phenix-architecte-9151b.firebaseapp.com",
  projectId:         "phenix-architecte-9151b",
  storageBucket:     "phenix-architecte-9151b.firebasestorage.app",
  messagingSenderId: "811231684720",
  appId:             "1:811231684720:web:413fa324ae43c07607acb5"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── [Journal] historique d'actions daté — collection phenix_historique ──
//   Une ligne par action : qui (e-mail), quand (ts + jour), dans quel module, quoi.
//   Jamais de montants ni de données sensibles : uniquement des libellés.
//   Lecture : module « Journal » (phenix_journal.html), réservé à l'administrateur.
window.phenixJournal = function(module, action, objet, libelle, extra){
  try{
    const u = auth.currentUser; if(!u || !u.email) return;
    const now = new Date();
    const jour = now.toLocaleDateString('sv-SE', { timeZone:'Europe/Paris' });   // AAAA-MM-JJ
    const email = String(u.email).toLowerCase();
    const lib = String(libelle == null ? '' : libelle).slice(0, 200);
    const cle = [email, module, action, objet, lib].join('|');
    window.__jrnLast = window.__jrnLast || {};
    if(window.__jrnLast[cle] && now.getTime() - window.__jrnLast[cle] < 20000) return;   // anti-doublon (20 s)
    window.__jrnLast[cle] = now.getTime();
    const e = { ts: now.toISOString(), jour: jour, email: email, module: module, action: action, objet: objet || '', libelle: lib };
    if(extra) Object.keys(extra).forEach(function(k){ if(extra[k] !== undefined && extra[k] !== null && extra[k] !== '') e[k] = typeof extra[k] === 'string' ? extra[k].slice(0, 200) : extra[k]; });
    const id = now.getTime().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    setDoc(doc(db, 'phenix_historique', id), e).catch(function(){});
  }catch(err){}
};

const RECAPTCHA_SITE_KEY = '6LeObWktAAAAAL9eyppDRtLp5yZTyBaF4ZNKXNIO';
try {
  initializeAppCheck(app, { provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
} catch (e) { console.warn('App Check non initialisé :', e); }

// ── Auto-login transmis par le Shell (même protocole que les autres modules) ──
window.addEventListener('message', function(ev){
  var d = ev.data;
  if (d && d.source === 'phenix-shell' && d.action === 'auto-login' && d.email && d.password && ev.source === window.parent) {
    signInWithEmailAndPassword(auth, d.email, d.password).catch(function(){});
  }
});
try { window.parent.postMessage({ source:'phenix-module', readyForLogin:true }, '*'); } catch(e) {}

// Écritures « fusionnées » : on ne touche que les champs modifiés d'une tâche,
// jamais le reste du document (Dossier peut l'éditer en parallèle).
window._fb = {
  saveTache:      (id, patch) => setDoc(doc(db, 'phenix_taches', String(id)), patch, { merge: true }),
  saveNotifTache: (id, data)  => setDoc(doc(db, 'phenix_notifs_taches', String(id)), data, { merge: true }),
  logout: () => signOut(auth),
};

// ── Devis à relancer (ex-module Relances) : écritures « fusionnées »
Object.assign(window._fb, {
  saveFacture: (id, patch) => setDoc(doc(db, 'phenix_factures', String(id)), patch, { merge: true }),
  // Devis envoyés mais pas encore signés : collection à part, jamais mélangée à la facturation
  saveDevisEnCours: (id, data) => setDoc(doc(db, 'phenix_devis_en_cours', String(id)), data, { merge: true }),
  deleteDevisEnCours: (id) => deleteDoc(doc(db, 'phenix_devis_en_cours', String(id))),
  // Notifications « statut modifié par la secrétaire » (lues par Maxime, dans le module et dans le shell)
  saveNotif: (id, data) => setDoc(doc(db, 'phenix_notifs', String(id)), data, { merge: true }),
});

// ── [Journal] enveloppes des écritures du module Devis en cours ──
(function(){
  const fb = window._fb;
  const item = id => { try{ return (typeof findItem === 'function') ? findItem(id) : null; }catch(e){ return null; } };
  const RES = { signed:'devis signé', lost:'devis perdu / sans suite' };
  const lib = (id, d) => { const f = (item(id) || {}).f || d || {}; return [f.client, f.numero].filter(Boolean).join(' · ') || ('#' + id); };
  function relance(id, patch){
    const histo = Array.isArray(patch.relanceHisto) ? patch.relanceHisto : [];
    const last = histo[histo.length - 1] || {};
    let act = 'relance', det = [last.canal, last.res].filter(Boolean).join(' · ');
    if (patch.statut === 'signe' || patch.statut === 'accepte') { act = 'signe'; det = 'devis signé'; }
    else if (patch.statut === 'perdu' || patch.statut === 'refuse') { act = 'refuse'; det = 'devis perdu / refusé' + (patch.motifPerte ? ' — ' + patch.motifPerte : ''); }
    else if (patch.statut) { act = 'statut'; det = 'statut → ' + patch.statut; }
    return [act, lib(id), det];
  }
  const sF = fb.saveFacture, sD = fb.saveDevisEnCours, dD = fb.deleteDevisEnCours;
  fb.saveFacture = async function(id, patch){
    let m = null; try{ m = relance(id, patch || {}); }catch(e){}
    const r = await sF.apply(this, arguments);
    try{ if(m) window.phenixJournal('relances', m[0], 'devis', m[1], { detail:m[2], projetNom:m[1] }); }catch(e){}
    return r;
  };
  fb.saveDevisEnCours = async function(id, data){
    let m = null;
    try{
      data = data || {};
      m = (data.relanceHisto || data.statut) && !data.client ? relance(id, data)
        : ['enregistre', lib(id, data), data.statut === 'en_cours' ? 'nouveau devis dans la file' : 'devis modifié'];
    }catch(e){}
    const r = await sD.apply(this, arguments);
    try{ if(m) window.phenixJournal('relances', m[0], 'devis', m[1], { detail:m[2], projetNom:m[1] }); }catch(e){}
    return r;
  };
  fb.deleteDevisEnCours = async function(id){
    let l = ''; try{ l = lib(id); }catch(e){}
    const r = await dD.apply(this, arguments);
    try{ window.phenixJournal('relances', 'supprime', 'devis', l); }catch(e){}
    return r;
  };
})();

let unsubT = null, unsubP = null, unsubC = null, unsubS = null, unsubL = null, unsubU = null, unsubD = null, unsubN = null, unsubF = null, unsubRP = null;
const lire = snap => { const l = []; snap.forEach(d => { const x = d.data(); if (x && x.id == null) x.id = d.id; l.push(x); }); return l; };
onAuthStateChanged(auth, user => {
  const ov = document.getElementById('phenix-login');
  if (unsubT) { unsubT(); unsubT = null; }
  if (unsubP) { unsubP(); unsubP = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  if (unsubS) { unsubS(); unsubS = null; }
  if (unsubL) { unsubL(); unsubL = null; }
  if (unsubU) { unsubU(); unsubU = null; }
  if (unsubD) { unsubD(); unsubD = null; }
  if (unsubN) { unsubN(); unsubN = null; }
  if (unsubF) { unsubF(); unsubF = null; }
  if (unsubRP) { unsubRP(); unsubRP = null; }
  if (user) {
    if (ov) ov.style.display = 'none';
    window.E.setUser(user.email || '');
    const _solo = /[?&]taches=1/.test(location.search);   // [Accès] compte « tâches seulement » : requête limitée à SES tâches (exigé par les règles Firestore)
    const _qT = _solo ? query(collection(db, 'phenix_taches'), where('assigneA', '==', String(user.email || '').toLowerCase())) : collection(db, 'phenix_taches');
    unsubT = onSnapshot(_qT, s => window.E.setTaches(lire(s)),  e => window.E.onError(e, 'tâches'));
    const _restr = /[?&]restreint=1/.test(location.search);
    if (!_solo) {
      unsubP = onSnapshot(collection(db, 'phenix_projets_assistante'), s => window.E.setProjets(lire(s)), e => window.E.onError(e, 'projets'));
      if (!_restr) unsubC = onSnapshot(collection(db, 'phenix_chiffrage_assistante'), s => window.E.setChiffrage(lire(s)), e => window.E.onError(e, 'chiffrage'));
    }
    // [Accès] personnes assignables = fiches phenix_users (illisible pour un compte « tâches seulement » : liste de secours)
    if (!_solo) unsubU = onSnapshot(collection(db, 'phenix_users'), s => { window.E.setUsers(lire(s).map(function(x){ return Object.assign({}, x, { email: x.email || x.id }); })); }, function(e){ console.warn('phenix_users :', e && e.code); });
    // ── Devis à relancer (ex-Relances) : devis en cours, notifications (admin seulement), factures-devis, contacts projets
    window.R.setUser(user.email || '');
    if (!_solo) {
      unsubD = onSnapshot(collection(db, 'phenix_devis_en_cours'), s => window.R.setDevis(lire(s)), e => window.R.onError(e, 'devis'));
      if (!window.R.restreint) unsubN = onSnapshot(query(collection(db, 'phenix_notifs'), where('lu', '==', false)), s => window.R.setNotifs(lire(s)), e => window.R.onError(e, 'notifs'));
      unsubF = onSnapshot(collection(db, 'phenix_factures'), s => window.R.setFactures(lire(s)), e => window.R.onError(e));
      unsubRP = onSnapshot(collection(db, 'phenix_projets'), s => window.R.setProjets(lire(s)), e => window.R.onError(e));
    }
    // [Accès] suivi de chantier et planning de chantier retirés : l'assistante n'a que les devis et les tâches
  } else {
    window.R.setFactures([]); window.R.setProjets([]); window.R.setDevis([]);
    window.E.setTaches([]); window.E.setProjets([]); window.E.setChiffrage([]); window.E.setSuivi([]);
    if (ov) ov.style.display = 'flex';
  }
});
</script>

#rsheet-back{position:fixed;inset:0;background:rgba(3,8,18,.62);z-index:50;display:none}

  <div style="background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:16px;padding:34px 28px;max-width:360px;width:100%;text-align:center">

<script>
(function(){
'use strict';
/* ═══════════ RÉGLAGES ═══════════ */
// Tâches de gestion d'entreprise MASQUÉES à l'assistante (par catégorie). Vider la liste ([]) pour tout lui montrer.
var CATEGORIES_MASQUEES = ['Patrimoine / holding'];
var ADMIN_EMAIL = 'contact@phenixarchitecte.fr';
var NOMS = {}; // rempli depuis ASSIGNABLES juste après
// Personnes à qui l'assistante peut assigner une tâche (en plus d'elle-même). Ajouter les autres ici, p. ex. Kévin.
var ASSIGNABLES = [
  { email:'contact@phenixarchitecte.fr',   nom:'Maxime' },
  { email:'c.gironde@phenixarchitecte.fr', nom:'Cassandra' }
];
// [Accès] secours seulement : remplacée par les fiches phenix_users (Chantier › Équipe) quand elles sont lisibles
function majAssignables(fiches){
  var l = [{ email:'contact@phenixarchitecte.fr', nom:'Maxime' }];
  fiches.filter(function(f){ return f.actif !== false && ['admin','assistante','equipe','chantier'].indexOf(f.role) >= 0 && String(f.email).toLowerCase() !== 'contact@phenixarchitecte.fr'; })
    .forEach(function(f){ l.push({ email:String(f.email).toLowerCase(), nom:String(f.nom || '').trim() || String(f.email).split('@')[0] }); });
  ASSIGNABLES.length = 0; l.forEach(function(a){ ASSIGNABLES.push(a); });
  NOMS = {}; ASSIGNABLES.forEach(function(a){ NOMS[a.email.toLowerCase()] = a.nom; });
}
var STATUT_CHIFFRAGE = { Chiffrage:'En chiffrage', Valide:'Validé', Revision:'En révision' };
var STATUT_LOT = { chiffrage:'Chiffrage', ao:'Appel d\'offres', attribue:'Attribué', en_cours:'En cours', termine:'Terminé', reserve:'Réserves' };
var CATEGORIES_GESTION = ['Administratif / compta','Commercial / marketing','RH / équipe','Outils & logiciels','Patrimoine / holding'];
var PHASES = ['ESQ','APS','APD','PC','DCE','ACT','DET','AOR'];
var PHASE_LABELS = { ESQ:'Esquisse',APS:'Avant-Projet Sommaire',APD:'Avant-Projet Définitif',PC:'Permis de construire',DCE:'DCE',ACT:'Assistance Contrats',DET:'Direction travaux',AOR:'Réception travaux' };
var PRIO = { urgent:3, haute:2, normale:1 };

ASSIGNABLES.forEach(function(a){ NOMS[a.email.toLowerCase()] = a.nom; });
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var RESTREINT = /[?&]restreint=1/.test(location.search);
// [Accès] ?taches=1 : compte « tâches seulement » (alternante) — uniquement les tâches qui lui sont assignées, ni projets ni devis
var TACHES_SEULES = /[?&]taches=1/.test(location.search);
if (TACHES_SEULES) { try { document.documentElement.classList.add('solo'); } catch (e) {} }
var S = { me:'', taches:[], projets:[], chiffrage:{}, suivi:{}, v:(!TACHES_SEULES && (/#devis/.test(location.hash) || (RESTREINT && !/#taches/.test(location.hash)))) ? 'devis' : 'taches', filtre:'all', q:'', qp:'', projetId:null, tasksReady:false };

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return iso(new Date()); }
function dStr(t){ var v = t && t.date; if (!v) return ''; try { if (typeof v === 'string') { var s = v.slice(0,10); return isNaN(new Date(s)) ? '' : s; } if (typeof v.toDate === 'function') return iso(v.toDate()); } catch(e){} return ''; }
function fr(s){ if (!s) return ''; var p = s.split('-'); return p[2]+'/'+p[1]; }
function frL(s){ if (!s) return ''; var p = s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function nom(email){ email = String(email||'').toLowerCase(); if (!email) return ''; if (email === S.me) return 'Moi'; return NOMS[email] || (email.split('@')[0].replace(/^./, function(c){return c.toUpperCase();})); }
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function rid(p){ return p + '-' + Date.now() + '-' + Math.floor(Math.random()*1000); }

/* ═══════════ DONNÉES ═══════════ */
function visibles(){
  return S.taches.filter(function(t){
    if (!t || !t.titre) return false;
    if (t.type === 'gestion' && CATEGORIES_MASQUEES.indexOf(t.categorie) >= 0) return false;
    if (TACHES_SEULES && String(t.assigneA || '').toLowerCase() !== S.me) return false;
    return true;
  });
}
function projetDe(id){ for (var i=0;i<S.projets.length;i++) if (String(S.projets[i].id) === String(id)) return S.projets[i]; return null; }
function cmp(a,b){
  var td = todayISO(), da = dStr(a), db = dStr(b);
  var ra = da && da < td ? 0 : 1, rb = db && db < td ? 0 : 1;
  if (ra !== rb) return ra - rb;
  if (da !== db) { if (!da) return 1; if (!db) return -1; return da < db ? -1 : 1; }
  return (PRIO[b.priorite]||1) - (PRIO[a.priorite]||1);
}
function find(id){ for (var i=0;i<S.taches.length;i++) if (String(S.taches[i].id) === String(id)) return S.taches[i]; return null; }

/* ═══════════ ÉCRITURES ═══════════ */
function now(){ return new Date().toISOString(); }
async function patch(id, p){
  p.updatedAt = now();
  try { await window._fb.saveTache(id, p); return true; }
  catch(e){ toast('⚠️ Enregistrement impossible : ' + (e && e.code === 'permission-denied' ? 'accès refusé (règles Firestore)' : (e && e.message) || e)); return false; }
}
function jr(action, objet, libelle, extra){ try { if (window.phenixJournal) window.phenixJournal('espace', action, objet, libelle, extra); } catch(e){} }
function tp(t, detail){ var p = t && t.projetId ? projetDe(t.projetId) : null; return { projetId: t && t.projetId ? String(t.projetId) : '', projetNom: p ? (p.nom || p.client || '') : '', detail: detail || '' }; }
function autrui(email){ email = String(email||'').toLowerCase(); return email && email !== S.me ? email : ''; }
async function notif(type, t, texte, pour){
  try { await window._fb.saveNotifTache(rid('nt'), { type:type, tacheId:String(t.id), titre:t.titre||'', par:S.me, quand:now(), lu:false, texte:texte||'', pour:autrui(pour !== undefined ? pour : t.assigneA) }); }
  catch(e){ console.warn('Notification non enregistrée :', e); }
}
function ajouterIntervalle(d, freq, n){
  var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (freq === 'weekly') { r.setDate(r.getDate()+7*n); return r; }
  var mois = freq === 'monthly' ? n : freq === 'quarterly' ? 3*n : 12*n, jour = d.getDate();
  r.setDate(1); r.setMonth(r.getMonth()+mois);
  var dernier = new Date(r.getFullYear(), r.getMonth()+1, 0).getDate();
  r.setDate(Math.min(jour, dernier)); return r;
}
function prochaineDate(dateStr, freq){
  var today = new Date(); today.setHours(0,0,0,0);
  var base = today; if (dateStr) { var p = dateStr.split('-').map(Number); base = new Date(p[0], p[1]-1, p[2]); }
  var n = 1, next = ajouterIntervalle(base, freq, n);
  while (dateStr && next < today && n < 400) { n++; next = ajouterIntervalle(base, freq, n); }
  return iso(next);
}
async function terminer(id){
  var t = find(id); if (!t) return;
  var ok = await patch(id, { statut:'done', terminePar:S.me, termineLe:now() });
  if (!ok) return;
  t.statut = 'done';
  var msg = '✅ Tâche terminée.';
  if (t.recurrence && t.recurrence.freq && !t.recurrenceGeneree) {   // même règle que Dossier : prochaine occurrence, une seule fois
    var date = prochaineDate(dStr(t), t.recurrence.freq), n = now();
    var suivante = {}; Object.keys(t).forEach(function(k){ suivante[k] = t[k]; });
    suivante.id = 't-' + Date.now() + '-' + Math.floor(Math.random()*1000);
    suivante.statut = 'todo'; suivante.date = date; suivante.dateLivraison = date; suivante.recurrenceGeneree = false;
    suivante.createdAt = n; suivante.updatedAt = n; suivante.commentaires = []; delete suivante.terminePar; delete suivante.termineLe;
    try { await window._fb.saveTache(suivante.id, suivante); await window._fb.saveTache(id, { recurrenceGeneree:true }); msg = '✅ Terminée — prochaine échéance le ' + frL(date) + '.'; }
    catch(e){ console.warn(e); }
  }
  await notif('termine', t);
  jr('termine', 'tâche', t.titre, tp(t));
  toast(msg);
}
async function enCours(id){ var t = find(id); if (!t) return; if (await patch(id, { statut:'doing' })) { jr('demarre', 'tâche', t.titre, tp(t)); toast('▶ Tâche en cours.'); } }
async function rouvrir(id){ var t = find(id); if (!t) return; if (await patch(id, { statut:'todo' })) { jr('rouvre', 'tâche', t.titre, tp(t)); toast('↺ Tâche rouverte.'); } }
async function prendre(id){ var t = find(id); if (!t) return; if (await patch(id, { assigneA:S.me })) { jr('assigne', 'tâche', t.titre, tp(t, 'à elle-même')); toast('👤 Tâche assignée à vous.'); } }
async function assigner(id, email){
  var t = find(id); if (!t) return; email = String(email || '').toLowerCase();
  if (await patch(id, { assigneA:email })) {
    t.assigneA = email;
    await notif('assignee', t, '', email);
    jr('assigne', 'tâche', t.titre, tp(t, email ? 'à ' + (email === S.me ? 'elle-même' : nom(email)) : 'non assignée'));
    closeSheet(); toast(email ? '👤 Assignée à ' + nom(email) + '.' : 'Tâche non assignée.');
  }
}
function assignOptions(){   // Maxime, collègues, soi-même, personne — sans doublon
  var l = ASSIGNABLES.map(function(a){ return { email:a.email.toLowerCase(), nom:a.nom }; });
  if (S.me && !l.some(function(a){ return a.email === S.me; })) l.push({ email:S.me, nom:'Moi' });
  return l.map(function(a){ return a.email === S.me ? { email:a.email, nom:'Moi' } : a; });
}
function sheetAssigner(id){
  var t = find(id); if (!t) return;
  var cur = String(t.assigneA||'').toLowerCase();
  openSheet('<h2>Assigner la tâche</h2><div class="sub2">' + esc(t.titre) + '</div><div class="chips">' +
    assignOptions().map(function(a){ return '<button class="opt' + (cur === a.email ? ' sel' : '') + '" onclick="E.assigner(\'' + esc(id) + '\',\'' + esc(a.email) + '\')">' + esc(a.nom) + '</button>'; }).join('') +
    '<button class="opt' + (!cur ? ' sel a' : '') + '" onclick="E.assigner(\'' + esc(id) + '\',\'\')">Personne</button></div>' +
    '<div class="c-actions"><button class="btn ghost" onclick="E.closeSheet()">Annuler</button></div>');
}

/* ═══════════ FEUILLE DU BAS ═══════════ */
function openSheet(html){ $('sheet-in').innerHTML = html; $('sheet-back').style.display = 'block'; $('sheet').style.display = 'block'; }
function closeSheet(){ $('sheet-back').style.display = 'none'; $('sheet').style.display = 'none'; $('sheet-in').innerHTML = ''; }

function sheetNote(id){
  var t = find(id); if (!t) return;
  openSheet('<h2>Ajouter une note</h2><div class="sub2">' + esc(t.titre) + ' — Maxime la verra dans la tâche.</div>' +
    '<div class="fgroup"><textarea class="field" id="note-txt" placeholder="Ex. Client rappelé, rendez-vous pris jeudi 14h…"></textarea></div>' +
    '<div class="c-actions"><button class="btn primary" onclick="E.saveNote(\'' + esc(id) + '\')"><i class="ti ti-send"></i> Enregistrer</button><button class="btn ghost" onclick="E.closeSheet()">Annuler</button></div>');
  setTimeout(function(){ var x = $('note-txt'); if (x) x.focus(); }, 80);
}
async function saveNote(id){
  var t = find(id), txt = ($('note-txt').value || '').trim(); if (!t) return; if (!txt) { toast('Écrivez une note.'); return; }
  var coms = (t.commentaires || []).concat([{ par:S.me, quand:now(), texte:txt }]);
  if (await patch(id, { commentaires:coms })) { t.commentaires = coms; await notif('note', t, txt); jr('note', 'tâche', t.titre, tp(t)); closeSheet(); toast('💬 Note enregistrée.'); }
}

var NEW = null;
function sheetNouvelle(projetId){
  NEW = { rattach: projetId ? 'dossier' : 'dossier', prio:'normale', assigne:ADMIN_EMAIL, projetId: projetId ? String(projetId) : '' };
  renderNew();
}
function renderNew(){

/* ═══════════ RENDU : TÂCHES ═══════════ */
function carte(t, mine){
  var td = todayISO(), d = dStr(t), done = t.statut === 'done';
  var cls = done ? ' done' : (d && d < td ? ' retard' : d === td ? ' today' : d ? ' soon' : '');
  var p = t.projetId ? projetDe(t.projetId) : null;
  var chips = [];
  if (d) chips.push('<span class="chip ' + (!done && d < td ? 'red' : d === td ? 'amber' : '') + '">📅 ' + fr(d) + (!done && d < td ? ' · en retard' : d === td ? " · aujourd'hui" : '') + '</span>');
  if (t.priorite === 'urgent') chips.push('<span class="chip red">🔴 Urgente</span>'); else if (t.priorite === 'haute') chips.push('<span class="chip amber">🟡 Haute</span>');
  if (t.type === 'gestion') chips.push('<span class="chip violet">🗂 ' + esc(t.categorie || 'Gestion') + '</span>');
  else if (p) chips.push('<span class="chip blue" style="cursor:pointer" onclick="E.ouvrirProjet(\'' + esc(p.id) + '\')">🏗 ' + esc(p.nom || p.client) + '</span>');
  if (t.recurrence && t.recurrence.freq) chips.push('<span class="chip">🔁 récurrente</span>');
  if (t.statut === 'doing') chips.push('<span class="chip green">▶ en cours</span>');
  if (t.assigneA && !mine) chips.push('<span class="chip">👤 ' + esc(nom(t.assigneA)) + '</span>');
  if (!t.assigneA && !done) chips.push('<span class="chip amber">non assignée</span>');
  var coms = (t.commentaires || []).slice(-3).map(function(c){ return '<div><b>' + esc(nom(c.par)) + '</b> · ' + esc(String(c.quand||'').slice(0,10).split('-').reverse().join('/')) + ' — ' + esc(c.texte) + '</div>'; }).join('');
  var act = '';
  if (done) act = '<button class="btn sm" onclick="E.rouvrir(\'' + esc(t.id) + '\')"><i class="ti ti-rotate"></i> Rouvrir</button>';
  else {
    act = '<button class="btn green sm" onclick="E.terminer(\'' + esc(t.id) + '\')"><i class="ti ti-check"></i> Terminer</button>' +
          (t.statut !== 'doing' ? '<button class="btn sm" onclick="E.enCours(\'' + esc(t.id) + '\')"><i class="ti ti-player-play"></i> En cours</button>' : '') +
          (!t.assigneA || (t.assigneA||'').toLowerCase() !== S.me ? '<button class="btn sm" onclick="E.prendre(\'' + esc(t.id) + '\')"><i class="ti ti-user-plus"></i> Me l\'assigner</button>' : '') +
          '<button class="btn sm" onclick="E.assignerA(\'' + esc(t.id) + '\')"><i class="ti ti-users"></i> Assigner à…</button>';
  }
  act += '<button class="btn sm ghost" onclick="E.note(\'' + esc(t.id) + '\')"><i class="ti ti-message"></i> Note</button>';
  return '<div class="card' + cls + '"><div class="c-top"><div><div class="c-client">' + esc(t.titre) + '</div></div></div>' +
    (chips.length ? '<div class="c-meta">' + chips.join('') + '</div>' : '') +
    (t.desc ? '<div class="c-desc">' + esc(t.desc) + '</div>' : '') +
    (coms ? '<div class="coms">' + coms + '</div>' : '') +
    '<div class="c-actions">' + act + '</div></div>';
}
function passe(t){
  if (S.filtre === 'dossier' && t.type === 'gestion') return false;
  if (S.filtre === 'gestion' && t.type !== 'gestion') return false;
  if (S.q) { var p = t.projetId ? projetDe(t.projetId) : null; var h = (t.titre + ' ' + (t.desc||'') + ' ' + (t.categorie||'') + ' ' + (p ? (p.nom||'') + ' ' + (p.client||'') : '')).toLowerCase(); if (h.indexOf(S.q.toLowerCase()) < 0) return false; }
  return true;
}
function renderTaches(){
  var all = visibles(), td = todayISO();

  var mine = ouvertes.filter(function(t){ return String(t.assigneA||'').toLowerCase() === S.me; });
  var retard = mine.filter(function(t){ var d = dStr(t); return d && d < td; }).length;
  var auj = mine.filter(function(t){ return dStr(t) === td; }).length;
  var sem = new Date(); sem.setDate(sem.getDate()-7);

  var autres = ouvertes.filter(function(t){ return mine.indexOf(t) < 0; });
  var termin = all.filter(function(t){ return t.statut === 'done'; }).sort(function(a,b){ return String(b.updatedAt||'') < String(a.updatedAt||'') ? -1 : 1; }).slice(0, 12);
  var h = '<div class="kpis"><div class="kpi"><div class="v">' + mine.length + '</div><div class="l">Mes tâches ouvertes</div></div>' +
    '<div class="kpi ' + (retard ? 'red' : '') + '"><div class="v">' + retard + '</div><div class="l">En retard</div></div>' +
    '<div class="kpi ' + (auj ? 'amber' : '') + '"><div class="v">' + auj + '</div><div class="l">Pour aujourd\'hui</div></div>' +
    '<div class="kpi green"><div class="v">' + faites + '</div><div class="l">Terminées (7 j)</div></div></div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:10px"><input class="search" style="margin:0;flex:1" id="q" placeholder="Rechercher une tâche, un projet…" value="' + esc(S.q) + '" oninput="E.setQ(this.value)"><button class="btn primary" onclick="E.nouvelle()"><i class="ti ti-plus"></i> Tâche</button></div>';
  h += '<div class="filters">' + [['all','Toutes'],['dossier','Dossiers'],['gestion','Gestion']].map(function(f){ return '<button class="opt' + (S.filtre === f[0] ? ' sel' : '') + '" onclick="E.setFiltre(\'' + f[0] + '\')">' + f[1] + '</button>'; }).join('') + '</div>';
  var m = mine.filter(passe).sort(cmp), a = autres.filter(passe).sort(cmp);
  h += '<div class="sec-title"><span>Mes tâches (' + m.length + ')</span></div>';
  h += m.length ? m.map(function(t){ return carte(t, true); }).join('') : '<div class="empty"><div class="big">🎉</div>Aucune tâche ne vous est assignée.</div>';
  h += '<div class="sec-title"><span>Autres tâches (' + a.length + ') — pour prendre des initiatives</span></div>';
  h += a.length ? a.map(function(t){ return carte(t, false); }).join('') : '<div class="empty">Rien d\'autre en cours.</div>';
  if (termin.length) { h += '<div class="sec-title"><span>Dernières terminées</span></div>' + termin.filter(passe).map(function(t){ return carte(t, false); }).join(''); }
  $('view').innerHTML = h;
  $('n-taches').textContent = mine.length;

/* ═══════════ CHIFFRAGE / SUIVI DE CHANTIER ═══════════ */
function fmtE(n){ try { return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n || 0); } catch(e){ return Math.round(n || 0) + ' €'; } }
function normNom(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ''); }
// Clé de rapprochement d'un lot entre Chiffrage et Chantier : son numéro (« LOT 03 » → 3), sinon son nom.
function cleLot(num, nomLot){
  var m = String(num||'').match(/(\d+)\s*([A-Za-z])?\s*$/) || String(nomLot||'').match(/lot\s*(?:n°|no|n)?\s*0*(\d+)\s*([A-Za-z])?(?![A-Za-z0-9])/i) || String(nomLot||'').match(/^\s*0*(\d+)\s*([A-Za-z])?\s*[—–:\-.)]/);
  return m ? ('n' + parseInt(m[1], 10) + (m[2] || '').toUpperCase()) : ('t' + normNom(nomLot || num));
}
function etatLots(pid){
  pid = String(pid);
  var c = S.chiffrage[pid] || null, s = S.suivi[pid] || null, parCle = {}, lots = [];
  if (s) (s.lots || []).forEach(function(l){ parCle[cleLot('', l.nom)] = l; });
  function fusion(base, sl){
    var ent = base.entreprise || (sl && sl.entreprise) || '', devis = !!base.devisArtisan || !!(sl && sl.devisArtisan);
    base.entreprise = ent; base.etat = ent ? 'ok' : (devis ? 'devis' : 'aucune'); return base;
  }
  if (c) (c.lots || []).forEach(function(l){ lots.push(fusion({ num:l.num, nom:l.nom, statut:l.statut, entreprise:l.entreprise, devisArtisan:l.devisArtisan, ht:l.montantHt, ttc:l.montantTtc }, parCle[cleLot(l.num, l.nom)])); });
  else if (s) (s.lots || []).forEach(function(l){ lots.push(fusion({ num:'', nom:l.nom, statut:'', entreprise:l.entreprise, devisArtisan:l.devisArtisan }, null)); });
  return { chiffrage:c, suivi:s, lots:lots,
           sans: lots.filter(function(l){ return l.etat === 'aucune'; }),
           devis: lots.filter(function(l){ return l.etat === 'devis'; }) };
}
function badgeEnt(l){
  if (l.etat === 'ok') return '<span class="chip">🏢 ' + esc(l.entreprise) + '</span>';
  if (l.etat === 'devis') return '<span class="chip amber">Devis reçu — entreprise à préciser</span>';
  return '<span class="chip red">⚠ Aucune entreprise sur ce lot</span>';
}
function nomsLots(l){ return l.map(function(x){ return String(x.nom || x.num || ''); }).join(', '); }
function phraseChiffrage(e){
  if (!e.lots.length) return '';
  var n = e.lots.length, manq = e.sans.length + e.devis.length;
  var s = 'Le chiffrage porte sur ' + n + ' lot' + (n > 1 ? 's' : '') + (e.chiffrage ? ' (' + fmtE(e.chiffrage.totalHt) + ' HT à ce jour)' : '') + '. ';
  if (!manq) return s + 'Une entreprise est identifiée pour chaque lot.';
  s += (n - manq) + ' lot' + (n - manq > 1 ? 's ont' : ' a') + ' une entreprise identifiée. ';
  if (e.sans.length) s += 'Il manque encore une entreprise pour : ' + nomsLots(e.sans) + '. ';
  if (e.devis.length) s += 'Devis reçu mais entreprise à préciser pour : ' + nomsLots(e.devis) + '.';
  return s.trim();
}
function majLe(iso){ var s = String(iso||''); if (!s) return ''; var d = new Date(s); if (isNaN(d)) return ''; return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function renderChiffrage(p){
  if (RESTREINT) return '';   // [Accès] l'assistante ne voit pas le chiffrage par lot : seulement ses devis à relancer et ses tâches
  var e = etatLots(p.id);
  if (!e.chiffrage && !e.suivi) return '<div class="sec-title"><span>Chiffrage</span></div><div class="box"><div class="info vide">Pas encore de chiffrage transmis pour ce dossier.</div></div>';
  var h = '<div class="sec-title"><span>Chiffrage' + (e.chiffrage ? ' — ' + esc(e.chiffrage.chantierNom || '') : '') + '</span></div>';
  if (e.lots.length) {
    if (e.sans.length) h += '<div class="alerte"><b>⚠ ' + e.sans.length + ' lot' + (e.sans.length > 1 ? 's' : '') + ' sans entreprise :</b> ' + esc(nomsLots(e.sans)) + '.</div>';
    if (e.devis.length) h += '<div class="alerte ora"><b>' + e.devis.length + ' lot' + (e.devis.length > 1 ? 's' : '') + ' avec devis reçu</b>, entreprise à préciser : ' + esc(nomsLots(e.devis)) + '.</div>';
    if (!e.sans.length && !e.devis.length) h += '<div class="alerte ok">✓ Une entreprise est identifiée sur chaque lot.</div>';
    h += '<div class="dire"><small>Pour répondre au téléphone</small>' + esc(phraseChiffrage(e)) + '</div>';
  }
  if (e.chiffrage) {
    h += '<div class="box">' + (e.lots.length ? e.lots.map(function(l){
      return '<div class="lot"><div class="lot-h"><span><b>' + esc(l.num || '') + '</b>' + esc(l.nom) + '</span></div><div class="lot-m">' +
        (l.statut ? '<span class="chip blue">' + esc(STATUT_CHIFFRAGE[l.statut] || l.statut) + '</span>' : '') + badgeEnt(l) +
        '<span class="lot-ht">' + fmtE(l.ht) + ' HT</span></div></div>';
    }).join('') : '<div class="info vide">Aucun lot chiffré pour l\'instant.</div>') +
    (e.lots.length ? '<div class="kv" style="margin-top:6px"><span><b style="color:#fff">Total client</b></span><span><b style="color:#fff">' + fmtE(e.chiffrage.totalHt) + ' HT · ' + fmtE(e.chiffrage.totalTtc) + ' TTC</b></span></div>' : '') +
    '</div>' + (e.chiffrage.updatedAt ? '<div class="c-objet" style="margin-top:6px">Chiffrage mis à jour le ' + esc(majLe(e.chiffrage.updatedAt)) + '</div>' : '');
  } else {
    h += '<div class="box">' + e.lots.map(function(l){ return '<div class="lot"><div class="lot-h"><span>' + esc(l.nom) + '</span></div><div class="lot-m">' + badgeEnt(l) + '</div></div>'; }).join('') + '</div>';
  }
  if (e.suivi && (e.suivi.lots || []).length) {
    var td = todayISO();
    h += '<div class="sec-title"><span>Suivi de chantier</span></div><div class="box">' + e.suivi.lots.map(function(l){
      var av = Math.max(0, Math.min(100, parseFloat(l.av) || 0)), retard = l.fin && l.fin < td && l.statut !== 'termine';
      var ent = l.entreprise ? { etat:'ok', entreprise:l.entreprise } : (l.devisArtisan ? { etat:'devis' } : { etat:'aucune' });
      return '<div class="lot"><div class="lot-h"><span>' + esc(l.nom) + '</span><span class="chip ' + (l.statut === 'termine' ? 'green' : l.statut === 'en_cours' ? 'amber' : 'blue') + '">' + esc(STATUT_LOT[l.statut] || l.statut || '—') + '</span></div>' +
        '<div class="lot-m">' + badgeEnt(ent) + (l.debut ? '<span class="chip">' + frL(l.debut) + (l.fin ? ' → ' : '') + (l.fin ? '<span' + (retard ? ' style="color:var(--red)"' : '') + '>' + frL(l.fin) + '</span>' : '') + '</span>' : '') + '</div>' +
        '<div class="bar" style="margin-top:7px"><i style="width:' + av + '%"></i></div><div class="c-objet" style="margin-top:3px">Avancement : ' + av + ' %</div></div>';
    }).join('') + '</div>' + (e.suivi.updatedAt ? '<div class="c-objet" style="margin-top:6px">Suivi mis à jour le ' + esc(majLe(e.suivi.updatedAt)) + '</div>' : '');
  }
  return h;
}

/* ═══════════ RENDU : PROJETS ═══════════ */

function kv(a, b){ return '<div class="kv"><span>' + a + '</span><span>' + (b || '—') + '</span></div>'; }
function bloc(titre, txt){ var v = String(txt||'').trim(); return '<div class="box"><h3>' + titre + '</h3><div class="info' + (v ? '' : ' vide') + '">' + (v ? esc(v) : 'À renseigner par Maxime') + '</div></div>'; }
function renderFiche(){

  var ech = (p.echeances || []).filter(function(e){ return e.date >= td; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(0, 8);
  var echH = ech.length ? ech.map(function(e){ return kv(frL(e.date) + (e.heure ? ' ' + esc(e.heure) : ''), esc(e.desc || e.type)); }).join('') : '<div class="info vide">Aucune échéance à venir.</div>';

    (p.maj ? '<div class="c-objet" style="margin-top:14px;text-align:center">Fiche synchronisée le ' + esc(String(p.maj).slice(0,10).split('-').reverse().join('/')) + '</div>' : '');
  $('view').innerHTML = h;

}

/* ═══════════ ORCHESTRATION ═══════════ */

window.E = {

  },

    window.open('phenix_financement.html?projet=' + encodeURIComponent(p.id), '_blank');

<!-- ═══ Onglet « Devis à relancer » (ex-phenix_relances.html) ═══ -->
<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════
   PHÉNIX RELANCES — file de relance des devis en attente
   Source : collection phenix_factures (type 'devis', statut 'en_attente')
   Contacts : collection phenix_projets (client, email, tel)
   Les relances sont écrites DANS le devis (champs relance*), pour rester
   visibles dans Dossier et ne créer aucune nouvelle collection.
   ════════════════════════════════════════════════════════════ */

var DEFAULT_CFG = { cadence:[3,10,21], cloture:45, ecartMin:4, signature:'Phénix-Architecture · 04 73 73 00 59' };
var CFG_KEY = 'phenix_relances_cfg';
var PROXY = 'https://phenix-proxy.phenixarchitecte.workers.dev';

var FACTURES = [], PROJETS = [], DEVIS = [], NOTIFS = [], ME = '', LOADED = { f:false, p:false, d:false };
var RESTREINT = /[?&]restreint=1/.test(location.search);   // compte « Relances seulement » (secrétaire)
var tab = 'todo', search = '', openIds = {};
var CFG = loadCfg();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ── Réglages (stockés sur l'appareil) ── */
function loadCfg(){
  var c = JSON.parse(JSON.stringify(DEFAULT_CFG));
  try {
    var raw = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if (raw) {
      if (Array.isArray(raw.cadence) && raw.cadence.length) c.cadence = raw.cadence.map(Number).filter(function(n){ return n > 0; });
      if (raw.cloture > 0) c.cloture = Number(raw.cloture);
      if (raw.ecartMin >= 0) c.ecartMin = Number(raw.ecartMin);
      if (typeof raw.signature === 'string' && raw.signature.trim()) c.signature = raw.signature.trim();
    }
  } catch(e) {}
  if (!c.cadence.length) c.cadence = DEFAULT_CFG.cadence.slice();
  return c;
}

/* ── Dates (toujours en AAAA-MM-JJ local) ── */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return window.__TODAY || iso(new Date()); }
function parseISO(s){ var p = String(s).slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s, n){ var d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
function normDate(v){
  if (!v) return '';
  try {
    if (typeof v === 'string') {
      if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
      var m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
      return '';
    }
    if (typeof v.toDate === 'function') return iso(v.toDate());
    if (typeof v.seconds === 'number') return iso(new Date(v.seconds*1000));
  } catch(e) {}
  return '';
}
function fmtDate(s){ if (!s) return '—'; var p = s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtDateShort(s){ if (!s) return '—'; var p = s.split('-'); return p[2]+'/'+p[1]; }
function euros(n){ return (Math.round(n)||0).toLocaleString('fr-FR') + ' €'; }
function ago(days){ return days <= 0 ? "aujourd'hui" : days === 1 ? 'hier' : 'il y a ' + days + ' j'; }

/* ── Cœur : quelle est la prochaine action sur ce devis ? ──
   - relance n°k à J+cadence[k] depuis l'envoi (jamais moins de ecartMin jours après la précédente)
   - une fois la cadence épuisée, ou si le devis a dépassé « cloture » jours : décision de clôture
   - une date « à rappeler » saisie à la main prime sur tout le reste */
function etat(f, today, cfg){
  var base = normDate(f.dateEnvoi) || normDate(f.dateEmission);
  var nb = parseInt(f.relanceNb, 10) || 0;
  var der = normDate(f.relanceDerniere);
  if (!base) return { type:'completer', base:'', nb:nb, der:der, due:'', age:0, retard:0, jours:0, bucket:'later' };
  var age = diffDays(today, base);
  var gap = der ? addDays(der, cfg.ecartMin) : '';
  var man = normDate(f.relanceProchaine);
  var type = 'relance', due;
  if (man) { due = man; }
  else if (age >= cfg.cloture) { type = 'cloture'; due = addDays(base, cfg.cloture); if (gap && gap > due) due = gap; }
  else if (nb < cfg.cadence.length) { due = addDays(base, cfg.cadence[nb]); if (gap && gap > due) due = gap; }
  else { type = 'cloture'; due = addDays(base, cfg.cloture); if (gap && gap > due) due = gap; }
  var jours = diffDays(due, today);            // >0 : dans le futur ; <0 : en retard
  var bucket = jours < 0 ? 'retard' : jours === 0 ? 'today' : jours <= 7 ? 'soon' : 'later';
  return { type:type, base:base, age:age, nb:nb, der:der, due:due, retard:Math.max(0,-jours), jours:jours, bucket:bucket };
}

function projetDe(f){
  for (var i=0;i<PROJETS.length;i++) if (String(PROJETS[i].id) === String(f.projetId)) return PROJETS[i];
  return null;
}
function ttc(f){
  var ht = parseFloat(f.montantHt) || 0;
  var t = parseFloat(f.montantTtcDevis); if (t > 0) return t;
  var tva = (f.tva === undefined || f.tva === '' || f.tva === null) ? 20 : parseFloat(f.tva);
  return ht * (1 + (isNaN(tva) ? 20 : tva) / 100);
}
/* Deux sources, une même file :
   - 'dec'  : collection phenix_devis_en_cours (devis envoyés, pas encore signés — pas de projet)
   - 'fact' : devis de Dossier restés « en attente » (ex. devis complémentaire d'un client existant) */
function allItems(){
  var out = [];
  DEVIS.forEach(function(d){ if (d) out.push({ src:'dec', f:d, p:null }); });
  FACTURES.forEach(function(f){ if (f && f.type === 'devis') out.push({ src:'fact', f:f, p:projetDe(f) }); });
  return out;
}
function statutNorm(it){
  var s = it.f.statut;
  if (it.src === 'dec') return s === 'signe' ? 'accepte' : s === 'perdu' ? 'refuse' : 'en_attente';
  return s || 'en_attente';
}
function estEnAttente(it){ return statutNorm(it) === 'en_attente'; }
function contact(it){
  if (it.src === 'dec') return { tel: it.f.tel || '', email: it.f.email || '' };
  return { tel: (it.p && it.p.tel) || '', email: (it.p && it.p.email) || '' };
}

function queue(){
  var today = todayISO();
  return allItems().filter(estEnAttente).map(function(it){
    it.e = etat(it.f, today, CFG);
    return it;
  });
}
function ordre(a, b){
  // Tri automatique, uniquement par date (jamais par montant), du plus ancien au plus récent.
  // 1) les devis À RAPPELER maintenant (relance due ou en retard) passent en premier ;
  //    puis ceux dont la relance est à venir ; puis ceux sans date d'envoi.
  // 2) à l'intérieur de chaque groupe : par date de référence, la plus ancienne en haut :
  //    - devis jamais relancé : date du devis
  //    - devis déjà appelé (en attente de réponse) : date de son dernier appel → il redescend
  //      derrière les devis pas encore contactés, puis remonte au fil des jours
  var rk = function(x){ return x.e.type === 'completer' ? 2 : (x.e.bucket === 'retard' || x.e.bucket === 'today') ? 0 : 1; };
  var ga = rk(a), gb = rk(b);
  if (ga !== gb) return ga - gb;
  var da = a.e.der || a.e.base || '', db = b.e.der || b.e.base || '';
  if (da !== db) { if (!da) return 1; if (!db) return -1; return da < db ? -1 : 1; }
  var ba = a.e.base || '', bb = b.e.base || '';
  if (ba !== bb) { if (!ba) return 1; if (!bb) return -1; return ba < bb ? -1 : 1; }
  return 0;
}
function nomClient(it){
  if (it.src === 'dec') return it.f.client || 'Client sans nom';
  var p = it.p; var c = p && (p.client || p.nom);
  return c || it.f.client || 'Client sans nom';
}
function matchSearch(it, q){
  if (!q) return true;
  q = q.toLowerCase();
  var hay = [nomClient(it), it.f.numero, it.f.objet, it.f.email, it.p && it.p.nom, it.p && it.p.ref, it.p && it.p.email].join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

/* ── Rendu ── */
function render(){
  var q = queue().sort(ordre);
  var aFaire = q.filter(function(i){ return i.e.bucket==='retard' || i.e.bucket==='today'; });
  var retard = q.filter(function(i){ return i.e.bucket==='retard'; });
  var soon = q.filter(function(i){ return i.e.bucket==='soon'; });
  var enJeu = q.reduce(function(s,i){ return s + (parseFloat(i.f.montantHt)||0); }, 0);
  var st = bilan();

  $('subtitle').textContent = !(LOADED.f && LOADED.p && LOADED.d) ? 'Chargement des devis…' :
    q.length + ' devis en attente de signature · ' + aFaire.length + ' à relancer';
  renderConv(); renderNotifs();

  $('kpis').innerHTML =
    kpi(aFaire.length, 'À relancer', aFaire.length ? 'amber' : 'green') +
    kpi(retard.length, 'En retard', retard.length ? 'red' : '') +
    kpi(euros(enJeu), 'En attente (HT)', '') +
    kpi(st.relances.n ? st.relances.taux + ' %' : '—', 'Signés après relance', st.relances.n ? 'green' : '');

  $('rtabs').innerHTML =
    tabBtn('todo', 'À relancer', aFaire.length) + tabBtn('soon', 'À venir', soon.length) +
    tabBtn('all', 'Tous', q.length) + tabBtn('clos', 'Clôturés', null) + tabBtn('bilan', 'Bilan', null);

  var html = '';
  if (tab === 'bilan') { html = renderBilan(st); }
  else if (tab === 'clos') {
    var cl = clotures().filter(function(i){ return matchSearch(i, search); });
    html = cl.length ? '<div class="note" style="margin:0 0 10px">Devis refusés depuis ce module. Un clic sur « En attente » remet le devis dans la file.</div>' + cl.map(cardClos).join('')
                     : '<div class="empty"><div class="big">📭</div>Aucun devis clôturé pour l\'instant.</div>';
  } else {
    var src = tab === 'todo' ? aFaire : tab === 'soon' ? soon : q;
    src = src.filter(function(i){ return matchSearch(i, search); });
    if (tab === 'todo') {
      var manquants = q.filter(function(i){ return i.e.type==='completer' && matchSearch(i, search); });
      if (manquants.length) src = src.concat(manquants);
    }
    if (!src.length) {
      html = '<div class="empty"><div class="big">' + (tab==='todo' ? '🎉' : '📭') + '</div>' +
        (tab==='todo' ? (q.length ? "Rien à relancer aujourd'hui." : 'Aucun devis en attente. Ajoutez-en un avec « ＋ Nouveau ».') :
         tab==='soon' ? 'Aucune relance prévue dans les 7 prochains jours.' : 'Aucun devis en attente. Ajoutez-en un avec « ＋ Nouveau ».') + '</div>';
    } else {
      html = src.map(card).join('');
    }
  }
  $('list').innerHTML = html;
  $('search').style.display = tab === 'bilan' ? 'none' : '';
}
function kpi(v, l, cls){ return '<div class="kpi ' + (cls||'') + '"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }
function tabBtn(k, l, n){ return '<button class="tab ' + (tab===k?'active':'') + '" data-act="tab" data-tab="' + k + '">' + l + (n===null?'':'<span class="n">'+n+'</span>') + '</button>'; }

/* ── Lignes du devis (dépliable) ── */
function lignesDe(f){ return Array.isArray(f.lignes) ? f.lignes.filter(function(l){ return l && typeof l === 'object'; }) : []; }
function numL(x){ var n = parseFloat(String(x == null ? '' : x).replace(',', '.')); return isFinite(n) ? n : 0; }
function qteFmt(n){ return (Math.round(n * 100) / 100).toLocaleString('fr-FR'); }
function eur2(n){ return (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €'; }
function lignesHtml(f){
  var L = lignesDe(f);
  if (!L.length) return '<span class="lbl">Contenu du devis</span><div class="note" style="margin:0 0 14px">Aucune ligne enregistrée pour ce devis' + (RESTREINT ? '.' : ' : modifiez le devis et importez le PDF pour les relever.') + '</div>';
  var h = '<span class="lbl">Contenu du devis · ' + L.length + ' ligne' + (L.length > 1 ? 's' : '') + '</span><div class="dl">';
  L.forEach(function(l){
    var lib = String(l.libelle || l.designation || l.description || l.label || l.titre || '').trim();
    var qte = numL(l.qte != null ? l.qte : l.quantite), pu = numL(l.puHt != null ? l.puHt : (l.pu != null ? l.pu : l.prixUnitaire));
    var mt = numL(l.montantHt != null ? l.montantHt : (l.totalHt != null ? l.totalHt : l.total));
    if (!mt && qte && pu) mt = qte * pu;
    var unite = String(l.unite || l.unit || '').trim();
    if (!lib && !mt) return;
    if (!mt && !qte && !pu) { h += '<div class="dl-row titre"><div class="lib">' + esc(lib) + '</div></div>'; return; }
    var det = (qte ? qteFmt(qte) + (unite ? ' ' + esc(unite) : '') : '') + (qte && pu ? ' × ' + eur2(pu) : '');
    h += '<div class="dl-row"><div class="lib">' + esc(lib || '—') + (det ? '<span class="det">' + det + '</span>' : '') + '</div><div class="mt">' + (mt ? eur2(mt) : '') + '</div></div>';
  });
  var ht = numL(f.montantHt), t = ttc(f);
  h += '<div class="dl-row dl-tot"><div class="lib">Total HT</div><div class="mt">' + eur2(ht) + '</div></div>' +
       '<div class="dl-row dl-tot"><div class="lib">Total TTC</div><div class="mt">' + eur2(t) + '</div></div></div>';
  return h;
}

function card(it){
  var f = it.f, p = it.p, e = it.e;
  var id = String(f.id);
  var isOpen = !!openIds[id];
  var cls = e.type === 'completer' ? '' : e.type === 'cloture' && e.bucket !== 'later' ? 'cloture' : e.bucket === 'later' ? '' : e.bucket;
  var chips = '';
  if (e.type === 'completer') chips += '<span class="chip red">Date d\'envoi manquante</span>';
  else {
    if (e.bucket === 'retard') chips += '<span class="chip red">En retard de ' + e.retard + ' j</span>';
    else if (e.bucket === 'today') chips += '<span class="chip amber">À relancer aujourd\'hui</span>';
    else if (e.bucket === 'soon') chips += '<span class="chip blue">Dans ' + e.jours + ' j (' + fmtDateShort(e.due) + ')</span>';
    else chips += '<span class="chip">Prévue le ' + fmtDateShort(e.due) + '</span>';
    if (e.type === 'cloture') chips += '<span class="chip violet">Dernière relance ou clôture</span>';
    else chips += '<span class="chip blue">Relance n°' + (e.nb + 1) + '</span>';
    chips += '<span class="chip">Devis du ' + fmtDate(e.base) + ' · ' + ago(e.age) + '</span>';
    if (e.der) chips += '<span class="chip">Dernière relance le ' + fmtDate(e.der) + '</span>';

/* ── Notifications : « la secrétaire a changé le statut d'un devis » ── */
var STATUT_LABEL = { en_attente:'En attente', refuse:'Refusé', accepte:'Signé' };
function normStatut(src, s){
  if (src === 'dec') return s === 'signe' ? 'accepte' : s === 'perdu' ? 'refuse' : 'en_attente';

}
function notifierStatut(it, avant, apres, motif){

  try { window._fb.saveNotif(n.id, JSON.parse(JSON.stringify(n))).catch(function(e){ console.warn('Notification non enregistrée :', e); }); }

}
function fmtQuand(iso){

function iso10(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function qui(par){ var x = String(par || '').split('@')[0]; return x ? x.charAt(0).toUpperCase() + x.slice(1) : 'La secrétaire'; }

var RESULTATS = [
  { k:'noans',    l:'Pas de réponse',     cls:'' },
  { k:'callback', l:'À rappeler',         cls:'', ask:3 },
  { k:'think',    l:'Veut réfléchir',     cls:'', ask:7 },

function canalIcon(c){ return c === 'tel' ? '📞' : c === 'mail' ? '✉️' : c === 'sms' ? '💬' : '•'; }
function resLabel(k){ for (var i=0;i<RESULTATS.length;i++) if (RESULTATS[i].k === k) return RESULTATS[i].l; return k || ''; }

/* ── Bilan : taux de signature des devis relancés vs non relancés (indicatif) ── */
function bilan(){
  var today = todayISO();
  var limite = addDays(today, -365);
  var rel = { n:0, signes:0 }, non = { n:0, signes:0 };
  var clos = [];
  allItems().forEach(function(it){
    var f = it.f;
    var base = normDate(f.dateEnvoi) || normDate(f.dateEmission);
    if (!base || base < limite) return;
    var histo = Array.isArray(f.relanceHisto) ? f.relanceHisto : [];
    var relance = (parseInt(f.relanceNb,10) || 0) > 0 || histo.length > 0;
    var g = relance ? rel : non;
    var statut = statutNorm(it);
    // on ne compte que les devis « tranchés » ou assez anciens pour l'être
    var tranche = statut === 'accepte' || statut === 'refuse' || diffDays(today, base) >= CFG.cloture;
    if (!tranche) return;
    g.n++; if (statut === 'accepte') g.signes++;
    if (relance && ((statut === 'accepte' && !RESTREINT) || statut === 'refuse')) clos.push(it);
  });
  rel.taux = rel.n ? Math.round(rel.signes / rel.n * 100) : 0;
  non.taux = non.n ? Math.round(non.signes / non.n * 100) : 0;
  clos.sort(function(a,b){ return (normDate(b.f.dateAcceptation||b.f.dateCloture)||'') < (normDate(a.f.dateAcceptation||a.f.dateCloture)||'') ? -1 : 1; });
  return { relances:rel, non:non, clos:clos.slice(0, 12) };
}
function renderBilan(st){
  function ligne(titre, g, color){
    return '<div class="line"><div style="flex:1"><div>' + titre + '</div><div class="bar"><i style="width:' + g.taux + '%;background:' + color + '"></i></div></div>' +
      '<div style="text-align:right;white-space:nowrap"><b style="color:#fff;font-size:16px">' + (g.n ? g.taux + ' %' : '—') + '</b><div style="font-size:11px;color:var(--text3)">' + g.signes + ' / ' + g.n + ' devis</div></div></div>';
  }
  var h = '<div class="bilan"><span class="lbl">Taux de signature — devis des 12 derniers mois</span>' +
    ligne('Devis relancés', st.relances, 'var(--green)') + ligne('Devis jamais relancés', st.non, 'var(--accent)') +
    '<div class="note">Indicatif : seuls les devis signés, refusés ou plus anciens que ' + CFG.cloture + ' jours sont comptés. Il faut quelques mois de données pour que la comparaison soit significative.</div></div>';
  h += '<div class="sec-title">Dernières relances aboutées</div>';
  if (!st.clos.length) h += '<div class="empty" style="padding:20px">Aucun devis relancé puis clôturé pour le moment.</div>';
  else h += st.clos.map(function(it){
    var f = it.f; var ok = statutNorm(it) === 'accepte';
    return '<div class="card" style="border-left-color:' + (ok ? 'var(--green)' : 'var(--red)') + '"><div class="c-top"><div><div class="c-client" style="font-size:14px">' + esc(nomClient(it)) + '</div>' +
      '<div class="c-objet">' + esc(f.numero||'') + (f.objet ? ' · ' + esc(f.objet) : '') + '</div></div>' +
      '<div class="c-amt">' + euros(parseFloat(f.montantHt)||0) + '<small>HT</small></div></div><div class="c-meta"><span class="chip ' + (ok?'green':'red') + '">' + (ok ? 'Signé' : 'Perdu' + (f.motifPerte ? ' · ' + esc(f.motifPerte) : '')) + '</span>' +
      '<span class="chip">' + (parseInt(f.relanceNb,10)||0) + ' relance(s)</span></div>' +
      (ok ? '' : '<div class="c-actions"><button class="btn" data-act="reopen" data-id="' + esc(String(f.id)) + '">↺ Rouvrir</button></div>') + '</div>';
  }).join('');
  return h;
}

/* ── Feuilles (fenêtres du bas) ── */
var sheetState = null;
function openSheet(html){ $('rsheet-inner').innerHTML = html; $('rsheet').style.display = 'block'; $('rsheet-back').style.display = 'block'; $('rsheet').scrollTop = 0; }
function closeSheet(){ $('rsheet').style.display = 'none'; $('rsheet-back').style.display = 'none'; sheetState = null; }
function findItem(id){
  var all = allItems();
  for (var i=0;i<all.length;i++) if (String(all[i].f.id) === String(id)) { all[i].e = etat(all[i].f, todayISO(), CFG); return all[i]; }

function renderConsigner(){

  h += '<div class="row" style="margin-top:4px"><button class="btn ghost" data-act="closesheet">Annuler</button><button class="btn primary" data-act="s-save">Enregistrer</button></div>';

async function saveConsigner(){
  var s = sheetState; if (!s) return;
  var it = findItem(s.id); if (!it) return;
  var f = it.f, today = todayISO();
  var res = RESULTATS.filter(function(x){ return x.k === s.res; })[0];
  var note = ($('s-note') && $('s-note').value || '').trim();
  var date = $('s-date') ? $('s-date').value : '';
  if (res.ask) {
    if (!date) { toast('⚠️ Choisissez une date.'); return; }
    if (date < today) { toast('⚠️ La date doit être aujourd\'hui ou plus tard.'); return; }
  }
  if (res.k === 'signed' && !confirm('Marquer ce devis comme SIGNÉ ?')) return;
  var motif = $('s-motif') ? $('s-motif').value : '';
  if (res.k === 'lost' && !confirm('Clôturer ce devis (perdu / sans suite) ?')) return;

  var entry = { d: new Date().toISOString(), canal: s.canal, res: s.res, note: note, par: ME };
  var histo = (Array.isArray(f.relanceHisto) ? f.relanceHisto : []).concat([entry]);
  var ST = it.src === 'dec' ? { ok:'signe', ko:'perdu' } : { ok:'accepte', ko:'refuse' };
  var patch = { relanceHisto: histo, relanceNb: (parseInt(f.relanceNb,10)||0) + 1, relanceDerniere: today, relanceProchaine: res.ask ? date : '' };
  if (res.k === 'signed') { patch.statut = ST.ok; patch.dateAcceptation = today; patch.relanceProchaine = ''; }

function preparerFichier(file){

    if (pdf) {
      var r = new FileReader();
      r.onload = function(e){ resolve({ base64: String(e.target.result).split(',')[1], mediaType:'application/pdf', pdf:true }); };
      r.onerror = function(){ reject(new Error('Lecture du fichier impossible')); };

      var w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      var q = 0.88, out = cv.toDataURL('image/jpeg', q);

    };

    if (dup && !confirm('Un devis « ' + numero + ' » existe déjà (' + (dup.client || '') + '). Enregistrer quand même ?')) return;
  }
  if (!(d.tel || '').trim() && !(d.email || '').trim() && !confirm('Ni téléphone ni e-mail pour ce client : impossible de le relancer. Enregistrer quand même ?')) return;
  var tvaN = parseFloat(d.tva); var tva = isFinite(tvaN) ? tvaN : 20;
  var id = sheetState.id || ('dec-' + Date.now());
  var doc = { id:id, client:client, tel:(d.tel||'').trim(), email:(d.email||'').trim(), adresse:(d.adresse||'').trim(), objet:(d.objet||'').trim(), numero:numero,
              montantHt:ht, tva:tva, dateEnvoi:date, dateEmission:date };
  if (d.lignes && d.lignes.length) doc.lignes = d.lignes;
  if (!sheetState.id) { doc.statut = 'en_cours'; doc.relanceNb = 0; doc.relanceHisto = []; doc.createdAt = new Date().toISOString(); doc.createdBy = ME; }
  doc = JSON.parse(JSON.stringify(doc));
  try {
    if (!window._fb) throw new Error('Connexion Firebase indisponible');
    await window._fb.saveDevisEnCours(id, doc);
    var _nouveau = !!doc.statut; closeSheet(); toast(_nouveau ? '✅ Devis ajouté à la file.' : '✅ Devis modifié.');
  } catch(e) {
    toast('⚠️ Échec de l\'enregistrement : ' + (e && e.code === 'permission-denied' ? 'accès refusé par Firestore (voir la règle à ajouter pour phenix_devis_en_cours)' : (e && e.message ? e.message : e)));
  }
}
async function supprimerDevis(id){
  if (RESTREINT) { toast('La suppression est réservée à Maxime.'); return; }
  var it = findItem(id); if (!it || it.src !== 'dec') return;
  if (!confirm('Supprimer définitivement ce devis (' + (it.f.client || '') + ' · ' + (it.f.numero || '') + ') ?')) return;
  try { await window._fb.deleteDevisEnCours(it.f.id); toast('🗑️ Devis supprimé.'); }
  catch(e) { toast('⚠️ Suppression impossible : ' + (e && e.message ? e.message : e)); }
}

/* ── Signature : création du projet dans Dossier ── */
function creerProjet(it){
  if (RESTREINT) { toast('Devis signé : Maxime créera le projet dans Dossier.'); return; }
  var f = it.f;
  var devis = { client:f.client || '', adresse:f.adresse || '', email:f.email || '', tel:f.tel || '', objet:f.objet || '', numero:f.numero || '',
                date: normDate(f.dateEmission) || normDate(f.dateEnvoi) || todayISO(), montantHt: parseFloat(f.montantHt) || 0, tva: parseFloat(f.tva) || 20,
                lignes: f.lignes || [], decId: String(f.id) };
  try {
    if (window.parent && window.parent !== window) { window.parent.postMessage({ source:'phenix-espace', action:'creer-projet-devis', devis:devis }, '*'); toast('📁 Ouverture de Dossier — vérifiez la fiche puis « Créer le projet ».'); }
    else toast('Ouvrez Phénix Dossier depuis le Shell pour créer le projet.');
  } catch(e) { toast('Impossible d\'ouvrir Dossier : ' + (e && e.message || e)); }
}
function aConvertir(){ return DEVIS.filter(function(d){ return d && d.statut === 'signe' && !d.projetCree; }); }
function renderConv(){
  var l = aConvertir(), el = $('conv');
  if (RESTREINT || !l.length) { el.innerHTML = ''; return; }   // [Portail] rien à afficher pour l'assistante
  el.innerHTML = '<div class="banner" style="background:var(--green-bg);border-color:rgba(79,209,139,.4);color:var(--green)"><b>' + l.length + ' devis signé' + (l.length > 1 ? 's' : '') + ' à transformer en projet</b>' +
    l.map(function(d){
      return '<div class="row" style="margin-top:8px"><span style="color:var(--text);flex:1;min-width:140px">' + esc(d.client || '') + ' · ' + esc(d.numero || '') + ' · ' + euros(parseFloat(d.montantHt)||0) + ' HT</span>' +
        (RESTREINT ? '<span class="note" style="margin:0">à créer par Maxime</span>' : '<button class="btn green" data-act="convert" data-id="' + esc(String(d.id)) + '">Créer le projet</button>') +
        (RESTREINT ? '' : '<button class="btn ghost" data-act="convdone" data-id="' + esc(String(d.id)) + '">C\'est fait</button>') + '</div>';
    }).join('') + '</div>';
}

/* ── Réglages ── */
function openSettings(){
  var h = '<h2>Réglages de la cadence</h2><div class="sub2">Enregistrés sur cet appareil.</div>' +
    '<div class="fgroup"><span class="lbl">Jours de relance après l\'envoi du devis</span><input class="field" id="c-cad" value="' + esc(CFG.cadence.join(', ')) + '" inputmode="numeric" placeholder="3, 10, 21"></div>' +
    '<div class="fgroup"><span class="lbl">Clôture proposée à (jours après l\'envoi)</span><input class="field" id="c-clo" type="number" min="7" value="' + CFG.cloture + '"></div>' +
    '<div class="fgroup"><span class="lbl">Écart minimum entre deux relances (jours)</span><input class="field" id="c-gap" type="number" min="0" value="' + CFG.ecartMin + '"></div>' +
    '<div class="fgroup"><span class="lbl">Signature des messages</span><input class="field" id="c-sig" value="' + esc(CFG.signature) + '"></div>' +
    '<div class="row"><button class="btn ghost" data-act="c-reset">Valeurs par défaut</button><button class="btn ghost" data-act="closesheet">Annuler</button><button class="btn primary" data-act="c-save">Enregistrer</button></div>';
  openSheet(h);
}
function saveSettings(){
  var cad = ($('c-cad').value || '').split(/[^\d]+/).map(Number).filter(function(n){ return n > 0; }).sort(function(a,b){ return a-b; });
  if (!cad.length) { toast('⚠️ Indiquez au moins un jour de relance.'); return; }
  var clo = parseInt($('c-clo').value, 10);
  if (!(clo > cad[cad.length-1])) { toast('⚠️ La clôture doit venir après la dernière relance.'); return; }
  var c = { cadence:cad, cloture:clo, ecartMin: Math.max(0, parseInt($('c-gap').value,10) || 0), signature: ($('c-sig').value || '').trim() || DEFAULT_CFG.signature };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch(e) {}
  CFG = loadCfg(); closeSheet(); render(); toast('Réglages enregistrés.');
}

/* ── Divers ── */
var toastTimer = null;
function toast(m){ var t = $('rtoast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800); }

async function saveEnvoi(id){
  var it = findItem(id); if (!it) return;
  var v = $('env-' + id) ? $('env-' + id).value : '';
  if (!v) { toast('⚠️ Choisissez une date.'); return; }
  await persist(it, it.src === 'dec' ? { dateEnvoi: v, dateEmission: v } : { dateEnvoi: v }, '✅ Date d\'envoi enregistrée.');
}
async function reopen(id){
  var it = findItem(id); if (!it) return;
  if (!confirm('Rouvrir ce devis (retour « en attente ») ?')) return;
  await persist(it, { statut: it.src === 'dec' ? 'en_cours' : 'en_attente', motifPerte:'', dateCloture:'', relanceProchaine: addDays(todayISO(), 3) }, 'Devis rouvert.');
}
function openDossier(id){
  var it = findItem(id); if (!it) return;
  try {
    if (window.parent && window.parent !== window) window.parent.postMessage({ source:'phenix-espace', action:'open-projet', id:String(it.f.projetId) }, '*');
    else toast('Ouvrez Phénix Dossier depuis le Shell pour accéder au dossier.');
  } catch(e) {}
}

/* ── Événements (délégation) ── */
document.addEventListener('click', function(ev){
  if (ev.target.id === 'rsheet-back') { closeSheet(); return; }
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  switch (act) {
    case 'tab': tab = el.getAttribute('data-tab'); render(); break;
    case 'more': openIds[id] = !openIds[id]; render(); break;
    case 'log': consigner(id); break;
    case 'msg': message(id); break;
    case 'settings': if (!RESTREINT) openSettings(); break;
    case 'closesheet': closeSheet(); break;
    case 's-canal': sheetState.canal = v; renderConsigner(); break;
    case 's-res': if ($('s-motif')) sheetState.motif = $('s-motif').value; sheetState.res = v; sheetState.date = ''; renderConsigner(); break;
    case 's-save': if ($('s-date')) sheetState.date = $('s-date').value; saveConsigner(); break;
    case 'm-canal': syncMsgFields(); var it = findItem(sheetState.id); var g = gabarit(it, v); sheetState.canal = v; sheetState.subject = g.subject; sheetState.text = g.text; renderMessage(); break;
    case 'm-copy': syncMsgFields(); copyText(sheetState.text); break;
    case 'm-ia': personnaliserIA(); break;
    case 'm-open': {
      syncMsgFields();
      var it2 = findItem(sheetState.id), p = it2 ? contact(it2) : {};
      if (sheetState.canal === 'mail' && p.email) window.location.href = 'mailto:' + p.email + '?subject=' + encodeURIComponent(sheetState.subject) + '&body=' + encodeURIComponent(sheetState.text);
      else if (sheetState.canal === 'sms' && p.tel) window.location.href = 'sms:' + String(p.tel).replace(/[^\d+]/g,'') + '?&body=' + encodeURIComponent(sheetState.text);
      break;
    }
    case 'm-log': { syncMsgFields(); var cid = sheetState.id, cc = sheetState.canal === 'appel' ? 'tel' : sheetState.canal; consigner(cid, cc); break; }
    case 'saveenvoi': saveEnvoi(id); break;
    case 'reopen': reopen(id); break;
    case 'opendossier': openDossier(id); break;
    case 'newdevis': if (!RESTREINT) openDevisForm(''); break;
    case 'setstatut': setStatut(id, v); break;
    case 'notiflu': marquerLu([String(id)]); break;
    case 'notiftout': marquerLu(NOTIFS.map(function(n){ return String(n.id); })); break;
    case 'r-motif': sheetState.motif = v; renderRefus(); break;
    case 'r-save': saveRefus(); break;
    case 'editdec': if (!RESTREINT) openDevisForm(id); break;
    case 'deldec': supprimerDevis(id); break;
    case 'd-save': enregistrerDevis(); break;
    case 'convert': { var itc = findItem(id); if (itc) creerProjet(itc); break; }
    case 'convdone': { var itd = findItem(id); if (itd) persist(itd, { projetCree:true }, '✅ Noté.'); break; }
    case 'c-save': saveSettings(); break;
    case 'c-reset': try { localStorage.removeItem(CFG_KEY); } catch(e) {} CFG = loadCfg(); closeSheet(); render(); toast('Valeurs par défaut rétablies.'); break;
  }
});
document.addEventListener('change', function(ev){ if (ev.target && ev.target.id === 'd-file') importerDevisIA(ev.target.files[0]); });
if (RESTREINT) document.body.classList.add('restreint');
$('search').addEventListener('input', function(e){ search = e.target.value.trim(); render(); });

/* ── API appelée par le bloc Firebase (module) ── */
window.R = {
  setUser: function(email){ ME = String(email || '').toLowerCase(); },
  setFactures: function(l){ FACTURES = l || []; LOADED.f = true; render(); },
  setProjets: function(l){ PROJETS = l || []; LOADED.p = true; render(); },
  setDevis: function(l){ DEVIS = l || []; LOADED.d = true; render(); },
  setNotifs: function(l){ NOTIFS = l || []; render(); },
  restreint: RESTREINT,
  onError: function(err, which){
    var m = (err && err.code === 'permission-denied')
      ? (which === 'devis' ? 'Firestore refuse la collection « phenix_devis_en_cours » : ajoutez-la à vos règles de sécurité (voir la règle fournie).' : 'Accès refusé par Firestore (règles de sécurité ou connexion expirée).')
      : 'Erreur de lecture : ' + (err && err.message || err);
    if (which === 'notifs') { return; }   // notifications : ne pas masquer le reste en cas de refus des règles
    if (which === 'devis') { LOADED.d = true; render(); }
    $('errbox').innerHTML = '<div class="banner">⚠️ ' + esc(m) + '</div>';
  },
  // exposé pour les tests
  _etat: etat, _gabarit: gabarit, _bilan: bilan, _cfg: function(){ return CFG; }
};
/* [Portail] ordres du Shell : « Nouveau devis » demandé depuis Dossier ; signal « prêt » pour recevoir l'ordre */
window.addEventListener('message', function(ev){
  var d = ev.data;
  if (d && d.source === 'phenix-shell' && d.action === 'nouveau-devis' && !RESTREINT) { try { window.E.vue('devis'); } catch(e){} openDevisForm(''); }
});
try { if (window.parent && window.parent !== window) window.parent.postMessage({ source:'phenix-espace', ready:true }, '*'); } catch(e) {}
// pastille « à relancer » sur l'onglet Devis
var _renderRel = render;
render = function(){
  _renderRel();
  try { var el = document.querySelector('#rtabs [data-tab="todo"] .n'); var b = document.getElementById('n-devis'); if (b) b.textContent = el ? el.textContent : '0'; } catch(e) {}
};
render();
})();
</script>
<script type="module">
/* [Garde d'accès] un compte client ou artisan, ou une fiche désactivée, ne peut pas utiliser ce module interne même en l'ouvrant directement.
   (Les règles Firestore restent la vraie protection des données ; ceci évite d'exposer l'écran.) */
import { getApps } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
(function(){
  try{
    if(!getApps().length) return;
    const app = getApps()[0], auth = getAuth(app), db = getFirestore(app);
    onAuthStateChanged(auth, async u => {
      if(!u || !u.email) return;
      const em = u.email.toLowerCase(); if(em === 'contact@phenixarchitecte.fr') return;
      let f = null; try { const s = await getDoc(doc(db, 'phenix_users', em)); f = s.exists() ? s.data() : null; } catch(e) { return; }
      const OK = ['admin', 'assistante', 'equipe'];
      if(f && (f.role === 'client' || f.role === 'artisan' || f.actif === false || (f.role && OK.indexOf(f.role) < 0))){
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#0d1b3e;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 16px system-ui,sans-serif';
        o.textContent = f.actif === false ? 'Ce compte est désactivé. Contactez l\u2019administrateur.' : 'Ce compte n\u2019a pas accès à ce module.';
        document.body.appendChild(o);
        try { await signOut(auth); } catch(e) {}
      }
    });
  }catch(e){}
})();
</script>
