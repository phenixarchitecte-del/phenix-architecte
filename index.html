<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phénix-Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0F1E3D,#1B2D5B,#2A5298);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.c{text-align:center;max-width:560px;width:100%}
.brand{font-family:'DM Serif Display',serif;font-size:40px;color:#fff;margin-bottom:6px}
.brand span{color:#7DC6E8}
.sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.1em;text-transform:uppercase;margin-bottom:44px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px}
.card{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.18);border-radius:16px;padding:30px 20px;text-decoration:none;display:block;transition:all .22s}
.card:hover{background:rgba(255,255,255,.16);transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.card:active{transform:translateY(-1px)}
.icon{font-size:38px;margin-bottom:14px}
.title{font-family:'DM Serif Display',serif;font-size:21px;color:#fff;margin-bottom:7px}
.desc{font-size:12px;color:rgba(255,255,255,.55);line-height:1.6}
.footer{font-size:11px;color:rgba(255,255,255,.3)}
@media(max-width:460px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="c">
  <div class="brand">Phénix<span>-Architecture</span></div>
  <div class="sub">Suite de gestion · Maître d'Œuvre</div>
  <div class="cards">
    <a class="card" href="phenix_chantier.html">
      <div class="icon">🏗️</div>
      <div class="title">Gestion de Chantier</div>
      <div class="desc">Lots, intervenants, planning Gantt, comptes rendus, situations de travaux</div>
    </a>
    <a class="card" href="phenix_dossier.html">
      <div class="icon">📁</div>
      <div class="title">Gestion de Dossier</div>
      <div class="desc">Projets, phases MOE, facturation, comptabilité, comptes rendus de réunion</div>
    </a>
  </div>
  <div class="footer">Phénix-Architecture © 2025</div>
</div>
</body>
</html>
