<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phénix-Architecte</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0F1E3D 0%,#1B2D5B 50%,#2A5298 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{text-align:center;max-width:600px;width:100%}
.brand{font-family:'DM Serif Display',serif;font-size:42px;color:#fff;margin-bottom:8px}
.brand span{color:#7DC6E8}
.sub{font-size:14px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;margin-bottom:48px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.card{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:16px;padding:32px 24px;cursor:pointer;transition:all .25s;text-decoration:none;display:block}
.card:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.card-icon{font-size:40px;margin-bottom:16px}
.card-title{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:8px}
.card-desc{font-size:13px;color:rgba(255,255,255,.6);line-height:1.6}
.footer{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.08em}
@media(max-width:480px){.cards{grid-template-columns:1fr}.brand{font-size:32px}}
</style>
</head>
<body>
<div class="container">
  <div class="brand">Phénix<span>-Architecte</span></div>
  <div class="sub">Suite de gestion · Maître d'Œuvre</div>
  <div class="cards">
    <a class="card" href="phenix_chantier.html">
      <div class="card-icon">🏗️</div>
      <div class="card-title">Gestion de Chantier</div>
      <div class="card-desc">Lots, intervenants, planning Gantt, comptes rendus, situations de travaux</div>
    </a>
    <a class="card" href="phenix_dossier.html">
      <div class="card-icon">📁</div>
      <div class="card-title">Gestion de Dossier</div>
      <div class="card-desc">Projets, phases MOE, facturation, comptabilité, comptes rendus de réunion</div>
    </a>
  </div>
  <div class="footer">Phénix-Architecte © 2025 · Tous droits réservés</div>
</div>
</body>
</html>
