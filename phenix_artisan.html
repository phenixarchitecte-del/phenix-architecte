 27/11/2026 — [Espace artisan] Refonte d'après la maquette validée : style de l'espace client (bleu nuit, or, Italiana / Jost, phénix en
   filigrane, volutes) et verre dépoli brillant sur les blocs. Connexion PAR LIEN reçu par mail (comme l'espace client), plus de mot de passe.
   Trois onglets : Aujourd'hui (gros bouton J'arrive / Je pars, photo du chantier, nouveaux plans, photos à prendre, messages),
   Plans (dernière version, pastilles, « Prendre la photo »), Phénix (messages, bouton « Dicter un message » avec phenix_dictee.js).
   Aperçu pour Phénix : ?apercu=<mail de l'entreprise> (rien n'est envoyé). Mêmes collections qu'avant (phenix_users rôle artisan,
   phenix_ch_pointages / messages / photos / vus) : aucune règle Firestore à changer. Page rechargeable hors ligne (phenix_sw.js).

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap">
<style>
/* Charte « avec caractère » de l'espace client + verre dépoli (validé le 27/11/2026) */
:root{--bg:#0b1f4a;--nav:#12285a;--filet:#2f4f86;--or:#d4b26a;--or2:#f3dca6;--t1:#ffffff;--t2:#dfe9f6;--t3:#cfdcef;--t4:#a9c1e3;--t5:#8aa5cc;--red:#e07a5f;
  --verre:linear-gradient(160deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.05) 34%,rgba(255,255,255,.02) 58%,rgba(255,255,255,.07) 100%);
  --verre-bord:1px solid rgba(255,255,255,.45);--verre-ombre:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.16),0 14px 36px rgba(3,10,30,.3);
  --or-fond:linear-gradient(180deg,#f6e2a8 0%,#dcbc76 42%,#c49c4f 100%);--or-ombre:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(120,85,30,.35),0 10px 26px rgba(212,178,106,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t2);font:300 15px 'Jost',system-ui,sans-serif}
a{color:var(--or2)}
button,input,textarea,select{font-family:inherit}
.wm{position:fixed;top:-30px;right:calc(50% - 260px - 70px);width:300px;height:430px;object-fit:contain;opacity:.3;pointer-events:none;z-index:0}
@media (max-width:540px){.wm{right:-70px}}
.volutes{position:fixed;left:50%;top:0;transform:translateX(-50%);width:520px;height:100%;pointer-events:none;z-index:0;opacity:.5}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh;max-width:520px;margin:0 auto}
main{flex:1;padding:18px 18px 110px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:max(4px,env(safe-area-inset-top))}
.marque{font-size:13px;letter-spacing:6px;color:var(--or);font-weight:400}
.qui{font-size:11px;color:var(--t5);text-align:right}
.tete{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--t5);font-weight:400}
.h1{margin:0;font:400 44px/1.05 'Italiana',serif;color:var(--t1)}
.h1sel{font:400 36px/1.1 'Italiana',serif;color:var(--t1);background:transparent;border:0;border-bottom:.75px solid var(--filet);padding:0 0 4px;max-width:100%}
.h1sel option{color:#0b1f4a;font:16px Jost,sans-serif}
.h2{font:400 22px 'Italiana',serif;color:var(--t1)}
.sous{font-size:13px;color:var(--t4)}
.aide{font-size:12px;line-height:1.5;color:var(--t5)}.aide.c{text-align:center}
.txt{font-size:13px;line-height:1.55;color:var(--t3)}
.or2{color:var(--or2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bloc{background:var(--verre);-webkit-backdrop-filter:blur(4px) saturate(160%);backdrop-filter:blur(4px) saturate(160%);border:var(--verre-bord);box-shadow:var(--verre-ombre);border-radius:22px}
.pad{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.liste{padding:2px 16px;display:flex;flex-direction:column}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;background:none;border:0;border-top:.75px solid rgba(207,220,239,.18);color:var(--t2);font-size:14px;text-align:left;padding:0;width:100%;cursor:pointer}
.liste>.ligne:first-child{border-top:0}
div.ligne{cursor:default}
.chev{color:var(--or);font-size:20px}
.centre{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0 10px}
.rond{width:220px;height:220px;border-radius:50%;font:400 42px 'Italiana',serif;cursor:pointer}
.rond.or{border:0;color:#0b1f4a;background:radial-gradient(70% 55% at 35% 25%,#fff3cc 0%,#e6c783 38%,#c99f50 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 10px rgba(120,85,30,.35),0 0 0 10px rgba(212,178,106,.16),0 0 0 22px rgba(212,178,106,.07),0 18px 40px rgba(212,178,106,.35)}
.rond.verre{border:1.5px solid var(--or);color:var(--or2);background:var(--verre);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:var(--verre-ombre)}
.rond:active{transform:scale(.97)}
.btn-or{min-height:54px;border-radius:22px;border:0;background:var(--or-fond);box-shadow:var(--or-ombre);color:#0b1f4a;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:0 18px}
.btn-or.large{min-height:62px;font-size:16px}
.btn-or.rec{background:#fcd34d}
.btn-verre{min-height:46px;padding:0 16px;border-radius:18px;border:1px solid var(--or);color:var(--or2);background:var(--verre);box-shadow:var(--verre-ombre);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pile{display:flex;flex-direction:column;gap:10px}
.rangee{display:flex;align-items:center;gap:14px;min-height:78px;padding:0 18px;color:var(--t2);text-align:left;cursor:pointer;width:100%}
.rangee b{font-weight:500;color:var(--t1);font-size:15px}
.col{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.pill{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--or);color:var(--or2);white-space:nowrap}
.barre{display:flex;align-items:center;gap:12px}
.barre b{font-weight:500;color:var(--t1)}
.pgs{border-radius:14px;background:#f7f8fb;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:56vh}
.pg{position:relative;background:#fff}.pg canvas,.pg img{width:100%;display:block}
.dot{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;border:3px solid var(--or);font-size:14px;cursor:pointer}
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--t5);padding:0 4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--nav)}
.fil{display:flex;flex-direction:column;gap:14px;justify-content:flex-end;flex:1;min-height:120px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:82%}
.msg.ph{align-self:flex-start}.msg.me{align-self:flex-end;align-items:flex-end}
.bulle{padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;border-radius:18px}
.msg.ph .bulle{border-radius:18px 18px 18px 6px;color:var(--t2)}
.msg.me .bulle{border-radius:18px 18px 6px 18px;background:rgba(212,178,106,.16);border:.75px solid var(--or);color:var(--t1)}
.msg small{font-size:11px;color:var(--t5)}
.envoi{display:flex;flex-direction:column;gap:10px}
.rangee2{display:flex;gap:8px;align-items:stretch}
.champ{width:100%;min-height:48px;padding:12px 14px;color:var(--t1);font-size:15px;border-radius:18px}
input.champ{background:rgba(255,255,255,.08);border:var(--verre-bord)}
textarea.champ{resize:vertical}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;border-radius:24px;z-index:5;
  background:linear-gradient(160deg,rgba(18,40,90,.75),rgba(18,40,90,.6));-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);border:var(--verre-bord);box-shadow:var(--verre-ombre)}
nav button{min-height:52px;border-radius:18px;border:1px solid transparent;background:none;color:var(--t3);font-size:14px;cursor:pointer}
nav button.on{border-color:var(--or);background:rgba(212,178,106,.14);color:var(--or2);font-weight:500}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#12285a;border:1px solid var(--or);color:var(--or2);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  let du=''; for(let i=0;i<(m.data().parts||0);i++){ const c=await getDoc(doc(db,C.media,id+'__'+i)); if(c.exists()) du+=c.data().d||''; }
  return mcache[id]=du;
}
function shrink(file,max){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej;
  im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',0.8)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

async function boot(email){

  try{ const v=await getDoc(doc(db,C.vus,email)); if(v.exists()) S.vus=Object.assign({vus:{},rappel:{}}, v.data()); }catch(e){}

  listen(C.lots, query(collection(db,C.lots), where('interv','==',S.me.intervId)),'lots', l=>S.chIds.indexOf(Number(l.chantierId))>=0);
  listen(C.plans, query(collection(db,C.plans), where('visibleIntervs','array-contains',S.me.intervRaw)),'plans', p=>S.chIds.indexOf(Number(p.chantierId))>=0);
  listen(C.pointages, query(collection(db,C.pointages), where('intervenantId','==',S.me.intervId)),'pointages');

  render();
}

  if(!l.length) return h+'<div class="bloc pad"><b>Aucun plan pour l\'instant</b><span class="aide">Les plans de votre lot apparaîtront ici dès que Phénix les publie.</span></div>';
  h+='<div class="pile">'+l.map(p=>{ const nph=(p.pastilles||[]).filter(a=>a.type==='photo'&&a.statut!=='verifiee'&&!(p.photos||[]).some(x=>x.pastilleId===a.id)).length;
    return '<button type="button" class="bloc rangee" onclick="openPlan(\''+p.id+'\')"><span class="col"><b>'+esc(p.nom)+'</b><span class="aide">Version '+(p.version||1)+' · '+(p.pastilles||[]).length+' pastille'+((p.pastilles||[]).length>1?'s':'')+(nph?' dont '+nph+' à photographier':'')+'</span></span>'+(isNew(p)?'<span class="pill">Nouveau</span>':ICO.chev)+'</button>'; }).join('')+'</div>';
  return h+'<span class="aide" style="padding:0 6px">Vous ne voyez que les plans que Phénix a ouverts à votre entreprise.</span>';
}
function vPlanDetail(){
  const p=planCur(); if(!p) return '';
  const a=(p.pastilles||[]).find(x=>x.id===S.pastId), photos=a?(p.photos||[]).filter(x=>x.pastilleId===a.id):[];
  let h='<div class="barre"><button type="button" class="btn-verre" onclick="S_back()">‹ Mes plans</button><span class="col"><b>'+esc(p.nom)+'</b><span class="aide">Version '+(p.version||1)+' · deux doigts pour zoomer</span></span></div>';
  h+='<div class="pgs" id="pgs"><div class="aide c" style="padding:30px">Chargement du plan…</div></div>';
  h+='<div class="legende"><span>● à photographier</span><span>■ information</span><span>✓ vérifiée par Phénix</span></div>';
  if(a){ const n=(p.pastilles||[]).indexOf(a)+1, verif=a.statut==='verifiee';
    h+='<div class="bloc pad"><span class="eyebrow">Pastille '+n+' · '+(verif?'✓ vérifiée':a.type==='photo'?'à photographier':a.type==='question'?'question':'information')+'</span><span class="h2">'+esc(a.label||('Pastille '+n))+'</span>'+(a.note?'<span class="txt">'+esc(a.note)+'</span>':'')+
      (photos.length?'<div class="thumbs">'+photos.map(x=>'<img alt="Photo de la pastille" data-mid="'+esc(x.mediaId||'')+'" src="'+esc(x.dataUrl||'')+'">').join('')+'</div>':'')+
      '<label class="btn-or">'+ICO.photo+'Prendre la photo<input type="file" accept="image/*" capture="environment" multiple hidden onchange="addPhotoPastille(event)"></label><span class="aide">Vos photos vont à Phénix, qui les vérifie.</span></div>'; }
  else h+='<span class="aide c">Touchez une pastille pour la voir et y ajouter une photo.</span>';
  h+='<button type="button" class="btn-verre" id="btn-pose" onclick="poserPastille()">Signaler un point sur le plan</button>';
  return h;
}
function vPhenix(){
  const l=S.messages.filter(x=>x.chantierId==S.ch).sort((a,b)=>a.date<b.date?-1:1);
  let h='<div class="top"><span class="marque">PHÉNIX</span><span class="qui">'+esc(chNom())+'</span></div><div class="tete"><h1 class="h1">Phénix</h1><span class="sous">Vos messages vont à Phénix, jamais directement au client.</span></div>';
  h+='<div class="fil">'+(l.map(x=>'<div class="msg '+(x.de==='artisan'?'me':'ph')+'"><span class="bulle'+(x.de==='artisan'?'':' bloc')+'">'+esc(x.texte)+'</span><small>'+(x.de==='artisan'?'Vous':'Phénix')+' · '+new Date(x.date).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</small></div>').join('')||'<span class="aide c">Aucun message pour l\'instant.</span>')+'</div>';
  h+='<div class="envoi"><button type="button" class="btn-or large" id="msg-mic">'+ICO.mic+'<span>Dicter un message</span></button>'+
    '<label class="eyebrow" for="msg-t">Ou écrire</label><div class="rangee2"><textarea id="msg-t" rows="2" class="champ bloc" placeholder="Votre message à Phénix"></textarea><button type="button" class="btn-verre" onclick="sendMsg()">Envoyer</button></div></div>';
  return h;
}
let DIC=null;
function bindPhenix(){
  const b=$('msg-mic'), ta=$('msg-t'); if(!b) return;
  b.onclick=()=>{
    if(DIC){ DIC.stop(); return; }
    if(!window.PhenixDictee||!PhenixDictee.dispo){ toast('Dictée indisponible ici : utilisez le micro du clavier.'); ta.focus(); return; }
    b.querySelector('span').textContent='■ Terminer'; b.classList.add('rec');
    DIC=PhenixDictee.ecouter({ base:ta.value, onTexte:a=>{ ta.value=a; },
      onEtat:(e,m)=>{ if(e==='erreur') toast(m); if(e==='fin'||e==='erreur'){ DIC=null; b.querySelector('span').textContent='Dicter un message'; b.classList.remove('rec'); if(e==='fin'&&ta.value.trim()) toast('Relisez, puis touchez « Envoyer ».'); } } });
  };
}

try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('phenix_sw.js').catch(()=>{}); }catch(e){}
window.__S = S; // test
